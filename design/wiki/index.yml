version: 2
domains:
  - id: language
    file: language/index.md
    topics: [syntax, types, imports, arguments, removals, sharing, language decisions]
    paths:
      - "src/compiler/syntax/**"
      - "documentation/core-language/**"
      - "tests/lang/**"
      - "tests/diagnostics/**"
  - id: compiler
    file: compiler/index.md
    topics: [checking, lowering, MIR, Cranelift, build, module loading, fault sites, compile-time scaling]
    paths:
      - "src/compiler/check/**"
      - "src/compiler/mir/**"
      - "src/compiler/lower/**"
      - "src/compiler/emit/**"
      - "src/cli/**"
      - "src/compiler/link/**"
      - "src/compiler/own/**"
      - "src/compiler/opt/**"
      - "documentation/contributing/compiler/**"
  - id: runtime
    file: runtime/index.md
    topics: [cancellation, cleanup, resources, networking, native APIs, standard library]
    paths:
      - "src/runtime/core/**"
      - "src/abi/**"
      - "src/runtime/std/**"
      - "src/stdlib/**"
      - "documentation/core-language/cleanup/**"
      - "documentation/core-language/types/references.md"
      - "tests/lang/projects/**"
  - id: tooling-and-docs
    file: tooling-and-docs/index.md
    topics: [documentation, generated references, editor tooling, navigation, CLI, diagnostics]
    paths:
      - "src/tooling/**"
      - "src/lsp/**"
      - "src/cli/**"
      - "extensions/**"
      - "documentation/**"
      - "website/**"
      - "src/stdlib/**"
      - "README.md"
  - id: repository
    file: repository/index.md
    topics: [repository cleanup, publication, CI, releases, repo checks]
    paths:
      - "tools/**"
      - "toolchain/**"
      - ".github/workflows/**"
      - "documentation/developer-tooling/implementation.md"
      - "documentation/contributing/**"
      - "tools/repo-check.ms"
      - "CMakeLists.txt"
      - "Makefile"
  - id: stdlib-design
    file: stdlib-design/index.md
    topics: [stdlib API shape, failure modes, Result and Error, write and write_bytes, Set construction, module consolidation]
    paths:
      - "src/stdlib/**"
      - "tests/lang/stdlib/**"
  - id: testing-and-conformance
    file: testing-and-conformance/index.md
    topics: [test layers, conformance corpus, ms test, fuzzing, fixture migration]
    paths:
      - "tests/**"
      - "tools/conform-run.ms"
  - id: benchmarks-and-performance
    file: benchmarks-and-performance/index.md
    topics: [performance benchmarks, ns/op, profiling guide]
    paths:
      - "bench/perf/**"
      - "bench/agent/**"
      - "bench/**"
  - id: llvm-langref
    file: llvm-langref/index.md
    topics: [LLVM IR, language reference, instructions, intrinsics, attributes, metadata, direct LLVM emission]
    paths:
      - "src/compiler/emit/**"
