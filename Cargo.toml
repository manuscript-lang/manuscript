[workspace]
members = ["crates/*"]
# A bare `cargo build/test/check` covers the compiler and tools. The native runtime (`ms-native` and
# the `ms-std-*` crates) is built by `cargo xtask runtime` and embedded by `ms-cli`'s build script; test it with `-p` or
# `--workspace`.
default-members = [
    "crates/ms-check",
    "crates/ms-cli",
    "crates/ms-clif",
    "crates/ms-mir-llvm",
    "crates/ms-conform",
    "crates/ms-build",
    "crates/ms-driver",
    "crates/ms-json",
    "crates/ms-lower",
    "crates/ms-lsp",
    "crates/ms-mir",
    "crates/ms-mir-llvm",
    "crates/ms-repo-check",
    "crates/ms-rt",
    "crates/ms-rt-abi",
    "crates/ms-syntax",
    "crates/ms-tooling",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
# Only ms-rt and ms-rt-abi (the C ABI the compiled code links against) opt out.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = 1
panic = "abort"

[profile.dev]
# No `panic = "abort"`: test harnesses always unwind, so an aborting dev profile built every crate twice
# under `--all-targets` (once for the binaries, once for the tests).
# Line tables are enough for backtraces and profiles; full variable info slows every build and link.
debug = "line-tables-only"

# The front end (parse, check, lower, MIR) runs once per `ms` process in every corpus, e2e and CLI test, and an
# unoptimized build spends about 0.2 s on a four-line file, almost all of it loading the standard library.
# Optimizing these crates cuts that to 0.06 s and the corpus parse and check phases by about 3.4x; the extra
# build time is small and cached by sccache.
[profile.dev.package.ms-syntax]
opt-level = 2
[profile.dev.package.ms-check]
opt-level = 2
[profile.dev.package.ms-lower]
opt-level = 2
[profile.dev.package.ms-mir]
opt-level = 2
[profile.dev.package.ms-json]
opt-level = 2

# Tests that loop over every split point, byte or random case of a checksum, hash, codec or big-number routine,
# and the Cranelift code generator's native tests, spent most of the Rust test time unoptimized (checksum 12 s,
# oracle 14 s, inflate 5 s, ms-clif native 70 s on four cores); optimized they take a fraction, and sccache
# caches the build cost. Programs the `ms` binary compiles are no faster for it (measured on yaml, regex, bigint).
[profile.dev.package.ms-std-core]
opt-level = 2
[profile.dev.package.ms-std-crypto]
opt-level = 2
[profile.dev.package.ms-std-bigint]
opt-level = 2
[profile.dev.package.ms-std-archive]
opt-level = 2
[profile.dev.package.ms-clif]
opt-level = 2
[profile.dev.package.ms-inflate]
opt-level = 2

# The RustCrypto crates behind @std/crypto, for the same tests.
[profile.dev.package.crypto-bigint]
opt-level = 2
[profile.dev.package.rsa]
opt-level = 2
[profile.dev.package.p256]
opt-level = 2
[profile.dev.package.p384]
opt-level = 2
[profile.dev.package.p521]
opt-level = 2
[profile.dev.package.primeorder]
opt-level = 2
[profile.dev.package.ed25519-dalek]
opt-level = 2
[profile.dev.package.curve25519-dalek]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 2
[profile.dev.package.sha3]
opt-level = 2
[profile.dev.package.aes]
opt-level = 2
[profile.dev.package.ghash]
opt-level = 2
[profile.dev.package.polyval]
opt-level = 2

# The ms-cli build script gzips the two runtime archives (about 45 MB each). Build dependencies are
# unoptimized by default, in release too, and that took about 40 s of every build that reran it; optimized
# it takes about 5 s.
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.flate2]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.adler2]
opt-level = 3

# Cranelift is slow to build unoptimized; keep it lightly optimized in dev builds. Its debug assertions are
# off: the single-pass register allocator's `validate_lru` alone was a third of all instructions in a debug
# `ms test` (every program the corpus and the e2e tests compile goes through it).
[profile.dev.package.regalloc2]
opt-level = 1
debug-assertions = false
overflow-checks = false

[profile.dev.package.cranelift-codegen]
opt-level = 1
debug-assertions = false
overflow-checks = false
[profile.dev.package.cranelift-frontend]
opt-level = 1
debug-assertions = false
overflow-checks = false
[profile.dev.package.cranelift-object]
opt-level = 1
debug-assertions = false
overflow-checks = false

# The dev profile with the Cranelift crates' own debug assertions back on. `main` builds `ms` with it
# (`cargo build --profile checked -p ms-cli`) and runs the Cranelift corpus, so an assertion that fires on
# the IR we generate is still caught within 30 minutes of a merge; pull requests skip it for speed.
[profile.checked]
inherits = "dev"
[profile.checked.package.regalloc2]
debug-assertions = true
overflow-checks = true
[profile.checked.package.cranelift-codegen]
debug-assertions = true
overflow-checks = true
[profile.checked.package.cranelift-frontend]
debug-assertions = true
overflow-checks = true
[profile.checked.package.cranelift-object]
debug-assertions = true
overflow-checks = true

# Cranelift 0.136.0 plus one change: the x64 backend branches directly on the overflow flag of
# `sadd_overflow`, `ssub_overflow` and `usub_overflow` (as it already does for `uadd_overflow`
# and the multiplies) instead of `seto`, `test`, `jne`. See vendor/cranelift-codegen/PATCH.md.
[patch.crates-io]
cranelift-codegen = { path = "vendor/cranelift-codegen" }
