[workspace]
members = ["crates/*"]
exclude = ["experiments"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
# Only ms-rt and ms-rt-abi (the C ABI the compiled code links against) opt out.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = 1
panic = "abort"

[profile.dev]
panic = "abort"
