[workspace]
members = ["crates/*"]
exclude = ["experiments"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
# Only ms-rt and ms-rt-abi (the C ABI the compiled code links against) opt out.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = 1
panic = "abort"

[profile.dev]
panic = "abort"

# Cranelift is slow to build unoptimized; keep it lightly optimized in dev builds.
[profile.dev.package.regalloc2]
opt-level = 1

[profile.dev.package.cranelift-codegen]
opt-level = 1
[profile.dev.package.cranelift-frontend]
opt-level = 1
[profile.dev.package.cranelift-object]
opt-level = 1
