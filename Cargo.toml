[workspace]
members = ["crates/*"]
exclude = ["experiments"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[profile.release]
debug = 1
panic = "abort"

[profile.dev]
panic = "abort"

# Cranelift is slow to build unoptimized; keep it lightly optimized in dev builds.
[profile.dev.package."cranelift*"]
opt-level = 1
[profile.dev.package.regalloc2]
opt-level = 1
