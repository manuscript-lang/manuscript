[workspace]
members = ["crates/*"]
exclude = ["experiments"]
# A bare `cargo build/test/check` covers the compiler and tools. The native runtime (`ms-native` and
# the `ms-std-*` crates) is built by `cargo xtask runtime` and embedded by `ms-cli`'s build script; test it with `-p` or
# `--workspace`.
default-members = [
    "crates/ms-check",
    "crates/ms-cli",
    "crates/ms-clif",
    "crates/ms-conform",
    "crates/ms-build",
    "crates/ms-driver",
    "crates/ms-json",
    "crates/ms-lower",
    "crates/ms-lsp",
    "crates/ms-mir",
    "crates/ms-repo-check",
    "crates/ms-rt",
    "crates/ms-rt-abi",
    "crates/ms-syntax",
    "crates/ms-tooling",
]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
# Only ms-rt and ms-rt-abi (the C ABI the compiled code links against) opt out.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = 1
panic = "abort"

[profile.dev]
panic = "abort"
# Line tables are enough for backtraces and profiles; full variable info slows every build and link.
debug = "line-tables-only"

# Cranelift is slow to build unoptimized; keep it lightly optimized in dev builds.
[profile.dev.package.regalloc2]
opt-level = 1

[profile.dev.package.cranelift-codegen]
opt-level = 1
[profile.dev.package.cranelift-frontend]
opt-level = 1
[profile.dev.package.cranelift-object]
opt-level = 1

# Cranelift 0.136.0 plus one change: the x64 backend branches directly on the overflow flag of
# `sadd_overflow`, `ssub_overflow` and `usub_overflow` (as it already does for `uadd_overflow`
# and the multiplies) instead of `seto`, `test`, `jne`. See vendor/cranelift-codegen/PATCH.md.
[patch.crates-io]
cranelift-codegen = { path = "vendor/cranelift-codegen" }
