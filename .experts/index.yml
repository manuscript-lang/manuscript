version: 1
experts:
  - id: language
    file: language.md
    topics: [syntax, types, imports, arguments, removals, sharing, language decisions]
    paths:
      - "pkg/syntax/**"
      - "pkg/lexer/**"
      - "pkg/parser/**"
      - "documentation/core-language/**"
      - "tests/e2e/**"
  - id: compiler
    file: compiler.md
    topics: [checking, lowering, generated Go, build levels, native omissions, standalone bundles, fault sites]
    paths:
      - "pkg/frontend/**"
      - "pkg/checker/**"
      - "pkg/lower/**"
      - "pkg/compiler/**"
      - "pkg/build/**"
      - "pkg/project/**"
      - "documentation/contributing/compiler/**"
  - id: runtime
    file: runtime.md
    topics: [concurrency, cancellation, cleanup, resources, networking, native APIs, standard library]
    paths:
      - "pkg/runtime/**"
      - "pkg/stdlib/**"
      - "documentation/concurrency/**"
      - "documentation/core-language/cleanup/**"
      - "documentation/core-language/types/references.md"
      - "documentation/standard-library/**"
      - "tests/e2e/testdata/projects/**"
  - id: tooling-and-docs
    file: tooling-and-docs.md
    topics: [documentation, generated references, editor tooling, navigation, CLI, diagnostics]
    paths:
      - "pkg/tooling/**"
      - "extensions/**"
      - "documentation/**"
      - "website/**"
      - "internal/cli/**"
      - "cmd/**"
      - "pkg/stdlib/**"
      - "README.md"
  - id: repository
    file: repository.md
    topics: [repository cleanup, package moves, publication, CI, releases]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - "documentation/developer-tooling/implementation.md"
      - "documentation/contributing/**"
      - "go.mod"
      - "Makefile"
  - id: stdlib-design
    file: stdlib-design.md
    topics: [stdlib API shape, failure modes, Result and Error, TextError, write and write_bytes, Set construction, module consolidation]
    paths:
      - "pkg/stdlib/**"
      - "documentation/standard-library/**"
      - "tests/e2e/testdata/stdlib/**"
  - id: testing-and-conformance
    file: testing-and-conformance.md
    topics: [test layers, accept and reject fixtures, ms test, conformance, fuzzing, fixture migration]
    paths:
      - "tests/**"
      - "scripts/conformance.ms"
      - "scripts/ci-test.sh"
      - "scripts/repo-check/**"
      - "**/*_test.go"
  - id: benchmarks-and-performance
    file: benchmarks-and-performance.md
    topics: [performance benchmarks, agent benchmark, ns/op, Go parity, profiling guide]
    paths:
      - "perf-bench/**"
      - "agent-bench/**"
      - "bench/**"
      - "scripts/benchmarks/**"
      - "scripts/bench-*/**"
      - "scripts/stdlib-bench.sh"
