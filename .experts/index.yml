version: 1
experts:
  - id: language
    file: language.md
    topics: [syntax, types, imports, arguments, removals, sharing, language decisions]
    paths:
      - "crates/ms-syntax/**"
      - "documentation/core-language/**"
      - "tests/e2e/testdata/accept/**"
      - "tests/e2e/testdata/reject/**"
  - id: compiler
    file: compiler.md
    topics: [checking, lowering, MIR, Cranelift, build, module loading, fault sites, compile-time scaling]
    paths:
      - "crates/ms-check/**"
      - "crates/ms-mir/**"
      - "crates/ms-lower/**"
      - "crates/ms-clif/**"
      - "crates/ms-linker/**"
      - "crates/ms-driver/**"
      - "crates/ms-build/**"
      - "crates/ms-native/**"
      - "crates/ms-project/**"
      - "documentation/contributing/compiler/**"
  - id: runtime
    file: runtime.md
    topics: [cancellation, cleanup, resources, networking, native APIs, standard library]
    paths:
      - "crates/ms-rt/**"
      - "crates/ms-rt-abi/**"
      - "crates/ms-std-*/**"
      - "stdlib/**"
      - "documentation/core-language/cleanup/**"
      - "documentation/core-language/types/references.md"
      - "tests/e2e/testdata/projects/**"
  - id: tooling-and-docs
    file: tooling-and-docs.md
    topics: [documentation, generated references, editor tooling, navigation, CLI, diagnostics]
    paths:
      - "crates/ms-tooling/**"
      - "crates/ms-lsp/**"
      - "crates/ms-cli/**"
      - "crates/ms-guide/**"
      - "extensions/**"
      - "documentation/**"
      - "website/**"
      - "stdlib/**"
      - "README.md"
  - id: repository
    file: repository.md
    topics: [repository cleanup, publication, CI, releases, repo checks]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - "documentation/developer-tooling/implementation.md"
      - "documentation/contributing/**"
      - "crates/ms-repo-check/**"
      - "Cargo.toml"
      - "Makefile"
  - id: stdlib-design
    file: stdlib-design.md
    topics: [stdlib API shape, failure modes, Result and Error, TextError, write and write_bytes, Set construction, module consolidation]
    paths:
      - "stdlib/**"
      - "tests/e2e/testdata/stdlib/**"
  - id: testing-and-conformance
    file: testing-and-conformance.md
    topics: [test layers, conformance corpus, ms test, fuzzing, fixture migration]
    paths:
      - "tests/**"
      - "crates/ms-conform/**"
  - id: benchmarks-and-performance
    file: benchmarks-and-performance.md
    topics: [performance benchmarks, agent benchmark, ns/op, profiling guide]
    paths:
      - "bench/perf/**"
      - "bench/agent/**"
      - "bench/**"
