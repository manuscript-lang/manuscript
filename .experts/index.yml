version: 1
experts:
  - id: language
    file: language.md
    topics: [syntax, types, imports, arguments, removals, sharing, language decisions]
    paths:
      - "syntax/**"
      - "lexer/**"
      - "parser/**"
      - "checker/**"
      - "compiler/**"
      - "project/**"
      - "documentation/core-language/**"
      - "documentation/modules-and-capabilities/**"
      - "tests/e2e/**"
  - id: runtime
    file: runtime.md
    topics: [concurrency, cancellation, cleanup, resources, networking, native APIs]
    paths:
      - "runtime/**"
      - "stdlib/**"
      - "documentation/concurrency/**"
      - "documentation/ownership-and-cleanup/**"
      - "documentation/standard-library/**"
      - "tests/e2e/testdata/projects/**"
  - id: tooling-and-docs
    file: tooling-and-docs.md
    topics: [documentation, generated references, editor tooling, navigation, CLI, builds]
    paths:
      - "tooling/**"
      - "extensions/**"
      - "documentation/**"
      - "website/**"
      - "internal/cli/**"
      - "project/**"
      - "stdlib/**"
      - "cmd/**"
      - "compiler/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "README.md"
      - "documentation/implementation.md"
