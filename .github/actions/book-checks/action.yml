name: Book checks
description: Validate the design book's URL prefixes and production output. Needs a checkout and a Rust toolchain.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
    # book-check below runs docs-check and the highlighting test.
    - uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.146.7'
        extended: true
    - name: Validate project URL prefixes and production output
      shell: bash
      run: |
        make book-check
        make book
        node --test tests/docs/publication.test.cjs
