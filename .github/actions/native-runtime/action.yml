name: Native runtime
description: Restore or build the native runtime archives, cached on the runtime sources. Pull requests also restore main's entry for the same sources.

inputs:
  os:
    description: linux, darwin or windows.
    required: true
  arch:
    description: amd64 or arm64.
    required: true

runs:
  using: composite
  steps:
    # The runtime archives take 45 to 60 s to build and change only when the runtime crates do, so they are
    # cached on those sources. `ms-cli`'s build script rejects an archive older than the runtime sources by
    # modification time, so a restored archive is touched. Pull requests skip the allocation-profiling
    # archive (`ms profile --allocs`); main and manual runs build it so the real-runtime test covers it.
    # A pull request cache is visible to that pull request only, so a pull request that leaves the runtime
    # alone restores main's entry for the same sources (`restore-keys`: the warm-caches workflow saves one
    # per push to main) instead of building the archives again; main's is a superset of what it needs.
    - name: Hash the runtime sources
      id: hash
      shell: bash
      run: echo "value=${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'vendor/**', 'crates/xtask/**', 'crates/ms-native/**', 'crates/ms-rt/**', 'crates/ms-rt-abi/**', 'crates/ms-rt-hot/**', 'crates/ms-std-*/**', 'crates/ms-decimal/**', 'crates/ms-inflate/**', 'runtime/{include,symbols,sys,core,io,net,std}/**', 'runtime/third_party/{libs.sh,build.sh,c-libs.lock}') }}" >> "$GITHUB_OUTPUT"
    - name: Restore the native runtime
      id: runtime
      uses: actions/cache@v6
      with:
        path: |
          target/ms-native/*.a
          target/ms-native/*.ll
        key: ms-native-${{ github.event_name == 'pull_request' && 'pr' || 'allocs' }}-${{ inputs.os }}-${{ inputs.arch }}-${{ env.ImageVersion }}-${{ steps.hash.outputs.value }}
        restore-keys: |
          ms-native-allocs-${{ inputs.os }}-${{ inputs.arch }}-${{ env.ImageVersion }}-${{ steps.hash.outputs.value }}
    # The musl archive folds in pinned builds of the C libraries made with musl-gcc (system packages are glibc's);
    # they take about 90 s, so they are cached on the build script's own key (pins, script, compiler, triple).
    - name: Key the pinned musl C libraries
      id: musl-libs
      if: steps.runtime.outputs.cache-matched-key == '' && runner.os == 'Linux'
      shell: bash
      run: echo "key=$(CC=musl-gcc MS_C_LIBS=pinned sh runtime/third_party/build.sh key "$(uname -m)-unknown-linux-musl")" >> "$GITHUB_OUTPUT"
    - name: Restore the pinned musl C libraries
      if: steps.runtime.outputs.cache-matched-key == '' && runner.os == 'Linux'
      uses: actions/cache@v6
      with:
        path: target/c-libs/*-unknown-linux-musl-pinned-*
        key: c-libs-musl-${{ inputs.arch }}-${{ steps.musl-libs.outputs.key }}
    - name: Build the native runtime
      if: steps.runtime.outputs.cache-matched-key == ''
      shell: bash
      run: cargo xtask runtime ${{ github.event_name != 'pull_request' && '--alloc-profile' || '' }}
    # Also after a build: a restore-key hit restores main's archives (cache-matched-key is empty then, so the
    # build runs), and the build skips the allocation-profiling archive on pull requests, leaving the
    # restored one older than the runtime sources.
    - name: Mark the restored runtime as fresh
      shell: bash
      run: touch target/ms-native/*.a target/ms-native/*.ll
