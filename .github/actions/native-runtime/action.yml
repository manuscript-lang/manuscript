name: Native runtime
description: Restore or build the native runtime archives, cached on the runtime sources. Pull requests also restore main's entry for the same sources.

inputs:
  os:
    description: linux, darwin or windows.
    required: true
  arch:
    description: amd64 or arm64.
    required: true

runs:
  using: composite
  steps:
    # The runtime archives take 45 to 60 s to build and change only when the runtime crates do, so they are
    # cached on those sources. `ms-cli`'s build script rejects an archive older than the runtime sources by
    # modification time, so a restored archive is touched. Pull requests skip the allocation-profiling
    # archive (`ms profile --allocs`); main and manual runs build it so the real-runtime test covers it.
    # A pull request cache is visible to that pull request only, so a pull request that leaves the runtime
    # alone restores main's entry for the same sources (`restore-keys`: the warm-caches workflow saves one
    # per push to main) instead of building the archives again; main's is a superset of what it needs.
    - name: Hash the runtime sources
      id: hash
      shell: bash
      run: echo "value=${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'vendor/**', 'crates/xtask/**', 'crates/ms-native/**', 'crates/ms-rt/**', 'crates/ms-rt-abi/**', 'crates/ms-rt-hot/**', 'crates/ms-std-*/**', 'crates/ms-decimal/**', 'crates/ms-inflate/**') }}" >> "$GITHUB_OUTPUT"
    - name: Restore the native runtime
      id: runtime
      uses: actions/cache@v6
      with:
        path: |
          target/ms-native/*.a
          target/ms-native/*.ll
          target/leak-stats/*/release/libms_native.a
        key: ms-native-leak-${{ github.event_name == 'pull_request' && 'pr' || 'allocs' }}-${{ inputs.os }}-${{ inputs.arch }}-${{ steps.hash.outputs.value }}
        restore-keys: |
          ms-native-leak-allocs-${{ inputs.os }}-${{ inputs.arch }}-${{ steps.hash.outputs.value }}
    - name: Build the native runtime
      if: steps.runtime.outputs.cache-matched-key == ''
      shell: bash
      run: cargo xtask runtime ${{ github.event_name == 'pull_request' && '' || '--alloc-profile' }}
    # The leak-counting runtime (`tools/lib.ms` `use_stats_runtime`) is a second full build of the runtime, so
    # main builds it with the others and a pull request restores it: `LEAK_STATS_PREBUILT` makes the tool use
    # the restored archive. A pull request that changes the runtime sources builds it itself.
    - name: Build the leak-counting runtime
      if: steps.runtime.outputs.cache-matched-key == '' && inputs.os == 'linux'
      shell: bash
      env:
        CARGO_TARGET_DIR: target/leak-stats
        CARGO_PROFILE_RELEASE_DEBUG: '0'
      run: |
        host=$(rustc -vV | sed -n 's/^host: //p')
        cargo build --release --locked -q -p ms-native --features ms-rt/stats,ms-native/entry --target "$host"
    - name: Mark the restored runtime as fresh
      if: steps.runtime.outputs.cache-matched-key != ''
      shell: bash
      run: touch target/ms-native/*.a target/ms-native/*.ll target/leak-stats/*/release/libms_native.a 2>/dev/null || true
