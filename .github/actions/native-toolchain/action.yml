name: Native toolchain
description: Install the C libraries the runtime folds in, on Windows fetch the llvm-mingw that ms links programs with, and cache the lld and LLVM tools ms downloads on first use.

inputs:
  os:
    description: Target os (linux, darwin or windows).
    required: true
  arch:
    description: Target arch (amd64 or arm64).
    required: true

runs:
  using: composite
  steps:
    # `cmake -P cmake/BuildRuntime.cmake` folds libuv, OpenSSL and the other C libraries into the runtime archives; they come
    # from the system packages through src/runtime/third_party/libs.sh, with CMake, Ninja and ccache (Windows takes MSYS2 packages, below).
    - name: Install the C libraries
      if: runner.os == 'Linux' || runner.os == 'macOS'
      shell: bash
      run: sh src/runtime/third_party/libs.sh install
    # CMake and Ninja come with the Windows runners; ccache (the C build's compiler launcher) does not. Best effort:
    # the build works without it.
    - name: Install ccache
      if: runner.os == 'Windows'
      shell: bash
      run: choco install ccache -y --no-progress || true
    # Windows takes the MSYS2 CLANG64 (x64) or CLANGARM64 (arm64) packages; the C build reads them from MS_MSYS2.
    - name: Install MSYS2 and the C libraries
      id: msys2
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ inputs.arch == 'arm64' && 'CLANGARM64' || 'CLANG64' }}
        update: false
        location: ${{ runner.temp }}
        install: >-
          ${{ inputs.arch == 'arm64' && 'mingw-w64-clang-aarch64-libuv mingw-w64-clang-aarch64-nghttp2 mingw-w64-clang-aarch64-openssl mingw-w64-clang-aarch64-pcre2 mingw-w64-clang-aarch64-zlib perl make' || 'mingw-w64-clang-x86_64-libuv mingw-w64-clang-x86_64-nghttp2 mingw-w64-clang-x86_64-openssl mingw-w64-clang-x86_64-pcre2 mingw-w64-clang-x86_64-zlib perl make' }}
    - name: Point the C build at MSYS2
      if: runner.os == 'Windows'
      shell: bash
      run: echo "MS_MSYS2=$(cygpath -m '${{ steps.msys2.outputs.msys2-location }}')" >> "$GITHUB_ENV"
    # `ms` downloads the pinned lld and LLVM tools into $XDG_CACHE_HOME/ms/{lld,llvm} on first use
    # (manuscript-lang/llvm-bundle, pinned by checksum in toolchain/lld.lock); restoring them keeps CI
    # off the network.
    - name: Point the ms cache at a fixed directory
      shell: bash
      run: echo "XDG_CACHE_HOME=$RUNNER_TEMP/ms-cache" >> "$GITHUB_ENV"
    - name: Cache the lld and LLVM tools
      uses: actions/cache@v6
      with:
        path: |
          ${{ runner.temp }}/ms-cache/ms/lld
          ${{ runner.temp }}/ms-cache/ms/llvm
        key: ms-llvm-tools-${{ runner.os }}-${{ inputs.arch }}-${{ hashFiles('toolchain/lld.lock') }}
    # Windows programs link against llvm-mingw's CRT and import libraries, and the runtime is built
    # with its clang (toolchain/fetch-mingw.sh).
    - name: Fetch llvm-mingw
      if: runner.os == 'Windows'
      shell: bash
      run: |
        mingw="$(MINGW_WORK="$RUNNER_TEMP/llvm-mingw" sh toolchain/fetch-mingw.sh | tail -n 1)"
        echo "MS_MINGW=$(cygpath -w "$mingw")" >> "$GITHUB_ENV"
        rustup target add "$(rustc -vV | sed -n 's/^host: //p' | sed 's/msvc/gnullvm/')"
