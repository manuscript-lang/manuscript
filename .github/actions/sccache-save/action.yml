name: sccache save
description: Save the sccache cache from main when the restore missed.

inputs:
  cache-hit:
    description: The cache-hit output of the sccache action.
    required: true
  primary-key:
    description: The primary-key output of the sccache action.
    required: true

runs:
  using: composite
  steps:
    # `!cancelled()` saves after a failed step too. sccache entries are content-addressed, so a partial cache
    # is still valid, and a red main would otherwise leave every later main run (and the PRs that restore
    # from it) compiling from scratch.
    - name: Save cargo cache
      if: ${{ !cancelled() && github.ref == 'refs/heads/main' && inputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ${{ runner.temp }}/sccache
        key: ${{ inputs.primary-key }}
