name: Language checks
description: Repository rules, license check, the C style gate, and the VS Code extension package. Needs a checkout and a Rust toolchain.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: extensions/vscode/package-lock.json
    - name: Workflow scheduling regressions
      shell: bash
      run: make workflow-check
    - name: Repo rules and licenses
      shell: bash
      run: make repo-check licenses-check
    # Strict warnings on every C file and clang-tidy on the ones this change touches (documentation/contributing/c-style.md).
    # The nightly c-safety job runs clang-tidy on all of them.
    - name: C style gate
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        sh src/runtime/third_party/libs.sh install
        base=
        # The checkout is shallow: one more level gives the merge commit's parents, so the gate can tell what this change added from what main removed since.
        if [ -n "$BASE_REF" ]; then git fetch --no-tags --depth=2 origin "$GITHUB_SHA" || true; git fetch --depth=1 origin "$BASE_REF"; base=FETCH_HEAD; fi
        make c-lint C_LINT_BASE="$base"
    - name: Validate and package VS Code extension
      shell: bash
      working-directory: extensions/vscode
      run: |
        npm ci
        npm run package -- --allow-missing-repository
    - uses: actions/upload-artifact@v7
      with:
        name: manuscript-vscode
        path: extensions/vscode/*.vsix
