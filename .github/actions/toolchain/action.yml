name: Toolchain
description: Install the build tools for this platform and restore the compiler and OpenSSL caches.

runs:
  using: composite
  steps:
    # The platform packages come from the Ubuntu mirror and Homebrew, which stall for minutes now and then, so their
    # downloads are cached. The key follows this file; main's scheduled run saves it for pull requests.
    - if: runner.os == 'macOS'
      uses: actions/cache@v6
      with:
        path: ~/Library/Caches/Homebrew/downloads
        key: brew-${{ runner.arch }}-${{ hashFiles('.github/actions/toolchain/action.yml') }}
    - if: runner.os == 'Linux'
      uses: actions/cache@v6
      with:
        path: .artifacts/apt
        key: apt-${{ runner.arch }}-${{ hashFiles('.github/actions/toolchain/action.yml') }}
    - if: runner.os == 'macOS'
      shell: bash
      run: brew install ninja ccache lld
    - if: runner.os == 'macOS'
      shell: bash
      run: cmake -P cmake/CiMacosEnv.cmake
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p .artifacts/apt/partial
        sudo apt-get install -y -o Dir::Cache::archives="$PWD/.artifacts/apt" ninja-build ccache lld gdb
        # apt wrote the archives as root; the cache action's tar runs as the runner user.
        sudo chown -R "$(id -u):$(id -g)" .artifacts/apt
        rm -f .artifacts/apt/lock
    # The pinned LLVM library (cmake/toolchain/llvm-lib.lock): ms compiles through it in-process and exports MS_LLVM to the
    # steps after it. A runner then needs no system LLVM, only lld. Windows takes LLVM from its MSYS2 packages.
    - if: runner.os != 'Windows'
      shell: bash
      run: |
        cmake "-DROOT=$PWD" "-DARCH=${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}" -P cmake/FetchLlvmLib.cmake
    # The pinned Cranelift library (cmake/toolchain/cranelift-lib.lock): Debug builds generate code through it and
    # the step exports MS_CRANELIFT to the steps after it.
    - if: runner.os != 'Windows'
      shell: bash
      run: |
        cmake "-DROOT=$PWD" "-DARCH=${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}" -P cmake/FetchCraneliftLib.cmake
    # Windows builds the mingw-w64 ABI (what ms links programs with) inside MSYS2, which brings the perl and make
    # pair OpenSSL's Configure needs.
    - if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ runner.arch == 'ARM64' && 'CLANGARM64' || 'CLANG64' }}
        update: false
        install: >-
          ${{ runner.arch == 'ARM64' && 'mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-cmake mingw-w64-clang-aarch64-ninja mingw-w64-clang-aarch64-ccache perl make' || 'mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-ccache perl make' }}
    - uses: actions/cache/restore@v6
      with:
        path: .artifacts/ccache
        key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-
    # The finished OpenSSL build: the longest step of a cold build, and the pinned source changes a few times a year.
    - uses: actions/cache/restore@v6
      with:
        path: |
          .artifacts/build/ci/src/third_party/openssl_build*
          .artifacts/build/ci/musl/src/third_party/openssl_build*
        key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/third_party/c-libs.lock', 'cmake/targets/openssl.cmake') }}
