name: Toolchain
description: Install the build tools for this platform and restore the compiler and OpenSSL caches.

inputs:
  system-llvm:
    description: Install the platform's LLVM and lld (opt, llc, lld on PATH). CI sets it to false and uses the pinned releases.
    default: 'true'

runs:
  using: composite
  steps:
    - if: runner.os == 'macOS'
      shell: bash
      run: brew install ninja ccache${{ inputs.system-llvm == 'true' && ' llvm lld' || '' }}
    # Homebrew's llvm is keg-only: release builds run its opt and llc from PATH.
    - if: runner.os == 'macOS' && inputs.system-llvm == 'true'
      shell: bash
      run: cmake -P cmake/CiMacosEnv.cmake
    - if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get install -y ninja-build ccache gdb${{ inputs.system-llvm == 'true' && ' llvm lld' || '' }}
    # Windows builds the mingw-w64 ABI (what ms links programs with) inside MSYS2, which brings the perl and make
    # pair OpenSSL's Configure needs.
    - if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ runner.arch == 'ARM64' && 'CLANGARM64' || 'CLANG64' }}
        update: false
        install: >-
          ${{ runner.arch == 'ARM64' && 'mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-cmake mingw-w64-clang-aarch64-ninja mingw-w64-clang-aarch64-ccache perl make' || 'mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-ccache perl make' }}
    - uses: actions/cache/restore@v6
      with:
        path: .artifacts/ccache
        key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
        restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-
    # The finished OpenSSL build: the longest step of a cold build, and the pinned source changes a few times a year.
    - uses: actions/cache/restore@v6
      with:
        path: |
          .artifacts/build/ci/src/third_party/openssl_build*
          .artifacts/build/ci/musl/src/third_party/openssl_build*
        key: openssl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/third_party/c-libs.lock', 'cmake/targets/openssl.cmake') }}
