name: Rust checks
description: The Rust checks for one platform (pull requests on Linux, pushes to main and manual runs on all six). Run after checkout, the sccache restore and rust-env.

# One job runs one part (`a` or `b`), so the two parts run on separate runners; `ab` runs both in one job.
#   part a  unit: build the workspace once, nextest, doc tests, and on Linux amd64 format and clippy
#           the Cranelift corpus and fixtures on platforms that run them.
#   part b  conformance: the LLVM corpus and fixtures, plus the gates (below).
#   gates   bundled-LLVM release build, source conformance, cancellation and ownership checks, the
#           packaged ms on a hello project, glibc 2.28 on Linux. They run in part b, except on legs
#           that run the Cranelift corpus in part b, where they run in part a. Measured on main, part
#           a (build, nextest, doc tests) outlasts part b by several minutes on every leg without Cranelift.

inputs:
  os:
    description: linux, darwin or windows.
    required: true
  arch:
    description: amd64 or arm64.
    required: true
  part:
    description: a, b, or ab.
    required: true
  lint:
    description: "'true' also runs format and clippy."
    default: 'false'
  cranelift:
    description: "'a' or 'b' also runs the corpus and fixtures with MS_BACKEND=cranelift in that part; the gates then run in the other part."
    default: ''
  gates:
    description: "'false' skips the gates, when another job of the same run covers them."
    default: 'true'

runs:
  using: composite
  steps:
    - name: Plan the parts
      shell: bash
      run: |
        part='${{ inputs.part }}'
        cranelift='${{ inputs.cranelift }}'
        gates_part=b
        if [ "$cranelift" = b ]; then gates_part=a; fi
        if [ '${{ inputs.gates }}' = false ]; then gates_part=none; fi
        {
          echo "UNIT=$([[ $part == *a* ]] && echo true || echo false)"
          echo "CONFORM=$([[ $part == *b* ]] && echo true || echo false)"
          echo "GATES=$([[ $part == *$gates_part* ]] && echo true || echo false)"
          echo "CRANELIFT=$([[ -n $cranelift && $part == *$cranelift* ]] && echo true || echo false)"
        } >> "$GITHUB_ENV"
    - name: Keep native test artifacts in runner storage
      shell: bash
      run: |
        printf '%s\n' "TMPDIR=$RUNNER_TEMP" "TMP=$RUNNER_TEMP" "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
    - uses: taiki-e/install-action@v2
      if: env.UNIT == 'true'
      with:
        tool: nextest
    # MSVC rejects a test binary whose crates reference msrt_* runtime symbols that only ms-rt
    # defines, even when nothing calls them; ELF and Mach-O drop the unused code first. Crates
    # that ms-rt itself depends on cannot link it back in, so Windows builds in this job let the
    # linker leave those references unresolved. Every cargo step uses the same flags so they share
    # one build (a flag change recompiles everything, about 2 minutes); `target/debug/ms` links the
    # whole runtime, so the flag changes nothing there. The packaged distribution is built without it.
    - name: Let Windows test binaries leave runtime symbols unresolved
      if: runner.os == 'Windows'
      shell: bash
      run: echo 'RUSTFLAGS=-C link-arg=/FORCE:UNRESOLVED' >> "$GITHUB_ENV"
    - name: Build the native runtime
      shell: bash
      run: cargo xtask runtime
    - name: Format and clippy
      if: env.UNIT == 'true' && inputs.lint == 'true'
      shell: bash
      run: |
        cargo fmt --all --check
        cargo clippy --workspace --all-targets -- -D warnings
    # nextest runs each test in its own process, so tests that share process-global
    # state (the runtime allocator, the environment) cannot interfere.
    - name: Tests and doc tests
      if: env.UNIT == 'true'
      shell: bash
      run: |
        # One build with every target: the later steps (nextest, the CLI, the native tests, the
        # corpus runner) then reuse it instead of rebuilding dependencies with other features.
        cargo build --workspace --all-targets --locked --keep-going
        cargo nextest run --workspace --locked --no-fail-fast
        cargo test --workspace --doc --locked
    - name: Build CLI for native source conformance
      shell: bash
      run: |
        set -euo pipefail
        reports="$RUNNER_TEMP/ms-native-conformance"
        if [ "$RUNNER_OS" = Windows ]; then reports="$(cygpath -u "$RUNNER_TEMP")/ms-native-conformance"; fi
        mkdir -p "$reports"
        printf 'NATIVE_REPORTS=%s\n' "$reports" >> "$GITHUB_ENV"
        git rev-parse HEAD > "$reports/commit.txt"
        rustc -vV > "$reports/host.txt"
        # `-p ms-cli` unifies features differently from the workspace build and recompiles the
        # cranelift crates, ms-clif, ms-build and ms-cli (about 40 s). Parts that ran the workspace
        # build above reuse it: the same command is a no-op and relinks target/debug/ms.
        if [ "$UNIT" = true ]; then
          cargo build --workspace --all-targets --locked 2>&1 | tee "$reports/build.log"
        else
          cargo build --locked -p ms-cli 2>&1 | tee "$reports/build.log"
        fi
    - name: Native Windows project paths
      if: env.UNIT == 'true' && runner.os == 'Windows'
      shell: bash
      run: |
        cargo test --locked -p ms-driver --test it -- project_windows_paths:: --nocapture 2>&1 | tee "$NATIVE_REPORTS/windows-paths.log"
    - name: Program map data and pure rendering
      if: env.UNIT == 'true'
      shell: bash
      run: node --test tests/diagram/*.test.cjs
    - name: Release builds use the bundled LLVM tools
      if: env.GATES == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # MS_KEEP_LL copies the LLVM IR next to the build, so it exists only when LLVM compiled the program.
        dir="$RUNNER_TEMP/llvm-release"
        mkdir -p "$dir"
        (cd "$dir" && MS_KEEP_LL=1 "$GITHUB_WORKSPACE/target/debug/ms" build "$GITHUB_WORKSPACE/examples/hello/ms.toml" -o hello --build-type Release && test -s ms-keep.ll && ./hello)
    - name: Native standard-library source conformance
      if: env.GATES == 'true'
      shell: bash
      run: |
        set -euo pipefail
        ms=target/debug/ms
        if [ "$RUNNER_OS" = Windows ]; then ms="$ms.exe"; fi
        for build_type in Release Debug; do
          report="$NATIVE_REPORTS/rsa-$build_type.json"
          stderr="$NATIVE_REPORTS/rsa-$build_type.stderr"
          status=0
          "$ms" test tests/conformance/fixtures/e2e/stdlib/crypto-rsa.ms --build-type "$build_type" --json > "$report" 2> "$stderr" || status=$?
          cat "$report"
          cat "$stderr" >&2
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          json="$report"
          if [ "$RUNNER_OS" = Windows ]; then json="$(cygpath -w "$report")"; fi
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (!r.completed || r.exit_code !== 0 || r.summary.available !== 4 ||
                r.summary.selected !== 4 || r.summary.passed !== 4 ||
                r.summary.failed !== 0 || r.summary.skipped !== 0 ||
                r.summary.not_run !== 0 || r.tests.length !== 4 ||
                r.tests.some(t => t.status !== "passed")) process.exit(1);
          ' "$json"
        done
    # The corpus run also counts live heap blocks (the leak sweep): CONFORM_LEAKS links programs
    # against the counting runtime, so the sweep reuses these runs instead of repeating them.
    - name: Compile and runtime work scales linearly
      if: env.GATES == 'true'
      shell: bash
      run: MS=target/debug/ms target/debug/ms run tools/scaling-check.ms
    - name: Conformance corpus (LLVM) and leaks
      if: env.CONFORM == 'true'
      env:
        CONFORM_LEAKS: '1'
      shell: bash
      run: target/debug/ms run tools/conform.ms
    - name: Conformance corpus (Cranelift)
      if: env.CRANELIFT == 'true'
      env:
        MS_BACKEND: cranelift
      shell: bash
      run: target/debug/ms run tools/conform.ms
    - name: Ownership counts and cleanup order hold
      if: env.GATES == 'true'
      shell: bash
      run: |
        MS=target/debug/ms target/debug/ms run tools/count-check.ms
        MS=target/debug/ms target/debug/ms run tools/count-check-selftest.ms
    - name: Every accepted resource operation closes each resource once
      if: env.GATES == 'true'
      shell: bash
      run: MS=target/debug/ms target/debug/ms run tools/resource-matrix.ms
    - name: Every accepted resource shape and construct closes each resource once
      if: env.GATES == 'true'
      shell: bash
      run: MS=target/debug/ms target/debug/ms run tools/close-matrix.ms
    - name: Benchmark programs still type-check and their tests pass
      if: env.GATES == 'true' && inputs.os == 'linux'
      shell: bash
      run: |
        set -euo pipefail
        # The same checks as `make bench-check` and the type-check half of `make agent-bench-check`
        # (the oracle needs agent tooling), on the debug binary built above.
        ms="$PWD/target/debug/ms"
        for t in $(find bench/perf -name ms.toml | sort); do (cd "$(dirname "$t")" && "$ms" check ms.toml); done
        for t in bench/tools/*.ms bench/agent/run.ms; do "$ms" check "$t"; done
        for t in bench/tools/*_test.ms bench/agent/core_test.ms; do "$ms" test "$t"; done
    - name: Package and run the distribution on a hello project
      if: env.GATES == 'true'
      shell: bash
      run: |
        # The shipped `ms` links without the test-only Windows flag.
        unset RUSTFLAGS
        target/debug/ms run tools/package.ms -- "${{ inputs.os }}" "${{ inputs.arch }}"
        name="manuscript-rust-${{ inputs.os }}-${{ inputs.arch }}"
        mkdir -p "extracted distribution"
        if [ '${{ inputs.os }}' = windows ]; then
          7z x -bso0 -o"extracted distribution" "dist/$name.zip"
          ms="extracted distribution/$name/ms.exe"
        else
          tar -xzf "dist/$name.tar.gz" -C "extracted distribution"
          ms="extracted distribution/$name/ms"
        fi
        cmp LICENSE "extracted distribution/$name/LICENSE"
        "$ms" --version
        cd "extracted distribution/$name/examples/hello"
        if [ "$RUNNER_OS" != Windows ]; then
          # Linux and macOS link with the bundled lld: nothing on PATH, no C toolchain.
          env -i HOME="$HOME" PATH=/nonexistent "../../$(basename "$ms")" run ms.toml
        else
          "../../$(basename "$ms")" run ms.toml
        fi
    - name: Downloaded tools need no newer than glibc 2.28
      if: env.GATES == 'true' && inputs.os == 'linux'
      shell: bash
      run: |
        # ms downloads the pinned lld and LLVM tools on first use; the build above used them.
        tools=$(find "$XDG_CACHE_HOME/ms/lld" "$XDG_CACHE_HOME/ms/llvm" -type f -perm -u+x)
        test -n "$tools"
        sh toolchain/check-glibc-floor.sh $tools
    - name: Programs run on glibc 2.28
      if: env.GATES == 'true' && inputs.os == 'linux'
      shell: bash
      run: |
        target/debug/ms build tests/glibc-floor/floor.ms -o floor
        # The link-time stubs bind nothing newer than glibc 2.28 (weak references aside).
        if objdump -T floor | grep -v '^[0-9a-f]* *w ' | grep -E 'GLIBC_2\.(29|3[0-9])'; then
          echo "floor binds a glibc symbol newer than 2.28" >&2
          exit 1
        fi
        # AlmaLinux 8 ships glibc 2.28, the oldest that Linux programs support.
        got=$(docker run --rm -v "$PWD:/w" -w /w almalinux:8 ./floor)
        test "$got" = "144 true true true true 1030"

    - name: sccache statistics
      if: always()
      shell: bash
      run: sccache --show-stats
    - name: Preserve test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: rust-${{ inputs.os }}-${{ inputs.arch }}-${{ inputs.part }}
        path: |
          .artifacts/conform.md
          ${{ runner.temp }}/ms-clif-tests-*
          ${{ runner.temp }}/ms-native-conformance/
          ${{ runner.temp }}/ms-dwarf-*
          ${{ runner.temp }}/ms-build-debug-*
        if-no-files-found: ignore
