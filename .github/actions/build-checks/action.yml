name: Build checks
description: "The pull request Rust checks: format, clippy, a build of every target, a smoke test of the ms commands, nextest and doc tests."

runs:
  using: composite
  steps:
    - name: Keep native test artifacts in runner storage
      shell: bash
      run: printf '%s\n' "TMPDIR=$RUNNER_TEMP" "TMP=$RUNNER_TEMP" "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest
    - name: Build the native runtime
      shell: bash
      run: cargo xtask runtime
    - name: Format and clippy
      shell: bash
      run: |
        cargo fmt --all --check
        cargo clippy --workspace --all-targets -- -D warnings
    - name: Build every target
      shell: bash
      run: cargo build --workspace --all-targets --locked --keep-going
    # Dead-on-arrival check: the built `ms` starts, creates a project, and checks, formats, lints,
    # tests, builds and runs it and the hello example. Debug builds use Cranelift, so this is quick.
    - name: Smoke test the ms commands
      shell: bash
      run: |
        ms="$PWD/target/debug/ms"
        "$ms" --version
        "$ms" guide > /dev/null
        "$ms" search_symbol List > /dev/null
        for project in examples/hello "$(mktemp -d)/smoke"; do
          if [ ! -d "$project" ]; then (cd "$(dirname "$project")" && "$ms" init smoke > /dev/null); fi
          "$ms" verify "$project/ms.toml"
          "$ms" build "$project/ms.toml" --build-type Debug -o "$RUNNER_TEMP/smoke-app"
          "$RUNNER_TEMP/smoke-app" > /dev/null
          "$ms" run "$project/ms.toml" --build-type Debug > /dev/null
        done
    # nextest runs each test in its own process, so tests that share process-global state cannot interfere.
    - name: Tests and doc tests
      shell: bash
      run: |
        cargo nextest run --workspace --locked --no-fail-fast
        cargo test --workspace --doc --locked
