name: Rust scope
description: Says whether a pull request changes anything beyond documentation, skills, proposals, extensions, the C compiler and Markdown.

outputs:
  rust:
    description: "'false' when the pull request touches only documentation, skills, proposals, extensions, the C compiler and Markdown, else 'true'."
    value: ${{ steps.scope.outputs.rust }}

  llvm:
    description: "'true' on scheduled, queued and manual runs, and on a pull request that touches LLVM-related code; else 'false'."
    value: ${{ steps.scope.outputs.llvm }}

  docs:
    description: "'true' on scheduled, queued and manual runs, and on a pull request that touches the documentation, the standard library or the example test; else 'false'."
    value: ${{ steps.scope.outputs.docs }}

  c:
    description: "'true' on a pull request that touches the C runtime, the C compiler or their checks; else 'false'. The `c` jobs run only then."
    value: ${{ steps.scope.outputs.c }}

runs:
  using: composite
  steps:
    - id: scope
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        # Scheduled runs, the merge queue and manual runs always run the Rust checks.
        if [ "$EVENT" != pull_request ]; then
          echo "rust=true" >> "$GITHUB_OUTPUT"
          echo "llvm=true" >> "$GITHUB_OUTPUT"
          echo "docs=true" >> "$GITHUB_OUTPUT"
          echo "c=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The pull request's own changes: the merge commit against its first parent. Diffing against the
        # base branch's current tip also lists everything merged to it since the merge commit was made.
        git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
        BASE=$(git rev-parse "$GITHUB_SHA^1")
        rust=true
        if ! git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^(documentation/|website/|blog/|proposals/|skills/|extensions/|compiler/|.*\.md$)'; then
          rust=false
        fi
        # Pull requests build programs with Cranelift (the Debug backend). Only code that is specific to the
        # LLVM release path also runs the LLVM corpus and the release gates, as main does: the LLVM backend
        # and its glue, the MIR passes and lowering it consumes (drop, clone and closure glue is built in
        # crates/ms-mir, so a change there decides what LLVM builds), the LLVM driver in ms-build, the LLVM tests, the pinned LLVM and lld tools
        # (toolchain/lld.lock), and the glibc floor check, which only the release gates run. The rest of
        # toolchain/ (the glibc link stubs, llvm-mingw) is not LLVM-specific.
        # Shared code (front end, runtime, build driver, CI files) is covered by main within 30 minutes.
        llvm=false
        if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(crates/ms-mir-llvm/|crates/ms-mir/src/|crates/ms-lower/|crates/ms-build/src/(llvm|link)|crates/ms-clif/tests/llvm_|crates/ms-cli/tests/llvm|toolchain/(lld\.lock|check-glibc-floor\.sh))'; then
          llvm=true
        fi
        # The tutorial and stdlib examples are tested only when the files that hold them change; main runs them
        # on every push, so a compiler change that breaks an example is caught within 30 minutes.
        docs=false
        if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(documentation/|stdlib/|crates/ms-cli/tests/doc_examples)'; then
          docs=true
        fi
        # The C runtime and compiler have their own jobs (unit tests under sanitizers, the C front end against the
        # Rust one). The compiler's C is not part of the Rust build yet, so a pull request that touches only it
        # (above) skips the Rust jobs; runtime C is folded into every program, so it keeps them.
        c=false
        if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(runtime/|compiler/|toolchain/c-|cmake/|CMakeLists\.txt$|Makefile$)'; then
          c=true
        fi
        echo "c=$c" >> "$GITHUB_OUTPUT"
        echo "docs=$docs" >> "$GITHUB_OUTPUT"
        echo "rust=$rust" >> "$GITHUB_OUTPUT"
        echo "llvm=$llvm" >> "$GITHUB_OUTPUT"
