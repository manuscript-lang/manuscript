name: Rust scope
description: Says whether a pull request changes anything beyond documentation, skills, proposals, extensions and Markdown.

outputs:
  rust:
    description: "'false' when the pull request touches only those paths, else 'true'."
    value: ${{ steps.scope.outputs.rust }}

  llvm:
    description: "'true' on scheduled, queued and manual runs, and on a pull request that touches LLVM-related code; else 'false'."
    value: ${{ steps.scope.outputs.llvm }}

runs:
  using: composite
  steps:
    - id: scope
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        # Scheduled runs, the merge queue and manual runs always run the Rust checks.
        if [ "$EVENT" != pull_request ]; then
          echo "rust=true" >> "$GITHUB_OUTPUT"
          echo "llvm=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The pull request's own changes: the merge commit against its first parent. Diffing against the
        # base branch's current tip also lists everything merged to it since the merge commit was made.
        git fetch --no-tags --depth=2 origin "$GITHUB_SHA"
        BASE=$(git rev-parse "$GITHUB_SHA^1")
        rust=true
        if ! git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^(documentation/|website/|blog/|proposals/|skills/|extensions/|.*\.md$)'; then
          rust=false
        fi
        # Pull requests build programs with Cranelift (the Debug backend). Only code that is specific to the
        # LLVM release path also runs the LLVM corpus and the release gates, as main does: the LLVM backend
        # and its glue, the LLVM driver in ms-build, the LLVM tests, and the pinned LLVM and lld tools.
        # Shared code (front end, runtime, build driver, CI files) is covered by main within 30 minutes.
        llvm=false
        if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(crates/ms-mir-llvm/|crates/ms-build/src/llvm|crates/ms-clif/tests/llvm_|crates/ms-cli/tests/llvm|toolchain/)'; then
          llvm=true
        fi
        echo "rust=$rust" >> "$GITHUB_OUTPUT"
        echo "llvm=$llvm" >> "$GITHUB_OUTPUT"
