name: Warm caches

# Pull requests restore the sccache and the native runtime archives that main saved, so their build costs
# what their own change costs. The six-platform run of main is hours apart (it takes about an hour), so the
# caches a pull request restored were hours old: every crate main changed since then rebuilt, and the
# runtime archives (45 to 60 s) were never shared, because a pull request cache is visible to that pull
# request only. This workflow rebuilds both on Linux after each push to main, the platform pull requests run.
# A push waits for the running one and replaces an older waiting one, so a burst of merges costs at most
# two runs. The `Cache maintenance` workflow then keeps the newest entry of each name.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 1500M
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

concurrency:
  group: warm-caches
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  warm:
    name: warm-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-linux-${{ matrix.arch }}-
      - uses: ./.github/actions/rust-env
        with:
          os: linux
          arch: ${{ matrix.arch }}
      - uses: ./.github/actions/native-runtime
        with:
          os: linux
          arch: ${{ matrix.arch }}
      # The build a pull request job starts with (rust-checks), so its outputs are what gets cached.
      - name: Build the workspace
        run: cargo build --workspace --all-targets --locked --keep-going
      # The corpus-only jobs (`-p ms-cli`, no workspace build) unify features differently and compile
      # ms-build and ms-cli again unless this build is cached too.
      - name: Build the CLI alone
        run: cargo build --locked -p ms-cli
      # The leak-counting runtime that the ownership count gate and the LLVM corpus link against
      # (`use_stats_runtime` in tools/lib.ms builds it the same way): without this its compile
      # missed the sccache and cost about 65 s in each LLVM pull request job that needs it.
      - name: Build the leak-counting runtime
        run: cargo xtask runtime --stats
      - uses: ./.github/actions/sccache-save
        if: ${{ !cancelled() }}
        with:
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          primary-key: ${{ steps.sccache.outputs.primary-key }}
