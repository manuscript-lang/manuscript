name: Rust distributions

# Builds the Rust `ms` (with the ms-native runtime embedded) natively on a runner of each of
# the six release targets, packages it, and runs the packaged binary on a hello project.
# release.yml calls this workflow on a version tag and publishes its archives; there every
# target gates. Scheduled runs on main cover the same six platforms in the `rust` jobs
# of cicd.yml; pull requests cover Linux.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Linux builds in AlmaLinux 8 (glibc 2.28), so the shipped ms runs on every glibc from 2.28 on; empty elsewhere.
    container: ${{ matrix.container }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04, container: 'quay.io/pypa/manylinux_2_28_x86_64' }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, container: 'quay.io/pypa/manylinux_2_28_aarch64' }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: windows, arch: amd64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - name: Install Rust in the glibc 2.28 container
        if: matrix.container
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-dist-${{ matrix.os }}-${{ matrix.arch }}-
      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "${RELEASE_TAG#v}" = "$(cat .msversion)"
      - uses: ./.github/actions/native-toolchain
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
      # The packaging tool is a Manuscript program, so a debug ms runs it; it then builds the shipped binary.
      - name: Build ms to run the packaging tool
        run: |
          cargo xtask runtime
          cargo build --locked -p ms-cli
      - name: Build and package
        run: target/debug/ms run tools/package.ms -- "${{ matrix.os }}" "${{ matrix.arch }}"
      - name: sccache statistics
        if: always()
        run: sccache --show-stats
      - uses: ./.github/actions/sccache-save
        with:
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          primary-key: ${{ steps.sccache.outputs.primary-key }}
      - name: Run the packaged binary on a hello project
        run: |
          set -eu
          name="manuscript-rust-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "extracted distribution"
          if [ '${{ matrix.os }}' = windows ]; then
            7z x -bso0 -o"extracted distribution" "dist/$name.zip"
            ms="extracted distribution/$name/ms.exe"
          else
            tar -xzf "dist/$name.tar.gz" -C "extracted distribution"
            ms="extracted distribution/$name/ms"
          fi
          cmp LICENSE "extracted distribution/$name/LICENSE"
          # The shipped ms must run on glibc 2.28, the manylinux_2_28 container's version.
          if [ '${{ matrix.os }}' = linux ]; then sh toolchain/check-glibc-floor.sh "$ms"; fi
          "$ms" --version
          cd "extracted distribution/$name/examples/hello"
          bin="../../$(basename "$ms")"
          test "$("$bin" run ms.toml -- first second | tr -d '\r')" = "Arguments: 2"
          "$bin" test test.ms
          # A release build links with the pinned lld, so it proves the embedded runtime is usable.
          exe="$RUNNER_TEMP/hello"
          if [ '${{ matrix.os }}' = windows ]; then exe="$exe.exe"; fi
          "$bin" build ms.toml -o "$exe"
          test "$("$exe" first second | tr -d '\r')" = "Arguments: 2"
      - uses: actions/upload-artifact@v7
        with:
          name: manuscript-rust-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  ok:
    name: Rust distributions
    needs: package
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gating target
        env:
          RESULT: ${{ needs.package.result }}
        run: |
          case "$RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
