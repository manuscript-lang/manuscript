name: Rust distributions

# Builds the Rust `ms` (with the ms-native runtime embedded) natively on a runner of each of
# the six release targets, packages it, and runs the packaged binary on a hello project.
# release.yml calls this workflow on a version tag and publishes its archives; there every
# target gates. Pull requests build, test, package and smoke-test the same six platforms in
# the `rust` jobs of cicd.yml.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: windows, arch: amd64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "${RELEASE_TAG#v}" = "$(cat .msversion)"
      # The key hashes only Cargo.lock and the toolchain (rust-cache also hashes every manifest, so it
      # writes a new entry whenever one changes). One entry per name and lockfile, saved on main.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-rust-dist-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-rust-dist-${{ matrix.os }}-${{ matrix.arch }}-
      - name: Restore bundled lld
        id: lld
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/llvm-bundle/install
          key: lld-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/build-llvm-bundle.sh', 'scripts/llvm-version') }}
      - name: Build bundled lld
        if: runner.os != 'Windows' && steps.lld.outputs.cache-hit != 'true'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y ninja-build
          else brew install ninja; fi
          LLVM_WORK="$RUNNER_TEMP/llvm-bundle" sh scripts/build-llvm-bundle.sh "${{ matrix.os }}" "${{ matrix.arch }}" lld
      - name: Save bundled lld
        if: github.ref == 'refs/heads/main' && runner.os != 'Windows' && steps.lld.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/llvm-bundle/install
          key: ${{ steps.lld.outputs.cache-primary-key }}
      - name: Point the build at lld
        if: runner.os != 'Windows'
        run: echo "MS_LLD=$RUNNER_TEMP/llvm-bundle/install/bin/lld" >> "$GITHUB_ENV"
      - name: Build and package
        run: sh scripts/package-rust.sh "${{ matrix.os }}" "${{ matrix.arch }}"
      - name: Save cargo cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Run the packaged binary on a hello project
        run: |
          set -eu
          name="manuscript-rust-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "extracted distribution"
          if [ '${{ matrix.os }}' = windows ]; then
            7z x -bso0 -o"extracted distribution" "dist/$name.zip"
            ms="extracted distribution/$name/ms.exe"
          else
            tar -xzf "dist/$name.tar.gz" -C "extracted distribution"
            ms="extracted distribution/$name/ms"
          fi
          "$ms" --version
          cd "extracted distribution/$name/examples/hello"
          "../../$(basename "$ms")" run ms.toml
      - uses: actions/upload-artifact@v7
        with:
          name: manuscript-rust-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  ok:
    name: Rust distributions
    needs: package
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gating target
        env:
          RESULT: ${{ needs.package.result }}
        run: |
          case "$RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
