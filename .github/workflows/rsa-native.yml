name: RSA native conformance

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'pkg/stdlib/crypto.ms'
      - 'pkg/stdlib/bindings.json'
      - 'tests/e2e/testdata/stdlib/crypto-rsa.ms'
      - '.github/workflows/rsa-native.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'pkg/stdlib/crypto.ms'
      - 'pkg/stdlib/bindings.json'
      - 'tests/e2e/testdata/stdlib/crypto-rsa.ms'
      - '.github/workflows/rsa-native.yml'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rsa-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rsa:
    name: RSA ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: windows, arch: amd64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rsa-native-${{ matrix.os }}-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Record the native host and tested commit
        run: |
          mkdir -p .artifacts/rsa-native
          git rev-parse HEAD > .artifacts/rsa-native/commit.txt
          rustc -vV > .artifacts/rsa-native/host.txt
      - name: Build the native CLI and embedded runtime
        run: cargo build --locked -p ms-cli 2>&1 | tee .artifacts/rsa-native/build.log
      - name: Test native Windows project paths
        if: matrix.os == 'windows'
        run: cargo test --locked -p ms-project --test windows_paths -- --nocapture 2>&1 | tee .artifacts/rsa-native/windows-paths.log
      - name: Run source RSA tests in Release and Debug
        run: |
          set -euo pipefail
          ms=target/debug/ms
          if [ '${{ matrix.os }}' = windows ]; then ms="$ms.exe"; fi
          for build_type in Release Debug; do
            report=".artifacts/rsa-native/rsa-$build_type.json"
            stderr=".artifacts/rsa-native/rsa-$build_type.stderr"
            status=0
            "$ms" test tests/e2e/testdata/stdlib/crypto-rsa.ms --build-type "$build_type" --json > "$report" 2> "$stderr" || status=$?
            cat "$report"
            cat "$stderr" >&2
            if [ "$status" -ne 0 ]; then exit "$status"; fi
            node -e '
              const r = require("./" + process.argv[1]);
              if (!r.completed || r.exit_code !== 0 || r.summary.available !== 4 ||
                  r.summary.selected !== 4 || r.summary.passed !== 4 ||
                  r.summary.failed !== 0 || r.summary.skipped !== 0 ||
                  r.summary.not_run !== 0 || r.tests.length !== 4 ||
                  r.tests.some(t => t.status !== "passed")) process.exit(1);
            ' "$report"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rsa-native-${{ matrix.os }}-${{ matrix.arch }}
          path: .artifacts/rsa-native/
          include-hidden-files: true
          if-no-files-found: error

  ok:
    name: RSA native conformance
    needs: rsa
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every native target
        env:
          RESULT: ${{ needs.rsa.result }}
        run: test "$RESULT" = success
