name: windows-largepage
on:
  push:
    branches: [claude/project-thread-ssg8fp]
    paths: [.github/workflows/windows-largepage.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Write the probe
        shell: bash
        run: |
          cat > probe.rs <<'EOF'
          use std::ffi::c_void;
          type Dword = u32;
          #[repr(C)] struct Luid { low: u32, high: i32 }
          #[repr(C)] struct TokenPriv { count: u32, luid: Luid, attrs: u32 }
          #[repr(C)] struct Counters { cb: u32, page_fault_count: u32, rest: [usize; 8] }
          #[link(name = "kernel32")]
          unsafe extern "system" {
              fn VirtualAlloc(a: *mut c_void, n: usize, t: Dword, p: Dword) -> *mut c_void;
              fn GetLargePageMinimum() -> usize;
              fn GetCurrentProcess() -> isize;
              fn GetLastError() -> u32;
              fn K32GetProcessMemoryInfo(h: isize, c: *mut Counters, cb: u32) -> i32;
          }
          #[link(name = "advapi32")]
          unsafe extern "system" {
              fn OpenProcessToken(h: isize, access: u32, t: *mut isize) -> i32;
              fn LookupPrivilegeValueA(s: *const u8, n: *const u8, l: *mut Luid) -> i32;
              fn AdjustTokenPrivileges(t: isize, d: i32, n: *const TokenPriv, l: u32, p: *mut c_void, r: *mut u32) -> i32;
          }
          fn faults() -> u32 {
              let mut c = Counters { cb: 80, page_fault_count: 0, rest: [0; 8] };
              unsafe { K32GetProcessMemoryInfo(GetCurrentProcess(), &mut c, 80) };
              c.page_fault_count
          }
          fn main() {
              unsafe {
                  let min = GetLargePageMinimum();
                  println!("large page minimum: {min}");
                  let mut tok = 0isize;
                  println!("OpenProcessToken: {}", OpenProcessToken(GetCurrentProcess(), 0x20 | 0x8, &mut tok));
                  let mut luid = Luid { low: 0, high: 0 };
                  println!("LookupPrivilegeValue: {}", LookupPrivilegeValueA(std::ptr::null(), b"SeLockMemoryPrivilege\0".as_ptr(), &mut luid));
                  let tp = TokenPriv { count: 1, luid, attrs: 2 };
                  let ok = AdjustTokenPrivileges(tok, 0, &tp, 0, std::ptr::null_mut(), std::ptr::null_mut());
                  println!("AdjustTokenPrivileges: {ok}, last error {} (1300 = privilege not held)", GetLastError());
                  let p = VirtualAlloc(std::ptr::null_mut(), min, 0x1000 | 0x2000 | 0x2000_0000, 4);
                  println!("MEM_LARGE_PAGES alloc: {:?}, last error {}", p, GetLastError());
                  // 4 KiB pages: touch 256 MiB reserved then committed in one call.
                  let len = 256usize << 20;
                  let base = VirtualAlloc(std::ptr::null_mut(), len, 0x2000, 4) as *mut u8;
                  let t0 = std::time::Instant::now();
                  let f0 = faults();
                  VirtualAlloc(base as *mut c_void, len, 0x1000, 4);
                  let f1 = faults();
                  let mut i = 0;
                  while i < len { *base.add(i) = 1; i += 4096; }
                  let f2 = faults();
                  println!("commit 256 MiB: {} faults; touching it: {} faults, {:?}", f1 - f0, f2 - f1, t0.elapsed());
              }
          }
          EOF
      - name: Run
        shell: bash
        run: |
          rustc -O probe.rs -o probe.exe && ./probe.exe
