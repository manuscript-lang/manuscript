name: Debug platform
on:
  push:
    branches: ['debug/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          
          - { os: darwin, arch: arm64, runner: macos-15 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: amd64
      - name: Select native Windows Rust host and MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          set +e
          $rustTarget = 'x86_64-pc-windows-msvc'
          rustup set default-host $rustTarget
          $msvcLinker = Join-Path $env:VCToolsInstallDir ('bin/Host{0}/{1}/link.exe' -f $env:VSCMD_ARG_HOST_ARCH, $env:VSCMD_ARG_TGT_ARCH)
          $linkerKey = 'CARGO_TARGET_' + $rustTarget.ToUpper().Replace('-', '_') + '_LINKER'
          "$linkerKey=$msvcLinker" >> $env:GITHUB_ENV
      - name: Windows CC
        if: runner.os == 'Windows'
        run: echo 'CC=clang' >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-toolchain
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
      - name: Build
        run: |
          set +e
          cargo xtask runtime
          cargo build --locked -p ms-cli
      - name: Probe
        continue-on-error: true
        run: |
          set +e
          ms=target/debug/ms
          if [ "$RUNNER_OS" = Windows ]; then ms="$ms.exe"; fi
          f='quoted folding trims'
          echo "::group::default"; "$ms" test tests/e2e/testdata/stdlib/yaml.ms --build-type Release --filter "$f" 2>&1 | tail -5 || true; echo "::endgroup::"
          echo "::group::cranelift"; MS_BACKEND=cranelift "$ms" test tests/e2e/testdata/stdlib/yaml.ms --build-type Release --filter "$f" 2>&1 | tail -5 || true; echo "::endgroup::"
          echo "::group::debug"; "$ms" test tests/e2e/testdata/stdlib/yaml.ms --build-type Debug --filter "$f" 2>&1 | tail -5 || true; echo "::endgroup::"
          sleep 5; msx="$GITHUB_WORKSPACE/$ms"
          for r in ~/Library/Logs/DiagnosticReports/*.ips /Library/Logs/DiagnosticReports/*.ips; do [ -f "$r" ] && { echo "::group::$r"; head -c 6000 "$r"; echo; echo "::endgroup::"; }; done || true
          echo "::group::keep ll"
          mkdir -p /tmp/ll && cd /tmp/ll && MS_KEEP_LL=1 "$msx" test "$GITHUB_WORKSPACE/tests/e2e/testdata/stdlib/yaml.ms" --build-type Release --filter "$f" 2>&1 | tail -3; ls -la /tmp/ll "$GITHUB_WORKSPACE"/ms-keep.ll 2>&1 | head
          echo "::endgroup::"
