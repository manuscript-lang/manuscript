name: Debug platform
on:
  push:
    branches: ['debug/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          
          - { os: darwin, arch: arm64, runner: macos-15 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: amd64
      - name: Select native Windows Rust host and MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          set +e
          $rustTarget = 'x86_64-pc-windows-msvc'
          rustup set default-host $rustTarget
          $msvcLinker = Join-Path $env:VCToolsInstallDir ('bin/Host{0}/{1}/link.exe' -f $env:VSCMD_ARG_HOST_ARCH, $env:VSCMD_ARG_TGT_ARCH)
          $linkerKey = 'CARGO_TARGET_' + $rustTarget.ToUpper().Replace('-', '_') + '_LINKER'
          "$linkerKey=$msvcLinker" >> $env:GITHUB_ENV
      - name: Windows CC
        if: runner.os == 'Windows'
        run: echo 'CC=clang' >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-toolchain
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
      - name: Build
        run: |
          set +e
          cargo xtask runtime
          cargo build --locked -p ms-cli
      - name: Probe
        continue-on-error: true
        run: |
          set +e
          ms="$GITHUB_WORKSPACE/target/debug/ms"
          mkdir -p "$RUNNER_TEMP/probe" && cd "$RUNNER_TEMP/probe"
          MS_KEEP_LL=1 "$ms" test "$GITHUB_WORKSPACE/tests/e2e/testdata/stdlib/yaml.ms" --build-type Release --filter "quoted folding trims" 2>&1 | tail -3
          ls -la
          sleep 5
          cp ~/Library/Logs/DiagnosticReports/program-*.ips . 2>/dev/null
          python3 - <<'PY'
          import json,glob
          for f in glob.glob('program-*.ips'):
              t=open(f).read().split('\n',1)
              d=json.loads(t[1])
              th=d['threads'][d['faultingThread']]
              print(f, d.get('exception'))
              print('x regs', [r['value'] for r in th['threadState']['x']][:31])
              print('pc/lr', th['threadState'].get('pc'), th['threadState'].get('lr'))
              imgs=d['usedImages']
              for fr in th['frames'][:12]:
                  im=imgs[fr['imageIndex']] if 'imageIndex' in fr else {}
                  print(fr.get('imageOffset'), fr.get('symbol'), im.get('name'), im.get('base'))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-${{ matrix.os }}
          path: ${{ runner.temp }}/probe
