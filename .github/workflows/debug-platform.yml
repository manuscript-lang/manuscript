name: Debug platform
on:
  push:
    branches: ['debug/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          
          - { os: darwin, arch: arm64, runner: macos-15 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: amd64
      - name: Select native Windows Rust host and MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          set +e
          $rustTarget = 'x86_64-pc-windows-msvc'
          rustup set default-host $rustTarget
          $msvcLinker = Join-Path $env:VCToolsInstallDir ('bin/Host{0}/{1}/link.exe' -f $env:VSCMD_ARG_HOST_ARCH, $env:VSCMD_ARG_TGT_ARCH)
          $linkerKey = 'CARGO_TARGET_' + $rustTarget.ToUpper().Replace('-', '_') + '_LINKER'
          "$linkerKey=$msvcLinker" >> $env:GITHUB_ENV
      - name: Windows CC
        if: runner.os == 'Windows'
        run: echo 'CC=clang' >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-toolchain
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
      - name: Build
        run: |
          set +e
          cargo xtask runtime
          cargo build --locked -p ms-cli
      - name: Probe
        continue-on-error: true
        run: |
          set +e
          ms="$GITHUB_WORKSPACE/target/debug/ms"
          f="quoted folding trims"
          y="$GITHUB_WORKSPACE/tests/e2e/testdata/stdlib/yaml.ms"
          "$ms" test "$y" --build-type Release --filter "does not exist" >/dev/null 2>&1
          real=$(ls -d "$XDG_CACHE_HOME"/ms/llvm/*/ | head -1)
          echo "tools: $real"; ls "$real"
          W="$RUNNER_TEMP/wrap"; mkdir -p "$W"
          cp "$real"/* "$W"/ 2>/dev/null
          mv "$W/opt" "$W/opt.real"
          cat > "$W/opt" <<EOS
          #!/bin/sh
          exec "$W/opt.real" -opt-bisect-limit=\${BISECT:--1} "\$@" 2>>"$RUNNER_TEMP/bisect.log"
          EOS
          sed -i 's/^          //' "$W/opt"
          chmod +x "$W/opt"; cat "$W/opt"
          snap="$RUNNER_TEMP/snap"; cp -R "$XDG_CACHE_HOME" "$snap"
          crashes() {
            rm -rf "$RUNNER_TEMP/c"; cp -R "$snap" "$RUNNER_TEMP/c"
            : > "$RUNNER_TEMP/bisect.log"
            BISECT=$1 XDG_CACHE_HOME="$RUNNER_TEMP/c" MS_LLVM_TOOLS="$W" "$ms" test "$y" --build-type Release --filter "$f" 2>&1 | grep -a -q "signal 11"
          }
          BISECT=-1 XDG_CACHE_HOME="$snap" MS_LLVM_TOOLS="$W" "$ms" test "$y" --build-type Release --filter "$f" 2>&1 | tail -8
          crashes -1; echo "full: crash=$?"; total=$(grep -a -c "BISECT: running" "$RUNNER_TEMP/bisect.log"); echo "passes: $total"
