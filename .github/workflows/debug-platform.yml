name: Debug platform
on:
  push:
    branches: ['debug/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          
          - { os: darwin, arch: arm64, runner: macos-15 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: amd64
      - name: Select native Windows Rust host and MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          set +e
          $rustTarget = 'x86_64-pc-windows-msvc'
          rustup set default-host $rustTarget
          $msvcLinker = Join-Path $env:VCToolsInstallDir ('bin/Host{0}/{1}/link.exe' -f $env:VSCMD_ARG_HOST_ARCH, $env:VSCMD_ARG_TGT_ARCH)
          $linkerKey = 'CARGO_TARGET_' + $rustTarget.ToUpper().Replace('-', '_') + '_LINKER'
          "$linkerKey=$msvcLinker" >> $env:GITHUB_ENV
      - name: Windows CC
        if: runner.os == 'Windows'
        run: echo 'CC=clang' >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-toolchain
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
      - name: Build
        run: |
          set +e
          cargo xtask runtime
          cargo build --locked -p ms-cli
      - name: Probe
        continue-on-error: true
        run: |
          set +e
          ms="$GITHUB_WORKSPACE/target/debug/ms"
          f="quoted folding trims"
          y="$GITHUB_WORKSPACE/tests/e2e/testdata/stdlib/yaml.ms"
          for v in "" "MS_RT_HOT=0" "MS_VECTORIZE=off"; do
            echo "::group::variant [$v] Release"
            env $v "$ms" test "$y" --build-type Release --filter "$f" 2>&1 | tail -3
            echo "::endgroup::"
          done
          echo "::group::MinSizeRel"
          "$ms" test "$y" --build-type MinSizeRel --filter "$f" 2>&1 | tail -3
          echo "::endgroup::"
          echo "::group::other tests"
          "$ms" test "$y" --build-type Release 2>&1 | grep -a -E "FAIL|tests,"
          echo "::endgroup::"
