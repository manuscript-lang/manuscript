name: Debug platform
on:
  push:
    branches: ['debug/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          
          - { os: darwin, arch: arm64, runner: macos-15 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: amd64
      - name: Select native Windows Rust host and MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          set +e
          $rustTarget = 'x86_64-pc-windows-msvc'
          rustup set default-host $rustTarget
          $msvcLinker = Join-Path $env:VCToolsInstallDir ('bin/Host{0}/{1}/link.exe' -f $env:VSCMD_ARG_HOST_ARCH, $env:VSCMD_ARG_TGT_ARCH)
          $linkerKey = 'CARGO_TARGET_' + $rustTarget.ToUpper().Replace('-', '_') + '_LINKER'
          "$linkerKey=$msvcLinker" >> $env:GITHUB_ENV
      - name: Windows CC
        if: runner.os == 'Windows'
        run: echo 'CC=clang' >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-toolchain
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
      - name: Build
        run: |
          set +e
          cargo xtask runtime
          cargo build --locked -p ms-cli
      - name: Probe
        continue-on-error: true
        run: |
          set +e
          ms=target/debug/ms
          if [ "$RUNNER_OS" = Windows ]; then ms="$ms.exe"; fi
          touch /tmp/marker
          sleep 1
          "$ms" test tests/conformance/fixtures/snippets/testing-fixture-teardown-on-skip.ms --build-type Release --filter "a fault" 2>&1 | grep -a -E "DBG|at "
          echo "cache: $XDG_CACHE_HOME $HOME"
          exe=$(find "${XDG_CACHE_HOME:-$HOME/.cache}" "$HOME/Library/Caches" "$TMPDIR" /tmp -type f -newer /tmp/marker \( -perm -u+x -o -name '*.exe' \) 2>/dev/null | head -20)
          echo "candidates: $exe"
          for e in $exe; do
            if llvm-objdump -d -l "$e" 2>/dev/null | grep -a -q "teardown-on-skip.ms:35"; then
              echo "::group::disasm $e"
              llvm-objdump -d -l --no-show-raw-insn "$e" 2>/dev/null | awk '/teardown-on-skip.ms:/{keep=40} keep>0{print; keep--}' | head -500
              echo "::endgroup::"
              echo "::group::dwarf line $e"
              llvm-dwarfdump --debug-line "$e" 2>/dev/null | grep -a -B1 -A1 -E " (15|35) +[0-9]+" | head -80
              echo "::endgroup::"
              break
            fi
          done
