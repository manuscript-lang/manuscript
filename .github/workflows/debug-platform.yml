name: Debug platform
on:
  push:
    branches: ['debug/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          
          - { os: darwin, arch: arm64, runner: macos-15 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: amd64
      - name: Select native Windows Rust host and MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          set +e
          $rustTarget = 'x86_64-pc-windows-msvc'
          rustup set default-host $rustTarget
          $msvcLinker = Join-Path $env:VCToolsInstallDir ('bin/Host{0}/{1}/link.exe' -f $env:VSCMD_ARG_HOST_ARCH, $env:VSCMD_ARG_TGT_ARCH)
          $linkerKey = 'CARGO_TARGET_' + $rustTarget.ToUpper().Replace('-', '_') + '_LINKER'
          "$linkerKey=$msvcLinker" >> $env:GITHUB_ENV
      - name: Windows CC
        if: runner.os == 'Windows'
        run: echo 'CC=clang' >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-toolchain
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
      - name: Build
        run: |
          set +e
          cargo xtask runtime
          cargo build --locked -p ms-cli
      - name: Probe
        continue-on-error: true
        run: |
          set +e
          ms="$GITHUB_WORKSPACE/target/debug/ms"
          y="$GITHUB_WORKSPACE/tests/e2e/testdata/stdlib/yaml.ms"
          "$ms" test "$y" --build-type Release --filter "does not exist" >/dev/null 2>&1
          real=$(ls -d "$XDG_CACHE_HOME"/ms/llvm/*/ | head -1)
          W="$RUNNER_TEMP/wrap"; mkdir -p "$W"
          cp "$real"/* "$W"/ 2>/dev/null
          mv "$W/opt" "$W/opt.real"
          printf '#!/bin/sh\nexec "%s/opt.real" -opt-bisect-limit=5489 "$@" 2>/dev/null\n' "$W" > "$W/opt"
          chmod +x "$W/opt"
          touch "$RUNNER_TEMP/stamp"; sleep 1
          MS_KEEP_LL="$RUNNER_TEMP/keep.ll" MS_LLVM_TOOLS="$W" "$ms" test "$y" --build-type Release --filter "quoted folding trims" 2>&1 | tail -5
          echo "--- candidates"
          find / -xdev -type f -perm -u+x -newer "$RUNNER_TEMP/stamp" -size +1M 2>/dev/null | grep -v -e '^/proc' -e target/debug | head
          exe=$(find / -xdev -type f -perm -u+x -newer "$RUNNER_TEMP/stamp" -size +1M 2>/dev/null | grep -v target/debug | head -1)
          echo "exe=$exe"
          [ -n "$exe" ] && lldb -b -o run -o "bt 8" -o "register read" -o "disassemble -p -c 24" -o "image lookup -a \$pc" -- "$exe" --filter "quoted folding trims" 2>&1 | tail -90
