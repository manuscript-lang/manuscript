name: Nightly safety

# Slow safety checks that do not fit the pull request budget. They run on main only, once a night, and on demand.
# A failure here is a real bug: file an issue and fix the cause, never skip the check.
#   miri          the runtime and the native crates under Miri, one job, crate by crate (needs nightly; see documentation/contributing/rust-toolchain.md)
#   cancel-sweep  cancels every e2e stdlib test at each park and fails when cancellation leaks heap blocks
#   poison-check  runs the corpus under both backends with dead stack slots filled with a pattern
#   ownership-fuzz  random move/borrow/closure programs, leak-counted, Debug vs Release
#   view-matrix   generated view programs (trim, slice, split) with temporaries after them, poisoned, in Debug and Release
#   stress-sched  runs the stdlib sweep under the scheduler stress mode
#   bench-gate    `ms bench` on bench/perf/guards; fails when an allocation or copy count rose more than 3% over baseline.json
#   c-safety      the C style gate on every file (Linux), the C runtime unit tests and fuzz harnesses (src/runtime/fuzz) under AddressSanitizer and UBSan on Linux and macOS, then libFuzzer on Linux
#   c-compiler-test  the C front end against the Rust one on the corpus and 50,000 mutated files
#   perf-counts   instructions of the suite and guard programs under callgrind against bench/perf/counts.txt; opens an issue when one is over 3% higher

on:
  schedule:
    # Not at minute 0: GitHub delays and drops scheduled runs at the start of the hour.
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly Rust with Miri
        run: rustup toolchain install nightly --profile minimal -c miri
      - name: Miri on the runtime and the native crates
        # One job, the crates in sequence; every crate runs even when an earlier one fails, and the
        # step fails at the end. `ms-std-net` needs real files,
        # sockets and processes, which Miri cannot provide, so they stay out. `ms-rt-abi` reads its
        # header file in a test, which Miri's isolation forbids.
        run: |
          failed=""
          for crate in ms-rt-abi; do
            flags="-Zmiri-ignore-leaks -Zmiri-disable-isolation"
            echo "::group::miri $crate"
            MIRIFLAGS="$flags" cargo +nightly miri test -p "$crate" --lib || failed="$failed $crate"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Miri failed:$failed"; exit 1; fi

  sweeps:
    if: github.ref == 'refs/heads/main'
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        check: [cancel-sweep, poison-check, view-matrix, ownership-fuzz, bench-gate, c-compiler-test]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-env
        with:
          os: linux
          arch: amd64
      - run: make ${{ matrix.check }}
        env:
          MS_FUZZ: 50000

  c-safety:
    if: github.ref == 'refs/heads/main'
    name: c-safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - run: sh src/runtime/third_party/libs.sh install
      - run: make c-test
      # Every C file through the style gate (pull requests run clang-tidy on changed files only).
      - if: runner.os == 'Linux'
        run: make c-lint
      - name: Fuzz with a new seed each night
        run: |
          FUZZ_SEED=$(date -u +%Y%m%d) FUZZ_RUNS=3000000 make c-fuzz
      - name: Fuzz with libFuzzer (coverage-guided)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-rt-dev
          CC=clang FUZZER=libfuzzer FUZZ_SEED=$(date -u +%Y%m%d) FUZZ_RUNS=2000000 make c-fuzz
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: c-fuzz-crash-${{ matrix.os }}
          path: target/c-fuzz/*/fuzz-crash*

  perf-counts:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/rust-env
        with:
          os: linux
          arch: amd64
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind
      - name: Count instructions
        id: counts
        run: |
          set -o pipefail
          make build
          make perf-counts | tee perf-counts.txt
      - name: Open an issue naming the commit range
        if: failure() && steps.counts.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The counts were last refreshed by the commit that last changed the file; every
          # commit after it could have moved them.
          base=$(git log -1 --format=%H -- bench/perf/counts.txt)
          {
            echo "A suite program executes more than 3% more instructions than bench/perf/counts.txt records."
            echo
            echo "Commits since the counts were last refreshed: https://github.com/${{ github.repository }}/compare/${base}...${{ github.sha }}"
            echo
            echo '```'
            cat perf-counts.txt
            echo '```'
            echo
            echo "Bisect that range with \`make perf-counts\` (instruction counts are deterministic), fix the cause or revert, and refresh the file only when the cost is deliberate."
          } > body.md
          gh issue create --title "Nightly perf counts regressed on $(git rev-parse --short HEAD)" --label performance --body-file body.md || gh issue create --title "Nightly perf counts regressed on $(git rev-parse --short HEAD)" --body-file body.md
