name: C pipeline platforms

# `MS_BACKEND=c ms build` (the C back end linked into `ms`, then the pinned LLVM tools) on the platforms the pull request jobs do not
# run: the corpus of `compiler/tests/build-diff.sh` built by both back ends and compared. Manual runs only; the
# Linux legs run the same script through `make c-compiler-test`.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Programs to build and compare (0 is every `phase=run` program)
        default: '150'
      os:
        description: Platforms
        type: choice
        options: [all, darwin, windows]
        default: all

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-diff:
    name: ${{ matrix.leg.os }}-${{ matrix.leg.arch }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        leg: >-
          ${{ fromJSON(
          inputs.os == 'darwin' && '[{"os": "darwin", "arch": "amd64", "runner": "macos-15-intel"}, {"os": "darwin", "arch": "arm64", "runner": "macos-15"}]' ||
          inputs.os == 'windows' && '[{"os": "windows", "arch": "amd64", "runner": "windows-2025"}, {"os": "windows", "arch": "arm64", "runner": "windows-11-arm"}]' ||
          '[{"os": "darwin", "arch": "amd64", "runner": "macos-15-intel"}, {"os": "darwin", "arch": "arm64", "runner": "macos-15"}, {"os": "windows", "arch": "amd64", "runner": "windows-2025"}, {"os": "windows", "arch": "arm64", "runner": "windows-11-arm"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-env
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
      - name: Build ms and its runtime
        run: |
          cmake -P cmake/BuildRuntime.cmake
          cargo build --release --locked -p ms-cli
      - name: Build the tool archive
        run: |
          cmake -S . -B target/cmake/tools -G Ninja -DMS_BUILD_RUNTIME=OFF
          cmake --build target/cmake/tools --target ms_tool
      - name: Build the front
        run: |
          mkdir -p keep
          MS_KEEP_LL=1 target/release/ms build tools/ms/main.ms --link target/cmake/tools/compiler/libmstool.a -o keep/msx 2> keep/err.txt || true
          cp ms-keep.ll keep/ 2>/dev/null || true
          tail -c 3000 keep/err.txt
          llc=$(ls ~/.cache/ms/llvm/*/llc | head -1)
          "$llc" -O0 -filetype=asm -relocation-model=pic -mtriple=arm64-apple-darwin ms-keep.ll -o keep/plain.s || true
          awk '/^_[^ ]*:/ { name = $1 } /\.cfi_startproc/ { start = NR } /\.cfi_endproc/ { print NR - start, name }' keep/plain.s | sort -rn | head -15 | tee keep/largest.txt
          gzip keep/plain.s keep/ms-keep.ll || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-diff-${{ matrix.leg.os }}-${{ matrix.leg.arch }}
          path: keep
