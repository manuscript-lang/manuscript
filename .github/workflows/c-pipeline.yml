name: C pipeline platforms

# `MS_BACKEND=c ms build` (the C back end linked into `ms`, then the pinned LLVM tools) on the platforms the pull request jobs do not
# run: the corpus of `compiler/tests/build-diff.sh` built by both back ends and compared. Manual runs only; the
# Linux legs run the same script through `make c-compiler-test`.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Programs to build and compare (0 is every `phase=run` program)
        default: '150'
      os:
        description: Platforms
        type: choice
        options: [all, darwin, windows]
        default: all

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-diff:
    name: ${{ matrix.leg.os }}-${{ matrix.leg.arch }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        leg: >-
          ${{ fromJSON(
          inputs.os == 'windows' && '[{"os": "windows", "arch": "amd64", "runner": "windows-2025"}]' ||
          '[{"os": "darwin", "arch": "amd64", "runner": "macos-15-intel"}, {"os": "darwin", "arch": "arm64", "runner": "macos-15"}, {"os": "windows", "arch": "amd64", "runner": "windows-2025"}, {"os": "windows", "arch": "arm64", "runner": "windows-11-arm"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-env
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
      - name: Build ms and its runtime
        run: |
          cmake -P cmake/BuildRuntime.cmake
          cargo build --release --locked -p ms-cli
      - name: stop-hold under Windows
        run: |
          target/release/ms run tests/conformance/fixtures/e2e/accept/stop-hold.ms; echo "exit=$?"
          printf 'import hold_stop, spawn, watch_signals from "@std/os/process.ms"\nimport seconds from "@std/time.ms"\nfn main() Void!:\n\t_h := hold_stop()\n\tvar s = watch_signals([15], none)?\n\tc := spawn("sh", ["-c", "echo ppid=$PPID; kill -TERM $PPID; echo kill=$?"])?\n\tprint(f"status {c.wait()?}")\n\tprint(f"sig {s.next(timeout: seconds(3))?}")\n' > probe.ms
          target/release/ms run probe.ms; echo "exit=$?"
          which sh; sh -c 'echo $PPID; kill -l | head -3'
      - name: Keep nothing
        run: mkdir -p keep && echo x > keep/x
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-diff-${{ matrix.leg.os }}-${{ matrix.leg.arch }}
          path: keep
