name: C pipeline platforms
# Temporary debug copy: a macOS crash report (branch only, never merged).
on:
  workflow_dispatch:
    inputs:
      limit:
        default: '150'
      os:
        type: choice
        options: [all, darwin, windows]
        default: all
defaults:
  run:
    shell: bash
jobs:
  mac-debug:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-env
        with:
          os: darwin
          arch: arm64
      - name: Build ms
        run: make build
      - name: Crash report
        run: |
          cd tests/conformance/fixtures/e2e/stdlib
          "$GITHUB_WORKSPACE/target/release/ms" test fetch.ms --filter "times out" 2>&1 | tail -5 || true
          sleep 20
          ls -la ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports 2>&1 | head -20
          for r in ~/Library/Logs/DiagnosticReports/*.ips /Library/Logs/DiagnosticReports/*.ips; do
            [ -f "$r" ] || continue
            echo "=== $r"; head -c 12000 "$r"
          done
          # a second try under lldb: run the test program in the foreground
          "$GITHUB_WORKSPACE/target/release/ms" build fetch.ms -o /tmp/fetch_prog 2>&1 | tail -3 || true
