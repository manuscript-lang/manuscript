name: sccache trial

# Measures whether sccache could replace the whole-target cache on Linux: a cold build fills
# sccache, `cargo clean` removes target/, and a second build runs entirely from sccache. The summary
# gives both times and the size of the sccache directory as the cache action would store it.
# Remove this file once the comparison is recorded.
on:
  pull_request:
    paths: [.github/workflows/sccache-trial.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 3G

jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: sccache
      - name: Fetch bundled lld
        run: |
          dest="$RUNNER_TEMP/llvm-bundle/install"
          sh scripts/fetch-lld.sh linux amd64 "$dest"
          echo "MS_LLD=$dest/bin/lld" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
      - name: Cold build fills sccache
        run: |
          start=$(date +%s)
          cargo build --workspace --all-targets --locked --keep-going
          cargo build --locked -p ms-cli
          echo "cold=$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/times"
          sccache --show-stats
      - name: Build again from sccache with an empty target
        run: |
          cargo clean
          sccache --zero-stats
          start=$(date +%s)
          cargo build --workspace --all-targets --locked --keep-going
          cargo build --locked -p ms-cli
          echo "warm=$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/times"
          sccache --show-stats
      - name: Report
        run: |
          raw=$(du -sm "$SCCACHE_DIR" | cut -f1)
          zst=$(tar -C "$SCCACHE_DIR" -c . | zstd -3 -T0 | wc -c)
          {
            echo "## sccache trial"
            sed 's/^/- /' "$RUNNER_TEMP/times"
            echo "- sccache dir: ${raw} MB on disk, $(( zst / 1048576 )) MB zstd-compressed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
