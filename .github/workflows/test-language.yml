name: Language

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Rust format, clippy, tests and the conformance corpus run in cicd.yml. This workflow holds the
# checks that need the pinned linters and the editor toolchain.
jobs:
  # The job is named `test` so its check is the stable required "Language checks / test".
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: language-static
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache/restore@v6
        id: tools
        with:
          path: .tools/
          key: devtools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/devtools.env', 'scripts/devtools.sha256') }}
      - name: Install pinned linters
        run: make setup
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' && steps.tools.outputs.cache-hit != 'true'
        with:
          path: .tools/
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Workflow and shell lint, repo rules, licenses
        run: make lint repo-check licenses-check
      - name: Validate and package VS Code extension
        working-directory: extensions/vscode
        run: |
          npm ci
          npm run package -- --allow-missing-repository
      - uses: actions/upload-artifact@v7
        with:
          name: manuscript-vscode
          path: extensions/vscode/*.vsix
