name: Language

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Each unit of work runs exactly once. Jobs are grouped by shared inputs, not by
# topic: static checks share the pinned linters, Go tests share one sharded
# race+coverage run, and the distribution checks share the packaged CLI.
jobs:
  # Format, vet, lint, repo rules, licenses, generated docs, and the book.
  static:
    name: Static checks and docs book
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/cache@v6
        with:
          path: |
            toolchain/
            .tools/
          key: devtools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version', 'scripts/toolchains.sha256', 'scripts/devtools.env', 'scripts/devtools.sha256') }}
      - name: Prepare verified SDK and pinned linters
        run: make setup
      - name: Format, vet, lint, repo rules, generated docs, licenses
        run: make check lint repo-check docs-check licenses-check
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.146.7'
          extended: true
      - name: Validate project URL prefixes and production output
        run: |
          make book-check
          make book
          node --test tests/docs/publication.test.cjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/book

  # Every Go test runs once: unit, stdlib, examples, and native end-to-end, with
  # coverage; in-process packages also run under the race detector.
  go:
    name: Go tests (shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/cache@v6
        with:
          path: toolchain/
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version', 'scripts/toolchains.sha256') }}
      - name: Prepare SDK payload
        run: make payload
      - name: Sharded race and coverage tests
        run: sh scripts/ci-test.sh ${{ matrix.shard }} 4
      - uses: actions/upload-artifact@v7
        with:
          name: language-coverage-${{ matrix.shard }}
          path: .artifacts/coverage/

  # The bundled CLI, built once and reused by the editor tests.
  dist:
    name: CLI, distribution, fuzz, and editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - uses: actions/cache@v6
        with:
          path: toolchain/
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version', 'scripts/toolchains.sha256') }}
      - name: Build bundled CLI and run hello
        run: |
          make build
          ./ms check examples/hello/ms.toml
          ./ms lock examples/hello/ms.toml
          ./ms run examples/hello/ms.toml -- first second
      - name: Verify offline standalone distribution
        run: make dist-check
      - name: Parser and compiler fuzzing
        run: make fuzz
      - name: Validate and package VS Code extension
        working-directory: extensions/vscode
        run: |
          npm ci
          npm run package -- --allow-missing-repository
      - name: Native Manuscript DAP integration
        working-directory: extensions/vscode
        run: |
          MANUSCRIPT_DAP_TEST=1 MANUSCRIPT_MS="$GITHUB_WORKSPACE/ms" MANUSCRIPT_DAP_ADAPTER="$PWD/dist/debug-adapter.js" node --test tests/debug-adapter.test.js tests/debug-large-literal.test.js
      - uses: actions/upload-artifact@v7
        with:
          name: manuscript-vscode
          path: extensions/vscode/*.vsix

  # Linux host behavior is covered by the Go shards.
  host-stdlib:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Native host compatibility and Node.js coverage
        shell: bash
        run: |
          make payload
          toolchain/go/bin/go test ./pkg/runtime ./pkg/compiler ./tests/e2e -run 'TestFileSystem|TestNativeFileWatch|TestTimeScheduling|TestFilesystemCopyOptions|TestFilesystemGlobOptions|TestFileStatMetadata|TestNodePathFixtures|TestBundledRuntimeImport|TestNativeBuildInSymlinked|TestNodeHost|TestNodeConstantCatalogs|TestProcessSignalStream|TestShutdownCookbook|TestExpandedSystemAndProcess|TestExpandedLibraryCLI'

  # Keep one stable required check; every applicable job must pass before merging.
  test:
    needs: [static, go, dist, host-stdlib]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all language checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*|*,skipped,*) exit 1 ;;
          esac
