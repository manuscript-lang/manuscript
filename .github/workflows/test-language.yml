name: Language

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - name: Check formatting and vet
        run: make check
      - name: Unit and native end-to-end tests
        run: make test
      - name: Runtime and compiler race checks
        run: make race
      - name: Build CLI and check example
        run: |
          make build
          ./ms check examples/hello/ms.toml
          ./ms lock examples/hello/ms.toml
          ./ms run examples/hello/ms.toml -- first second

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned native debugger
        run: go install github.com/go-delve/delve/cmd/dlv@v1.25.2
      - name: Validate and package VS Code extension
        working-directory: extensions/vscode
        run: |
          npm ci
          npm run check
          npm run package -- --allow-missing-repository
      - name: Native Manuscript DAP integration
        working-directory: extensions/vscode
        run: |
          MANUSCRIPT_DAP_TEST=1 MANUSCRIPT_MS="$GITHUB_WORKSPACE/ms" MANUSCRIPT_DLV="$(go env GOPATH)/bin/dlv" MANUSCRIPT_DAP_ADAPTER="$PWD/dist/debug-adapter.js" node tests/debug-adapter.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-vscode
          path: extensions/vscode/*.vsix
      - name: Verify self-contained distribution without system Go
        run: make dist-check

  host-stdlib:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Native host compatibility and Node.js coverage
        shell: bash
        run: |
          go test ./runtime ./compiler ./tests/e2e -run 'TestNativeFileWatch|TestScheduledTimer|TestFilesystemCopyOptions|TestFilesystemGlobOptions|TestFileStatMetadata|TestNodePathFixtures|TestBundledRuntimeImport|TestNativeBuildInSymlinked|TestNodeHost|TestNodeConstantCatalogs|TestProcessSignalStream|TestExpandedSystemAndProcess|TestExpandedLibraryCLI'
