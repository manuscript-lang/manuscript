name: Language

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Rust format, clippy, tests and the conformance corpus run in cicd.yml. This workflow holds the
# checks that need the editor toolchain.
jobs:
  # The job is named `test` so its check is the stable required "Language checks / test".
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      # The key hashes only Cargo.lock and the toolchain (rust-cache also hashes every manifest, so it
      # writes a new entry whenever one changes). One entry per name and lockfile, saved on main.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-language-static-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-language-static-
      - name: Repo rules and licenses
        run: make repo-check licenses-check
      - name: Save cargo cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Validate and package VS Code extension
        working-directory: extensions/vscode
        run: |
          npm ci
          npm run package -- --allow-missing-repository
      - uses: actions/upload-artifact@v7
        with:
          name: manuscript-vscode
          path: extensions/vscode/*.vsix
