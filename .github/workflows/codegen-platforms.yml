name: Native codegen platforms

on:
  workflow_call:
    inputs:
      dwarf:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: windows, arch: amd64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Keep native test artifacts in runner storage
        run: |
          printf '%s\n' "TMPDIR=$RUNNER_TEMP" "TMP=$RUNNER_TEMP" "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-codegen-${{ matrix.os }}-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Select native Windows Rust host and MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rustTarget = if ('${{ matrix.arch }}' -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          rustup set default-host $rustTarget
          $msvcLinker = Join-Path $env:VCToolsInstallDir ('bin/Host{0}/{1}/link.exe' -f $env:VSCMD_ARG_HOST_ARCH, $env:VSCMD_ARG_TGT_ARCH)
          if (!(Test-Path $msvcLinker)) { throw "MSVC linker missing: $msvcLinker" }
          $linkerKey = 'CARGO_TARGET_' + $rustTarget.ToUpper().Replace('-', '_') + '_LINKER'
          "$linkerKey=$msvcLinker" >> $env:GITHUB_ENV
          Write-Output "Rust linker: $msvcLinker"
      - name: Record native host and compiler
        run: |
          rustc -Vv
          cargo -V
          host=$(rustc -vV | sed -n 's/^host: //p')
          expected=x86_64
          if [ '${{ matrix.arch }}' = arm64 ]; then expected=aarch64; fi
          case "$host" in "$expected"-*) ;; *) echo "Wrong native Rust host: $host"; exit 1 ;; esac
          if [ "$RUNNER_OS" = Windows ]; then
            clang --version
            echo 'CC=clang' >> "$GITHUB_ENV"
            echo 'MS_LINKER=clang' >> "$GITHUB_ENV"
          else
            cc --version
          fi
      - name: Install LLVM native debug consumers
        if: inputs.dwarf
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y llvm
          elif [ "$RUNNER_OS" = macOS ]; then
            brew install llvm
            echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          elif [ "$RUNNER_OS" = Windows ] && [ '${{ matrix.arch }}' = arm64 ]; then
            echo 'C:/Program Files/LLVM/bin' >> "$GITHUB_PATH"
          fi
      - name: Cache Windows x64 LLVM consumers
        if: inputs.dwarf && runner.os == 'Windows' && matrix.arch == 'amd64'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/llvm-debug-19.1.7
          key: llvm-debug-windows-x64-19.1.7-b4557b4f
      - name: Install Windows x64 LLVM consumers
        if: inputs.dwarf && runner.os == 'Windows' && matrix.arch == 'amd64'
        run: |
          tools="$RUNNER_TEMP/llvm-debug-19.1.7"
          if [ ! -x "$tools/llvm-dwarfdump.exe" ] || [ ! -x "$tools/llvm-symbolizer.exe" ]; then
            archive="$RUNNER_TEMP/llvm-debug-19.1.7.tar.xz"
            curl --fail --location --retry 3 'https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/clang%2Bllvm-19.1.7-x86_64-pc-windows-msvc.tar.xz' -o "$archive"
            echo "b4557b4f012161f56a2f5d9e877ab9635cafd7a08f7affe14829bd60c9d357f0  $archive" | sha256sum --check
            mkdir -p "$tools"
            tar -xf "$archive" -C "$tools" --strip-components=2 \
              clang+llvm-19.1.7-x86_64-pc-windows-msvc/bin/llvm-dwarfdump.exe \
              clang+llvm-19.1.7-x86_64-pc-windows-msvc/bin/llvm-symbolizer.exe
          fi
          echo "$tools" >> "$GITHUB_PATH"
      - name: MIR signed boundaries and fault semantics
        run: cargo test --locked -p ms-mir --test opt_overflow -- --nocapture
      - name: Native overflow, fault positions, cleanup and inline frames
        run: |
          cargo test --locked -p ms-clif --test native predicated_overflow -- --nocapture
          cargo test --locked -p ms-clif --test native fault_trace_on_real_runtime -- --nocapture
      - name: Native object and linked source attribution
        if: inputs.dwarf
        run: |
          llvm-dwarfdump --version
          llvm-symbolizer --version
          cargo test --locked -p ms-clif --test dwarf -- --nocapture
          cargo test --locked -p ms-driver --test debug_artifacts -- --nocapture
          cargo test --locked -p ms-driver --lib -- --nocapture
      - name: Preserve native test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codegen-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/ms-clif-tests-*
            ${{ runner.temp }}/ms-dwarf-*
            ${{ runner.temp }}/ms-driver-debug-*
          if-no-files-found: warn
