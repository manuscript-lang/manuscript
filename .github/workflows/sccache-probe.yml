name: sccache probe

# Temporary experiment (#4426): does cranelift-codegen hit the sccache? Closed unmerged once answered.
on:
  pull_request:
    paths: ['.github/workflows/sccache-probe.yml']

permissions:
  contents: read

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 1500M
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-linux-amd64-
      - uses: ./.github/actions/rust-env
        with:
          os: linux
          arch: amd64
      - uses: ./.github/actions/native-runtime
        with:
          os: linux
          arch: amd64
      - name: Restored cache contents
        shell: bash
        run: |
          du -sh "$SCCACHE_DIR"
          sccache --show-stats | grep -E "Cache size|Max cache size"
          echo "entries: $(find "$SCCACHE_DIR" -type f | wc -l)"
          echo "oldest/newest entry mtime:"
          find "$SCCACHE_DIR" -type f -printf '%TY-%Tm-%Td %TH:%TM\n' | sort | sed -n '1p;$p'
          echo "entries over 20 MB (size MB, mtime):"
          find "$SCCACHE_DIR" -type f -size +20M -printf '%s %TY-%Tm-%Td_%TH:%TM\n' | awk '{printf "%d %s\n", $1/1048576, $2}' | sort -k2 | head -40
      - name: Workspace build, then clean cranelift-codegen and rebuild it the same way
        shell: bash
        run: |
          s0=$(date +%s)
          cargo build --workspace --all-targets --locked -q
          echo "first workspace build: $(( $(date +%s) - s0 )) s"
          sccache --show-stats | grep -E "Compile requests  |Cache hits \(Rust\)|Cache misses \(Rust\)"
          echo "entries over 20 MB after the build:"
          find "$SCCACHE_DIR" -type f -size +20M -printf '%s %TY-%Tm-%Td_%TH:%TM\n' | awk '{printf "%d %s\n", $1/1048576, $2}' | sort -k2 | head -40
          for i in 1 2; do
            sccache --zero-stats >/dev/null
            cargo clean -p cranelift-codegen -q
            s=$(date +%s)
            cargo build --workspace --all-targets --locked -q
            echo "round $i: $(( $(date +%s) - s )) s"
            sccache --show-stats | grep -E "Compile requests  |Cache hits \(Rust\)|Cache misses \(Rust\)|Non-cacheable"
          done
      - name: Why (debug log of one more rebuild)
        shell: bash
        run: |
          sccache --stop-server >/dev/null 2>&1 || true
          cargo clean -p cranelift-codegen -q
          SCCACHE_LOG=debug SCCACHE_ERROR_LOG=$RUNNER_TEMP/sccache.log cargo build --workspace --all-targets --locked -q || true
          grep -E "\[cranelift_codegen\]" $RUNNER_TEMP/sccache.log | cut -c1-400 | head -20
