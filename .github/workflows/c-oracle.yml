name: C port oracle

# Builds the frozen oracle (ms and ms-conform at 660429d4, the last pure Rust commit) for every platform
# and keeps the binaries as artifacts, outside the repository. Run it by hand; the conformance gate of
# the C port (`conform-c`) reads the binaries through MS_ORACLE_DIR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    name: oracle-${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: windows, arch: amd64, runner: windows-2025}
          - {os: windows, arch: arm64, runner: windows-11-arm}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 660429d4bcd1f052a7477df1c668ce7bdac32ce4
      - uses: ./.github/actions/rust-env
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
      - run: cargo xtask runtime
      - run: cargo build --release --locked -p ms-cli -p ms-conform
      - uses: actions/upload-artifact@v7
        with:
          name: oracle-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            target/release/ms
            target/release/ms.exe
            target/release/ms-conform
            target/release/ms-conform.exe
          if-no-files-found: error
          retention-days: 90
