name: CI/CD

# One workflow, four triggers:
#   pull request  the Linux legs (amd64 and arm64, `tests` and `conformance` each), the language checks
#                 and the book. A green pull request auto-merges on them; there is no merge queue, which
#                 built every stacked ref with the full matrix and restarted on every outside merge.
#   merge queue   the same as a pull request, in case a queue is configured again.
#   push to main  all six platforms in two parts each (see .github/actions/rust-checks), the language
#                 checks and the book, plus Pages and the sccache caches. A newer push cancels the running
#                 one, so the latest main is the one being tested. A platform failure is fixed or reverted.
#   manual run    the same as a push; its `os` input runs one platform's legs.
# Require `Platform checks`, `Language checks` and `Build design book`.
# The account runs 20 jobs at once and every extra job waits in the queue.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      os:
        description: Platforms for the Rust jobs
        type: choice
        options: [all, linux, darwin, windows]
        default: all

permissions:
  contents: read

env:
  # sccache stores each compiler output, so the saved cache stays small and bounded
  # (`target/` grew to several GB) and a changed crate rebuilds only itself.
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 2G
  # Debug info makes the dev and test builds slower to link and the saved caches several times
  # larger; nothing in CI reads the compiler's own debug info. Release keeps the profile setting.
  CARGO_PROFILE_DEV_DEBUG: '0'
  # Incremental artifacts are large and never reused on a fresh runner.
  CARGO_INCREMENTAL: '0'

concurrency:
  # A new commit cancels the earlier run of the same pull request, and a new push to main the earlier main
  # run; queue and manual runs are never cancelled.
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

defaults:
  run:
    shell: bash

jobs:
  # The platform legs of the Rust jobs. A job `if` cannot read the matrix, so the legs are picked here:
  # Linux on pull requests, the `os` input on a manual run, all six on a push.
  # `lint`: also format and clippy. `cranelift`: also the corpus and fixtures with
  # `MS_BACKEND=cranelift`, so release builds use the Cranelift backend that Debug builds use.
  # Failures shared with Linux are in tests/conformance/expect-fail.txt; platform-only ones go
  # in tests/conformance/expect-fail.<os>.txt with a reason.
  legs:
    name: Platform legs
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      # A commit pushed within a minute cancels this run before any build starts.
      - name: Wait for a newer push
        if: github.event_name == 'pull_request'
        run: sleep 60
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # Documentation-only pull requests skip the Rust jobs.
      - id: scope
        uses: ./.github/actions/rust-scope
      - id: legs
        env:
          OS: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'linux' || inputs.os || 'all' }}
          LEGS: >-
            [
            {"os": "linux", "arch": "amd64", "runner": "ubuntu-24.04", "lint": true, "cranelift": true},
            {"os": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm"},
            {"os": "darwin", "arch": "amd64", "runner": "macos-15-intel"},
            {"os": "darwin", "arch": "arm64", "runner": "macos-15", "cranelift": true},
            {"os": "windows", "arch": "amd64", "runner": "windows-2025", "cranelift": true},
            {"os": "windows", "arch": "arm64", "runner": "windows-11-arm"}
            ]
        run: echo "legs=$(jq -c --arg os "$OS" 'map(select($os == "all" or .os == $os))' <<<"$LEGS")" >> "$GITHUB_OUTPUT"

  rust:
    name: ${{ matrix.leg.os }}-${{ matrix.leg.arch }} · ${{ matrix.part == 'a' && 'tests' || 'conformance' }}
    needs: legs
    if: needs.legs.outputs.rust == 'true'
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        part: [a, b]
        leg: ${{ fromJSON(needs.legs.outputs.legs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-${{ matrix.leg.os }}-${{ matrix.leg.arch }}-${{ matrix.part }}-
      - uses: ./.github/actions/rust-env
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
          llvm-consumers: ${{ matrix.part == 'a' && 'true' || 'false' }}
      - uses: ./.github/actions/rust-checks
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
          part: ${{ matrix.part }}
          lint: ${{ matrix.leg.lint || false }}
          cranelift: ${{ matrix.leg.cranelift || false }}
      - uses: ./.github/actions/sccache-save
        if: ${{ !cancelled() }}
        with:
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          primary-key: ${{ steps.sccache.outputs.primary-key }}

  # The sum of the jobs above, one name for a ruleset to require.
  platforms:
    name: Platform checks
    if: always()
    needs: [legs, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform leg
        env:
          LEGS: ${{ needs.legs.result }}
          RUST: ${{ needs.rust.result }}
          SCOPE: ${{ needs.legs.outputs.rust }}
        run: test "$LEGS" = success && { test "$RUST" = success || { test "$SCOPE" = false && test "$RUST" = skipped; }; }

  language:
    name: Language checks
    uses: ./.github/workflows/test-language.yml

  book:
    name: Build design book
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 1G
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-docs-
      - uses: ./.github/actions/book-checks
      - uses: ./.github/actions/sccache-save
        if: ${{ !cancelled() }}
        with:
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          primary-key: ${{ steps.sccache.outputs.primary-key }}
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        with:
          path: .artifacts/book

  pages:
    name: Publish Pages docs
    needs: [book, language]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deploy
