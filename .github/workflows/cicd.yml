name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  language:
    name: Language checks
    uses: ./.github/workflows/test-language.yml

  build:
    name: Build design book
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/cache@v4
        with:
          path: toolchain/
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version', 'scripts/toolchains.sha256') }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Prepare pinned SDK
        run: make toolchain
      - name: Check generated reference and shared highlighting
        run: |
          make docs-check
          node --test tests/docs/highlighting.test.cjs
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.146.7'
          extended: true
      - name: Validate project URL prefixes and production output
        run: |
          make book-check
          make book
          node --test tests/docs/publication.test.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .artifacts/book

  pages:
    name: Publish Pages docs
    needs: [build, language]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      # This idempotent migration also handles existing branch-based sites.
      - name: Select Actions publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method PUT "repos/${GH_REPO}/pages" -f build_type=workflow
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deploy
