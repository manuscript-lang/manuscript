name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Debug info makes the dev and test builds slower to link and the saved caches several times
  # larger; nothing in CI reads the compiler's own debug info. Release keeps the profile setting.
  CARGO_PROFILE_DEV_DEBUG: '0'
  # Incremental artifacts are large and never reused on a fresh runner.
  CARGO_INCREMENTAL: '0'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  language:
    name: Language checks
    uses: ./.github/workflows/test-language.yml

  # Docs-only changes skip the Rust jobs.
  changes:
    name: Detect Rust-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          rust=true
          if [ "$EVENT" = pull_request ]; then
            if ! git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^(documentation/|website/|blog/|proposals/|skills/|extensions/|.*\.md$)'; then
              rust=false
            fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          # Windows and macOS runners are scarce and queue for tens of minutes, so pull requests run
          # Linux only; pushes to main, merge groups and manual runs cover all six platforms. Run
          # the workflow by hand on a branch to test a platform-specific change before merging.
          include='{"os":"linux","arch":"amd64","runner":"ubuntu-24.04","full":true,"corpus":true},
            {"os":"linux","arch":"arm64","runner":"ubuntu-24.04-arm"}'
          if [ "$EVENT" != pull_request ]; then
            include="$include,
            {\"os\":\"darwin\",\"arch\":\"amd64\",\"runner\":\"macos-15-intel\"},
            {\"os\":\"darwin\",\"arch\":\"arm64\",\"runner\":\"macos-15\",\"tests\":true,\"corpus\":true},
            {\"os\":\"windows\",\"arch\":\"amd64\",\"runner\":\"windows-2025\",\"tests\":true,\"corpus\":true},
            {\"os\":\"windows\",\"arch\":\"arm64\",\"runner\":\"windows-11-arm\"}"
          fi
          echo "matrix={\"include\":[$include]}" | tr -d '\n' >> "$GITHUB_OUTPUT"
          echo >> "$GITHUB_OUTPUT"

  # One job per platform runs everything for that platform in sequence, so a pull request
  # starts six Rust runners, not dozens (the account runs 20 jobs at once). Tests parallelize
  # inside the job: nextest and the corpus runner both use every core.
  rust:
    name: Rust ${{ matrix.os }}-${{ matrix.arch }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        # `full`: format, clippy, every crate's tests and doc tests. `tests`: the same tests and doc
        # tests without format and clippy. `corpus`: the frozen conformance corpus against the Rust
        # ms on this platform. Failures shared with Linux are in tests/conformance/expect-fail.txt;
        # platform-only ones go in tests/conformance/expect-fail.<os>.txt with a reason. The legs
        # come from the `changes` job, which leaves out darwin on pull requests.
        include: ${{ fromJSON(needs.changes.outputs.matrix).include }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Keep native test artifacts in runner storage
        run: |
          printf '%s\n' "TMPDIR=$RUNNER_TEMP" "TMP=$RUNNER_TEMP" "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}
      # The key hashes only Cargo.lock and the toolchain (rust-cache also hashes every manifest, so it
      # writes a new entry whenever one changes). One entry per name and lockfile, saved on main.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-rust-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-rust-${{ matrix.os }}-${{ matrix.arch }}-
      - uses: taiki-e/install-action@v2
        if: matrix.full || matrix.tests
        with:
          tool: nextest
      - name: Select native Windows Rust host and MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rustTarget = if ('${{ matrix.arch }}' -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          rustup set default-host $rustTarget
          $msvcLinker = Join-Path $env:VCToolsInstallDir ('bin/Host{0}/{1}/link.exe' -f $env:VSCMD_ARG_HOST_ARCH, $env:VSCMD_ARG_TGT_ARCH)
          if (!(Test-Path $msvcLinker)) { throw "MSVC linker missing: $msvcLinker" }
          $linkerKey = 'CARGO_TARGET_' + $rustTarget.ToUpper().Replace('-', '_') + '_LINKER'
          "$linkerKey=$msvcLinker" >> $env:GITHUB_ENV
          Write-Output "Rust linker: $msvcLinker"
      - name: Record native host and compiler
        run: |
          rustc -Vv
          cargo -V
          host=$(rustc -vV | sed -n 's/^host: //p')
          expected=x86_64
          if [ '${{ matrix.arch }}' = arm64 ]; then expected=aarch64; fi
          case "$host" in "$expected"-*) ;; *) echo "Wrong native Rust host: $host"; exit 1 ;; esac
          if [ "$RUNNER_OS" = Windows ]; then
            clang --version
            echo 'CC=clang' >> "$GITHUB_ENV"
          else
            cc --version
          fi
      # `ms` embeds a pinned static lld to link programs (crates/ms-clif/build.rs reads MS_LLD). It is
      # built and released by manuscript-lang/llvm-bundle and pinned by checksum in scripts/lld.lock.
      - name: Fetch bundled lld
        run: |
          dest="$RUNNER_TEMP/llvm-bundle/install"
          if [ "$RUNNER_OS" = Windows ]; then dest=$(cygpath -u "$dest"); fi
          sh scripts/fetch-lld.sh "${{ matrix.os }}" "${{ matrix.arch }}" "$dest"
          if [ "$RUNNER_OS" = Windows ]; then echo "MS_LLD=$(cygpath -w "$dest/bin/lld.exe")" >> "$GITHUB_ENV"
          else echo "MS_LLD=$dest/bin/lld" >> "$GITHUB_ENV"; fi
      # Windows programs link against llvm-mingw's CRT and import libraries, and the runtime is built
      # with its clang (scripts/fetch-mingw.sh).
      - name: Fetch llvm-mingw
        if: runner.os == 'Windows'
        run: |
          mingw="$(MINGW_WORK="$RUNNER_TEMP/llvm-mingw" sh scripts/fetch-mingw.sh | tail -n 1)"
          echo "MS_MINGW=$(cygpath -w "$mingw")" >> "$GITHUB_ENV"
          rustup target add "$(rustc -vV | sed -n 's/^host: //p' | sed 's/msvc/gnullvm/')"
      # Runner images often ship the LLVM tools already; install only when they are missing.
      - name: Install LLVM native debug consumers
        run: |
          if command -v llvm-dwarfdump >/dev/null 2>&1 && command -v llvm-symbolizer >/dev/null 2>&1; then
            echo "LLVM debug consumers already installed"
          elif [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y llvm
          elif [ "$RUNNER_OS" = macOS ]; then
            brew install llvm
            echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          elif [ "$RUNNER_OS" = Windows ] && [ '${{ matrix.arch }}' = arm64 ]; then
            echo 'C:/Program Files/LLVM/bin' >> "$GITHUB_PATH"
          fi
      - name: Restore Windows x64 LLVM consumers
        id: llvm-debug
        if: runner.os == 'Windows' && matrix.arch == 'amd64'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/llvm-debug-19.1.7
          key: llvm-debug-windows-x64-19.1.7-b4557b4f
      - name: Install Windows x64 LLVM consumers
        if: runner.os == 'Windows' && matrix.arch == 'amd64'
        run: |
          temp_root=$(cygpath -u "$RUNNER_TEMP")
          tools="$temp_root/llvm-debug-19.1.7"
          if [ ! -x "$tools/llvm-dwarfdump.exe" ] || [ ! -x "$tools/llvm-symbolizer.exe" ]; then
            archive="$temp_root/llvm-debug-19.1.7.tar.xz"
            curl --fail --location --retry 3 'https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/clang%2Bllvm-19.1.7-x86_64-pc-windows-msvc.tar.xz' -o "$archive"
            echo "b4557b4f012161f56a2f5d9e877ab9635cafd7a08f7affe14829bd60c9d357f0  $archive" | sha256sum --check
            mkdir -p "$tools"
            tar -xJf - -C "$tools" --strip-components=2 \
              clang+llvm-19.1.7-x86_64-pc-windows-msvc/bin/llvm-dwarfdump.exe \
              clang+llvm-19.1.7-x86_64-pc-windows-msvc/bin/llvm-symbolizer.exe < "$archive"
          fi
          cygpath -w "$tools" >> "$GITHUB_PATH"
      - name: Save Windows x64 LLVM consumers
        if: github.ref == 'refs/heads/main' && runner.os == 'Windows' && matrix.arch == 'amd64' && steps.llvm-debug.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/llvm-debug-19.1.7
          key: ${{ steps.llvm-debug.outputs.cache-primary-key }}
      - name: Format and clippy
        if: matrix.full
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
      # nextest runs each test in its own process, so tests that share process-global
      # state (the runtime allocator, the environment) cannot interfere.
      # MSVC rejects a test binary whose crates reference msrt_* runtime symbols that only ms-rt
      # defines, even when nothing calls them; ELF and Mach-O drop the unused code first. Crates
      # that ms-rt itself depends on cannot link it back in, so test builds on Windows let the
      # linker leave those references unresolved. Distribution builds never use this flag.
      - name: Tests and doc tests
        if: matrix.full || matrix.tests
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export RUSTFLAGS='-C link-arg=/FORCE:UNRESOLVED'
          fi
          # One build with every target: the later steps (nextest, the CLI, the native tests, the
          # corpus runner) then reuse it instead of rebuilding dependencies with other features.
          cargo build --workspace --all-targets --locked --keep-going
          cargo nextest run --workspace --locked --no-fail-fast
          cargo test --workspace --doc --locked
      - name: MIR signed boundaries and fault semantics
        if: ${{ !(matrix.full || matrix.tests) }}
        run: cargo test --locked -p ms-mir --test opt_overflow -- --nocapture
      - name: Build CLI for native source conformance
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/ms-native-conformance"
          if [ "$RUNNER_OS" = Windows ]; then reports="$(cygpath -u "$RUNNER_TEMP")/ms-native-conformance"; fi
          mkdir -p "$reports"
          printf 'NATIVE_REPORTS=%s\n' "$reports" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$reports/commit.txt"
          rustc -vV > "$reports/host.txt"
          cargo build --locked -p ms-cli 2>&1 | tee "$reports/build.log"
      - name: Native Windows project paths
        if: runner.os == 'Windows'
        run: cargo test --locked -p ms-project --test windows_paths -- --nocapture 2>&1 | tee "$NATIVE_REPORTS/windows-paths.log"
      - name: Release builds use the bundled LLVM tools
        if: runner.os != 'Windows' || matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          # MS_KEEP_LL copies the LLVM IR next to the build, so it exists only when LLVM compiled the program.
          dir="$RUNNER_TEMP/llvm-release"
          mkdir -p "$dir"
          (cd "$dir" && MS_KEEP_LL=1 "$GITHUB_WORKSPACE/target/debug/ms" build "$GITHUB_WORKSPACE/examples/hello/ms.toml" -o hello --build-type Release && test -s ms-keep.ll && ./hello)
      - name: Diagnose LLVM Release image on Windows arm64
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        continue-on-error: true
        run: |
          dir="$RUNNER_TEMP/rsa-diag"
          mkdir -p "$dir"
          ms="$GITHUB_WORKSPACE/target/debug/ms.exe"
          bin="$MS_MINGW/bin"
          src="$dir/rsa.ms"
          cp "$GITHUB_WORKSPACE/tests/e2e/testdata/stdlib/crypto-rsa.ms" "$src"
          printf '\nexport fn main() Int:\n    return 0\n' >> "$src"
          for backend in llvm cranelift; do
            if [ $backend = llvm ]; then export MS_FORCE_LLVM=1; else unset MS_FORCE_LLVM; fi
            (cd "$dir" && "$ms" build "$src" -o "rsa-$backend" --build-type Release 2>&1 | tail -5; ls -l rsa-$backend*; ./rsa-$backend.exe 2>&1 | head -3; echo "exit=$?")
            "$bin/llvm-readobj" --file-headers --coff-imports "$dir/rsa-$backend.exe" 2>&1 | head -60
            "$bin/llvm-objdump" -h "$dir/rsa-$backend.exe" 2>&1 | head -40
          done
      - name: Native standard-library source conformance
        run: |
          set -euo pipefail
          ms=target/debug/ms
          if [ "$RUNNER_OS" = Windows ]; then ms="$ms.exe"; fi
          for build_type in Release Debug; do
            report="$NATIVE_REPORTS/rsa-$build_type.json"
            stderr="$NATIVE_REPORTS/rsa-$build_type.stderr"
            status=0
            "$ms" test tests/e2e/testdata/stdlib/crypto-rsa.ms --build-type "$build_type" --json > "$report" 2> "$stderr" || status=$?
            cat "$report"
            cat "$stderr" >&2
            if [ "$status" -ne 0 ]; then exit "$status"; fi
            json="$report"
            if [ "$RUNNER_OS" = Windows ]; then json="$(cygpath -w "$report")"; fi
            node -e '
              const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              if (!r.completed || r.exit_code !== 0 || r.summary.available !== 4 ||
                  r.summary.selected !== 4 || r.summary.passed !== 4 ||
                  r.summary.failed !== 0 || r.summary.skipped !== 0 ||
                  r.summary.not_run !== 0 || r.tests.length !== 4 ||
                  r.tests.some(t => t.status !== "passed")) process.exit(1);
            ' "$json"
          done
      - name: Native overflow, fault positions, cleanup and inline frames
        if: ${{ !(matrix.full || matrix.tests) }}
        run: |
          cargo test --locked -p ms-clif --test native predicated_overflow -- --nocapture
          cargo test --locked -p ms-clif --test native fault_trace_on_real_runtime -- --nocapture
      - name: Native object and linked source attribution
        if: ${{ !(matrix.full || matrix.tests) }}
        run: |
          llvm-dwarfdump --version
          llvm-symbolizer --version
          cargo test --locked -p ms-clif --test dwarf -- --nocapture
          cargo test --locked -p ms-driver --test debug_artifacts -- --nocapture
          cargo test --locked -p ms-driver --lib -- --nocapture
      - name: Rust ms replays the corpus
        if: matrix.corpus
        run: sh scripts/conform.sh
      - name: Show why a failing test-phase fixture does not run
        if: failure() && matrix.corpus && matrix.os != 'linux'
        run: |
          for f in time fs terminal net http-upload sse-http; do
            echo "::group::ms test e2e/stdlib/$f"
            target/debug/ms test "tests/conformance/fixtures/e2e/stdlib/$f.ms" 2>&1 | head -40 || true
            echo "::endgroup::"
          done
      - name: Package and run the distribution on a hello project
        run: |
          sh scripts/package-rust.sh "${{ matrix.os }}" "${{ matrix.arch }}"
          name="manuscript-rust-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "extracted distribution"
          if [ '${{ matrix.os }}' = windows ]; then
            7z x -bso0 -o"extracted distribution" "dist/$name.zip"
            ms="extracted distribution/$name/ms.exe"
          else
            tar -xzf "dist/$name.tar.gz" -C "extracted distribution"
            ms="extracted distribution/$name/ms"
          fi
          "$ms" --version
          cd "extracted distribution/$name/examples/hello"
          if [ "$RUNNER_OS" != Windows ]; then
            # Linux and macOS link with the bundled lld: nothing on PATH, no C toolchain.
            env -i HOME="$HOME" PATH=/nonexistent "../../$(basename "$ms")" run ms.toml
          else
            "../../$(basename "$ms")" run ms.toml
          fi
      - name: Save cargo cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      # A lockfile change writes a new entry and nothing removes the old one, so old copies pile up
      # until GitHub evicts at the 10 GB limit and takes useful entries with it. Keep the two newest.
      - name: Delete stale Rust caches
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: cargo-rust-${{ matrix.os }}-${{ matrix.arch }}-
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "$KEY" --ref refs/heads/main \
            --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' |
            while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
      - name: Preserve test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            .artifacts/conform.md
            ${{ runner.temp }}/ms-clif-tests-*
            ${{ runner.temp }}/ms-native-conformance/
            ${{ runner.temp }}/ms-dwarf-*
            ${{ runner.temp }}/ms-driver-debug-*
          if-no-files-found: ignore

  # Keep one stable required check; every Rust job must pass before merging.
  rust-ok:
    name: Rust checks
    needs: [changes, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Rust checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          RELEVANT: ${{ needs.changes.outputs.rust }}
        run: |
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*) exit 1 ;;
          esac
          # Skipped is acceptable only when the change detector found nothing Rust-relevant.
          if [ "$RELEVANT" = true ]; then
            case ",$RESULTS," in *,skipped,*) exit 1 ;; esac
          fi

  build:
    name: Build design book
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # The key hashes only Cargo.lock and the toolchain (rust-cache also hashes every manifest, so it
      # writes a new entry whenever one changes). One entry per name and lockfile, saved on main.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-rust-docs-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-rust-docs-
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # book-check below runs docs-check and the highlighting test.
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.146.7'
          extended: true
      - name: Validate project URL prefixes and production output
        run: |
          make book-check
          make book
          node --test tests/docs/publication.test.cjs
      - name: Save cargo cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/book

  pages:
    name: Publish Pages docs
    needs: [build, language]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deploy
