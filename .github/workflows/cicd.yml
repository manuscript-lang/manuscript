name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  language:
    name: Language checks
    uses: ./.github/workflows/test-language.yml

  # Docs-only changes skip the Rust jobs.
  changes:
    name: Detect Rust-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          rust=true
          if [ "$EVENT" = pull_request ]; then
            if ! git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^(documentation/|website/|blog/|proposals/|skills/|extensions/|.*\.md$)'; then
              rust=false
            fi
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  # Format and lint once; clippy also type-checks every target for the test jobs.
  rust-lint:
    name: Rust format and clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # nextest runs each test in its own process, so tests that share process-global
  # state (the runtime allocator, the environment) cannot interfere.
  rust-test:
    name: Rust tests (partition ${{ matrix.partition }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace --partition hash:${{ matrix.partition }}/2
      - name: Doc tests
        if: matrix.partition == 1
        run: cargo test --workspace --doc

  # The frozen conformance corpus replayed against the Rust `ms`; known differences are
  # listed in tests/conformance/rust-expect-fail.txt.
  rust-conform:
    name: Rust corpus (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-conform
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust ms replays the corpus
        run: make conform-rust CONFORM_SHARD=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: conform-rust-${{ matrix.shard }}
          path: .artifacts/conform-rust.md

  rust-native:
    name: Native codegen
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/codegen-platforms.yml

  # Keep one stable required check; every Rust job must pass before merging.
  rust-ok:
    name: Rust checks
    needs: [changes, rust-lint, rust-test, rust-conform, rust-native]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Rust checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          RELEVANT: ${{ needs.changes.outputs.rust }}
        run: |
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*) exit 1 ;;
          esac
          # Skipped is acceptable only when the change detector found nothing Rust-relevant.
          if [ "$RELEVANT" = true ]; then
            case ",$RESULTS," in *,skipped,*) exit 1 ;; esac
          fi

  build:
    name: Build design book
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/cache@v6
        with:
          path: toolchain/
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version', 'scripts/toolchains.sha256') }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Prepare pinned SDK
        run: make toolchain
      # book-check below runs docs-check and the highlighting test.
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.146.7'
          extended: true
      - name: Validate project URL prefixes and production output
        run: |
          make book-check
          make book
          node --test tests/docs/publication.test.cjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/book

  pages:
    name: Publish Pages docs
    needs: [build, language]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deploy
