name: CI/CD

# One workflow, four triggers:
#   pull request  the Linux legs; a pull request that touches
#                 LLVM-related code (see .github/actions/rust-scope) also starts the `llvm` jobs: the LLVM corpus (amd64) and the LLVM backend tests with the release gates. The Linux legs, each one job (`ab`: the tests and the conformance corpus together); the language checks
#                 and the book run beside them in `linux-checks`. A green pull request auto-merges; there
#                 is no merge queue, which built every stacked ref with the full matrix and restarted on
#                 every outside merge.
#   merge queue   the same as a pull request, in case a queue is configured again.
#   main          every 30 minutes (cron at :07 and :37), when main has a commit that no earlier scheduled run
#                 checked: all six platforms, each split into `tests` and `conformance` (twelve jobs, see
#                 .github/actions/rust-checks); linux-arm64 also builds the book for Pages and the tests
#                 jobs save the sccache caches. A failure is fixed or reverted.
#   manual run    the same as a main run; its `os` input runs one platform.
# Require `Platform checks`.

on:
  pull_request:
  schedule:
    # Pushes to main no longer start a run: twelve runners per push took too many slots. Minutes 7 and 37,
    # not 0 and 30: GitHub delays and drops scheduled runs at the start of the hour and half hour.
    - cron: '7,37 * * * *'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      os:
        description: Platforms for the Rust jobs
        type: choice
        options: [all, linux, darwin, windows]
        default: all

permissions:
  contents: read

env:
  # sccache stores each compiler output, so the saved cache stays small and bounded
  # (`target/` grew to several GB) and a changed crate rebuilds only itself.
  RUSTC_WRAPPER: sccache
  # Six legs share the repository's 10 GB Actions cache. At 2G each, Linux and Windows filled the cap
  # (macOS used about 1 GB), the total passed 10 GB, and GitHub evicted the least recently used
  # entries: the macOS and Windows caches, which only main reads. 1.5G keeps all six with room
  # for the LLVM tool caches; sccache drops its least recently used outputs past the cap.
  SCCACHE_CACHE_SIZE: 1500M
  # Debug info makes the dev and test builds slower to link and the saved caches several times
  # larger; nothing in CI reads the compiler's own debug info. Release keeps the profile setting.
  CARGO_PROFILE_DEV_DEBUG: '0'
  # Incremental artifacts are large and never reused on a fresh runner.
  CARGO_INCREMENTAL: '0'

concurrency:
  # A new commit cancels the earlier run of the same pull request. Main runs are not cancelled: with pull
  # requests merging every few minutes, cancelling meant no main run finished. The running one completes and
  # only the newest push waits (GitHub replaces a pending run with a newer one), so middle commits are skipped.
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'schedule' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # A scheduled run does nothing when the last scheduled run of main already checked this commit
  # (whatever its result: a red main waits for a fix). Manual runs may cover only one OS, so they
  # never replace the scheduled six-platform run. Every other trigger always runs.
  due:
    name: Main changed
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.due.outputs.run }}
      llvm: ${{ steps.scope.outputs.llvm || 'false' }}
      rust: ${{ steps.scope.outputs.rust || 'true' }}
      c: ${{ steps.scope.outputs.c || 'false' }}
    steps:
      # A pull request says here whether it touches LLVM-related code, so the `llvm` jobs below do not start
      # (and take no runner slot) on one that does not.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.sha }}
      - id: scope
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/rust-scope
      - id: due
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = schedule ]; then
            seen=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cicd.yml --branch main --event schedule --limit 40 \
              --json databaseId,headSha,event,status,conclusion \
              --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .event == \"schedule\" and .conclusion != \"cancelled\" and .conclusion != \"skipped\")][0].headSha")
            if [ "$seen" = "$GITHUB_SHA" ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # One job per platform leg and part. Pull requests run the Linux legs; a manual run's `os` input picks
  # one platform; a scheduled run covers all six. The matrix is picked in an expression because a job `if`
  # cannot read it, and a separate job to pick it would cost one more job per run.
  # `lint`: also format and clippy. `second_pass`: the part (`a` or `b`) that also runs the second
  # corpus pass (run and test again at Debug); the gates run in the other part.
  # `gates: false` skips the gates. On pull requests linux-amd64 runs the second pass in `conformance` and
  # leaves the gates to linux-arm64, so each job stays under ten minutes. On pull requests linux-arm64 runs
  # format and clippy: it finishes about 4 minutes before linux-amd64, which carries the corpus.
  # `docs`: also the language checks and the book (main and manual runs; a pull request runs them in
  # `linux-checks`); on main the book is uploaded for Pages.
  # Failures shared with Linux are in tests/conformance/expect-fail.txt; platform-only ones go
  # in tests/conformance/expect-fail.<os>.txt with a reason.
  rust:
    needs: due
    # A pull request that changes only documentation or the C compiler takes no runner for the Rust jobs.
    if: needs.due.outputs.run == 'true' && needs.due.outputs.rust == 'true'
    name: ${{ matrix.leg.os }}-${{ matrix.leg.arch }}${{ matrix.part == 'a' && ' · tests' || matrix.part == 'b' && ' · conformance' || '' }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Main and manual runs split every leg into `tests` (a) and `conformance` (b) on two runners for wall
        # time. Pull requests run each Linux leg as one job (`ab`): the two halves repeat the setup and the
        # build, so one runner does the same work in less total time and uses half the runners.
        part: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["ab"]' || '["a", "b"]') }}
        leg: >-
          ${{ fromJSON(
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '[{"os": "linux", "arch": "amd64", "runner": "ubuntu-24.04", "second_pass": "b", "gates": "false"}, {"os": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm", "lint": true, "gates_part": "a"}]' ||
          inputs.os == 'linux' && '[{"os": "linux", "arch": "amd64", "runner": "ubuntu-24.04", "lint": true, "second_pass": "b"}, {"os": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm", "docs": true, "gates_part": "a"}]' ||
          inputs.os == 'darwin' && '[{"os": "darwin", "arch": "amd64", "runner": "macos-15-intel"}, {"os": "darwin", "arch": "arm64", "runner": "macos-15", "second_pass": "a"}]' ||
          inputs.os == 'windows' && '[{"os": "windows", "arch": "amd64", "runner": "windows-2025", "second_pass": "b"}, {"os": "windows", "arch": "arm64", "runner": "windows-11-arm"}]' ||
          '[{"os": "linux", "arch": "amd64", "runner": "ubuntu-24.04", "lint": true, "second_pass": "b"}, {"os": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm", "docs": true, "gates_part": "a"}, {"os": "darwin", "arch": "amd64", "runner": "macos-15-intel"}, {"os": "darwin", "arch": "arm64", "runner": "macos-15", "second_pass": "a"}, {"os": "windows", "arch": "amd64", "runner": "windows-2025", "second_pass": "b"}, {"os": "windows", "arch": "arm64", "runner": "windows-11-arm"}]'
          ) }}
    env:
      PR: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # Documentation-only pull requests skip the Rust steps.
      - id: scope
        uses: ./.github/actions/rust-scope
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          # One cache per leg, saved by main's single job and restored by both pull request parts.
          prefix: cargo-sccache-${{ matrix.leg.os }}-${{ matrix.leg.arch }}-
      - uses: ./.github/actions/rust-env
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
          llvm-consumers: ${{ matrix.part != 'b' && 'true' || 'false' }}
      - uses: ./.github/actions/language-checks
        if: matrix.leg.docs && matrix.part != 'a'
      - uses: ./.github/actions/book-checks
        if: matrix.leg.docs && matrix.part != 'a'
      # Older releases keep their own book: each version listed in website/data/docs_versions.toml
      # has a manuscript-docs archive on its release (built by release.yml), unpacked here.
      - name: Add the archived books of older releases
        if: matrix.leg.docs && matrix.part == 'b' && env.PR != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for version in $(sed -n 's/^version = "\(.*\)"$/\1/p' website/data/docs_versions.toml); do
            mkdir -p ".artifacts/book/versions/v${version}"
            gh release download "v${version}" --repo "$GITHUB_REPOSITORY" --pattern "manuscript-docs-${version}.tar.gz" --output - | tar -xz -C ".artifacts/book/versions/v${version}"
          done
      - uses: actions/upload-pages-artifact@v5
        if: matrix.leg.docs && matrix.part == 'b' && env.PR != 'true'
        with:
          path: .artifacts/book
      - uses: ./.github/actions/rust-checks
        if: steps.scope.outputs.rust == 'true'
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
          part: ${{ matrix.part }}
          lint: ${{ matrix.leg.lint || false }}
          second-pass: ${{ matrix.leg.second_pass || '' }}
          gates: ${{ matrix.leg.gates || 'true' }}
          gates-part: ${{ matrix.leg.gates_part || '' }}
          # A pull request that touches LLVM code runs the LLVM suite in the `llvm` jobs, not here.
          llvm: ${{ env.PR == 'true' && 'false' || steps.scope.outputs.llvm }}
          docs: ${{ steps.scope.outputs.docs }}
      - uses: ./.github/actions/sccache-save
        # Part a builds the whole workspace, a superset of part b, so one save per leg keeps the cache count at six.
        if: ${{ !cancelled() && matrix.part == 'a' }}
        with:
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          primary-key: ${{ steps.sccache.outputs.primary-key }}

  # The language checks (repository rules, licenses, the C style gate, the VS Code package) and the book run beside
  # the two Linux legs on a pull request, not inside one: they were 7 of linux-arm64's 15 minutes. They share the
  # arm64 sccache entry, so the Rust build they need is cached. Main and manual runs keep them in `rust` (the book
  # is uploaded for Pages there).
  checks:
    needs: due
    if: needs.due.outputs.run == 'true' && needs.due.outputs.rust == 'true' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    name: linux-checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-linux-arm64-
      - uses: ./.github/actions/rust-env
        with:
          os: linux
          arch: arm64
          llvm-consumers: 'false'
      - uses: ./.github/actions/language-checks
      - uses: ./.github/actions/book-checks

  # A pull request that touches LLVM-related code (rust-scope) also runs the LLVM suite, in jobs of its own so
  # that no job passes ten minutes: the LLVM corpus (amd64) and the LLVM backend tests with the release
  # gates. Only a pull request that touches LLVM-related code starts them (`due` decides from the scope). Main
  # runs the suite inside `rust`.
  llvm:
    needs: due
    if: needs.due.outputs.run == 'true' && github.event_name == 'pull_request' && needs.due.outputs.llvm == 'true'
    name: llvm-${{ matrix.leg.arch }}-${{ matrix.leg.job }}${{ matrix.leg.shard && format('-{0}', matrix.leg.index) || '' }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg:
          - {job: corpus, arch: amd64, runner: ubuntu-24.04}
          - {job: gates, arch: arm64, runner: ubuntu-24.04-arm}
    env:
      PR: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-linux-${{ matrix.leg.arch }}-
      - uses: ./.github/actions/rust-env
        with:
          os: linux
          arch: ${{ matrix.leg.arch }}
          llvm-consumers: ${{ matrix.leg.job == 'gates' && 'true' || 'false' }}
      - uses: ./.github/actions/rust-checks
        with:
          os: linux
          arch: ${{ matrix.leg.arch }}
          part: ab
          llvm-job: ${{ matrix.leg.job }}
          shard: ${{ matrix.leg.shard }}
          suffix: -llvm-${{ matrix.leg.job }}${{ matrix.leg.index }}

  # C checks, in jobs of their own so the Rust jobs stay under ten minutes: only a pull request that touches the C
  # runtime or compiler (`due` decides from the scope) starts them. `runtime`: the unit tests under AddressSanitizer
  # and UBSan. `compiler`: the C front end against the Rust one, and the C driver. Main and the nightly run the rest.
  c:
    needs: due
    if: needs.due.outputs.run == 'true' && github.event_name == 'pull_request' && needs.due.outputs.c == 'true'
    name: c-${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [runtime, compiler]
    env:
      PR: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # The reactor test links libuv, the std tests PCRE2 and OpenSSL: the same system packages the runtime folds in.
      - name: Install the C libraries
        if: matrix.check == 'runtime'
        run: sh src/runtime/third_party/libs.sh install
      # ccache (the C build's compiler launcher) keeps the objects between runs; a pull request restores the newest entry.
      - name: Install ccache
        if: matrix.check == 'compiler'
        run: sudo apt-get install -y --no-install-recommends ccache
      - name: Restore the ccache directory
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-c-${{ matrix.check }}-${{ hashFiles('src/runtime/**', 'src/compiler/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: ccache-c-${{ matrix.check }}-
      - name: Runtime unit tests
        if: matrix.check == 'runtime'
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 100M
        run: make c-test
      # The compiler checks run the Rust `ms` (the reference the C front end is compared with).
      - id: sccache
        if: matrix.check == 'compiler'
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-linux-amd64-
      - uses: ./.github/actions/rust-env
        if: matrix.check == 'compiler'
        with:
          os: linux
          arch: amd64
      - name: C compiler tests
        if: matrix.check == 'compiler'
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: 100M
        run: make c-compiler-test c-driver-test

  # The pull request time budget (AGENTS.md, wiki/repository/pull-request-ci-has-a-ten-minute-budget.md): each
  # Linux job of a pull request finishes in under 10 minutes. `Platform checks` requires it, so an over-budget
  # pull request cannot merge.
  budget:
    name: Time budget
    needs: [rust, checks, llvm, c]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.rust.result == 'success' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') && (needs.llvm.result == 'success' || needs.llvm.result == 'skipped') && (needs.c.result == 'success' || needs.c.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      BUDGET_SECONDS: '600'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Every Linux job is within the budget
        run: |
          over=0
          while read -r name seconds; do
            echo "$name: ${seconds}s of ${BUDGET_SECONDS}s"
            if [ "$seconds" -gt "$BUDGET_SECONDS" ]; then over=1; fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name | startswith("linux-") or startswith("llvm-") or startswith("c-")) | "\(.name | gsub(" "; "_")) \((.completed_at | fromdate) - (.started_at | fromdate))"')
          if [ "$over" = 1 ]; then
            echo "::error::A pull request job is over the ${BUDGET_SECONDS}s budget: cut a test or a step (see AGENTS.md)."
            exit 1
          fi

  # The sum of the jobs above, one name for a ruleset to require.
  platforms:
    name: Platform checks
    if: always()
    needs: [due, rust, checks, llvm, c, budget]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Require every platform leg
        env:
          RESULT: ${{ needs.rust.result }}
          LLVM_RESULT: ${{ needs.llvm.result }}
          BUDGET: ${{ needs.budget.result }}
          C_RESULT: ${{ needs.c.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          DUE: ${{ needs.due.outputs.run }}
          RUST: ${{ needs.due.outputs.rust }}
        run: |
          # The budget job runs on pull requests only; it is skipped elsewhere or when a leg already failed.
          test "$BUDGET" != failure || exit 1
          test "$LLVM_RESULT" != failure || exit 1
          test "$LLVM_RESULT" != cancelled || exit 1
          test "$C_RESULT" != failure || exit 1
          test "$C_RESULT" != cancelled || exit 1
          test "$CHECKS_RESULT" != failure || exit 1
          test "$CHECKS_RESULT" != cancelled || exit 1
          # The Rust jobs are skipped on a pull request that changes only documentation or the C compiler.
          test "$RESULT" = success || test "$DUE" = false || test "$RUST" = false
      # A red scheduled run on main is reported once: one open issue names the failing legs and tests and the pull
      # requests merged since the last green scheduled run; later red runs comment on it, a green run closes it.
      - name: Report the scheduled main run
        if: ${{ always() && github.event_name == 'schedule' && needs.due.outputs.run == 'true' && needs.rust.result != 'cancelled' && needs.rust.result != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.rust.result }}
          LLVM_RESULT: ${{ needs.llvm.result }}
        run: |
          repo="$GITHUB_REPOSITORY"
          run_url="$GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID"
          open=$(gh issue list --repo "$repo" --state open --search '"Main is red" in:title' --json number,title \
            --jq '[.[] | select(.title | startswith("Main is red"))][0].number // empty')
          if [ "$RESULT" = success ] && [ "$LLVM_RESULT" != failure ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$repo" --comment "Green again: $run_url ($GITHUB_SHA)."
            fi
            exit 0
          fi
          last_green=$(gh api "repos/$repo/actions/workflows/cicd.yml/runs?event=schedule&status=success&branch=main&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [ -n "$last_green" ]; then
            range="$last_green...$GITHUB_SHA"
            merged=$(gh api "repos/$repo/compare/$range" --jq '.commits[] | "- \(.sha[0:9]) \(.commit.message | split("\n")[0])"')
          else
            range="(no earlier green scheduled run)"
            merged="- $GITHUB_SHA"
          fi
          legs=""
          while IFS=$'\t' read -r id name; do
            tests=$(gh api "repos/$repo/actions/jobs/$id/logs" 2>/dev/null \
              | grep -oE 'Z +FAIL .*' | sed -E 's/^Z +//' | sort -u | head -20 || true)
            legs="$legs"$'\n'"- $name ($GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID/job/$id)"
            if [ -n "$tests" ]; then legs="$legs"$'\n'"$(printf '%s\n' "$tests" | sed 's/^/    - /')"; fi
          done < <(gh api "repos/$repo/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" and .name != "Platform checks") | "\(.id)\t\(.name)"')
          body=$(printf 'Scheduled run: %s\nCommit range since the last green scheduled run: %s\n\nFailing legs and tests:%s\n\nMerged since the last green run:\n%s\n' \
            "$run_url" "$range" "$legs" "$merged")
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$repo" --body "$body"
          else
            gh issue create --repo "$repo" --title "Main is red" --body "$body"
          fi

  pages:
    name: Publish Pages docs
    needs: [due, rust]
    # Only all-platform and Linux runs build the book; deploy it even if another platform failed.
    if: ${{ !cancelled() && needs.due.outputs.run == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.os == 'all' || inputs.os == 'linux'))) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deploy
