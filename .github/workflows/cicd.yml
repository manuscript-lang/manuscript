name: CI/CD

on:
  # Every push to main runs the darwin and windows legs (Linux ran on the pull request and runs in the
  # hourly manual run). Only manual runs on main save the sccache
  # caches, because push runs are often replaced before they finish. cache-maintenance.yml starts a
  # manual run every hour.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Debug info makes the dev and test builds slower to link and the saved caches several times
  # larger; nothing in CI reads the compiler's own debug info. Release keeps the profile setting.
  CARGO_PROFILE_DEV_DEBUG: '0'
  # Incremental artifacts are large and never reused on a fresh runner.
  CARGO_INCREMENTAL: '0'

concurrency:
  # A new pull request commit or push to main cancels the earlier run of the same ref. Manual runs
  # never cancel or replace each other.
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  language:
    name: Language checks
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/test-language.yml

  # Builds the matrix for pushes and manual runs. A pull request has no such job: its
  # two Linux jobs hold the matrix and skip their own Rust steps for documentation-only changes.
  changes:
    name: Detect code changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Manual runs cover all six platforms. A push to main runs the four darwin
          # and windows legs only: every pull request already ran both Linux architectures, and the
          # hourly manual run covers Linux on main. Pull requests run
          # two Linux jobs written in the `rust` matrix; run the workflow by hand on a branch to test a
          # platform-specific change before merging.
          echo "rust=true" >> "$GITHUB_OUTPUT"
          include='{"os":"linux","arch":"amd64","runner":"ubuntu-24.04","full":true,"corpus":true,"cranelift":true},
            {"os":"linux","arch":"arm64","runner":"ubuntu-24.04-arm","tests":true,"corpus":true},
            {"os":"darwin","arch":"amd64","runner":"macos-15-intel","tests":true,"corpus":true},
            {"os":"darwin","arch":"arm64","runner":"macos-15","tests":true,"corpus":true,"cranelift":true},
            {"os":"windows","arch":"amd64","runner":"windows-2025","tests":true,"corpus":true,"cranelift":true},
            {"os":"windows","arch":"arm64","runner":"windows-11-arm","tests":true,"corpus":true}'
          # Each platform runs as two parts on separate runners (twelve Rust jobs; the account allows
          # 20 at once). A pull request runs both parts in one job per Linux architecture (part `ab`,
          # in the `rust` matrix). Part `a` runs `unit`
          # (format, clippy, nextest, doc tests) and the Cranelift corpus and fixtures; part `b` runs the
          # LLVM corpus and fixtures and the `misc` gates (release build, source conformance, ownership
          # counts, packaging). Legs without Cranelift move `misc` into part `a` to balance the two.
          # `cache_part` names the sccache entry a job restores; `ab` jobs share part `a`'s, which holds
          # the workspace build that part `b` reuses.
          matrix=$(echo "{\"include\":[$include]}" | jq -c --arg event "$EVENT" '{include: [.include[]
            | select($event != "push" or .os != "linux") | . as $leg
            | ["a","b"][] as $part
            | $leg + {part: $part, cache_part: $part,
                      part_name: (if $part == "a" then "tests" else "conformance" end),
                      misc_part: (if $leg.cranelift then "b" else "a" end)}]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Each platform runs as four or five parts in parallel (see the matrix step in `changes`), so the
  # slowest part, not the sum of all of them, sets the wall time. Tests also parallelize inside a
  # part: nextest and the corpus runner both use every core.
  rust:
    name: ${{ matrix.os }}-${{ matrix.arch }} · ${{ matrix.part_name }}
    needs: changes
    # A pull request runs two jobs in all, one per Linux architecture, and each decides itself
    # whether the change touches Rust; `changes` runs only for the other events.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.changes.outputs.rust == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # `full`: format, clippy, every crate's tests and doc tests. `tests`: the same tests and doc
        # tests without format and clippy. `corpus`: the frozen conformance corpus against the Rust
        # ms on this platform. `cranelift`: the same corpus and e2e fixtures with
        # `MS_BACKEND=cranelift`, so release builds use the Cranelift backend that Debug builds use.
        # Failures shared with Linux are in tests/conformance/expect-fail.txt;
        # platform-only ones go in tests/conformance/expect-fail.<os>.txt with a reason. The legs
        # come from the `changes` job; pull requests use the two Linux legs written here, with `docs`
        # marking the one that also runs the language and book checks.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"os":"linux","arch":"amd64","runner":"ubuntu-24.04","full":true,"corpus":true,"cranelift":true,"docs":true,"part":"ab","cache_part":"a","part_name":"checks","misc_part":"b"},{"os":"linux","arch":"arm64","runner":"ubuntu-24.04-arm","tests":true,"corpus":true,"part":"ab","cache_part":"a","part_name":"checks","misc_part":"a"}]}' || needs.changes.outputs.matrix).include }}
    defaults:
      run:
        shell: bash
    env:
      # sccache stores each compiler output, so the saved cache stays small and bounded
      # (`target/` grew to several GB) and a changed crate rebuilds only itself.
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # Documentation-only pull requests skip every Rust step below; the language and book checks
      # still run. SKIP is read by each step's `if`.
      - name: Detect Rust-relevant changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          if ! git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^(documentation/|website/|blog/|proposals/|skills/|extensions/|.*\.md$)'; then
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi
      - id: sccache
        if: env.SKIP != 'true' || matrix.docs
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.cache_part }}-
      - name: Keep native test artifacts in runner storage
        if: env.SKIP != 'true'
        run: |
          printf '%s\n' "TMPDIR=$RUNNER_TEMP" "TMP=$RUNNER_TEMP" "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        if: env.SKIP != 'true' && (contains(matrix.part, 'a') && (matrix.full || matrix.tests))
        with:
          tool: nextest
      - uses: ./.github/actions/rust-env
        if: env.SKIP != 'true' || matrix.docs
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          llvm-consumers: ${{ contains(matrix.part, 'a') && env.SKIP != 'true' && 'true' || 'false' }}
      # Pull requests run these in the amd64 job, so they take no slot of their own.
      - uses: ./.github/actions/language-checks
        if: matrix.docs
      - uses: ./.github/actions/book-checks
        if: matrix.docs
      - name: Build the native runtime
        if: env.SKIP != 'true'
        run: cargo xtask runtime
      - name: Format and clippy
        if: env.SKIP != 'true' && (contains(matrix.part, 'a') && matrix.full)
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
      # nextest runs each test in its own process, so tests that share process-global
      # state (the runtime allocator, the environment) cannot interfere.
      # MSVC rejects a test binary whose crates reference msrt_* runtime symbols that only ms-rt
      # defines, even when nothing calls them; ELF and Mach-O drop the unused code first. Crates
      # that ms-rt itself depends on cannot link it back in, so test builds on Windows let the
      # linker leave those references unresolved. Distribution builds never use this flag.
      - name: Tests and doc tests
        if: env.SKIP != 'true' && (contains(matrix.part, 'a') && (matrix.full || matrix.tests))
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export RUSTFLAGS='-C link-arg=/FORCE:UNRESOLVED'
          fi
          # One build with every target: the later steps (nextest, the CLI, the native tests, the
          # corpus runner) then reuse it instead of rebuilding dependencies with other features.
          cargo build --workspace --all-targets --locked --keep-going
          cargo nextest run --workspace --locked --no-fail-fast
          cargo test --workspace --doc --locked
      - name: Build CLI for native source conformance
        if: env.SKIP != 'true'
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/ms-native-conformance"
          if [ "$RUNNER_OS" = Windows ]; then reports="$(cygpath -u "$RUNNER_TEMP")/ms-native-conformance"; fi
          mkdir -p "$reports"
          printf 'NATIVE_REPORTS=%s\n' "$reports" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$reports/commit.txt"
          rustc -vV > "$reports/host.txt"
          # `-p ms-cli` unifies features differently from the workspace build and recompiles the
          # cranelift crates, ms-clif, ms-build and ms-cli (about 40 s). Parts that ran the workspace
          # build above reuse it: the same command is a no-op and relinks target/debug/ms. Windows
          # keeps the separate build: its test build links with /FORCE:UNRESOLVED, which a shipped
          # `ms` must not use.
          if [ '${{ contains(matrix.part, 'a') }}' = true ] && [ '${{ matrix.full || matrix.tests }}' = true ] && [ "$RUNNER_OS" != Windows ]; then
            cargo build --workspace --all-targets --locked 2>&1 | tee "$reports/build.log"
          else
            cargo build --locked -p ms-cli 2>&1 | tee "$reports/build.log"
          fi
      - name: Native Windows project paths
        if: env.SKIP != 'true' && (contains(matrix.part, 'a') && runner.os == 'Windows')
        run: cargo test --locked -p ms-driver --test project_windows_paths -- --nocapture 2>&1 | tee "$NATIVE_REPORTS/windows-paths.log"
      - name: Release builds use the bundled LLVM tools
        if: env.SKIP != 'true' && (contains(matrix.part, matrix.misc_part))
        run: |
          set -euo pipefail
          # MS_KEEP_LL copies the LLVM IR next to the build, so it exists only when LLVM compiled the program.
          dir="$RUNNER_TEMP/llvm-release"
          mkdir -p "$dir"
          (cd "$dir" && MS_KEEP_LL=1 "$GITHUB_WORKSPACE/target/debug/ms" build "$GITHUB_WORKSPACE/examples/hello/ms.toml" -o hello --build-type Release && test -s ms-keep.ll && ./hello)
      - name: Native standard-library source conformance
        if: env.SKIP != 'true' && (contains(matrix.part, matrix.misc_part))
        run: |
          set -euo pipefail
          ms=target/debug/ms
          if [ "$RUNNER_OS" = Windows ]; then ms="$ms.exe"; fi
          for build_type in Release Debug; do
            report="$NATIVE_REPORTS/rsa-$build_type.json"
            stderr="$NATIVE_REPORTS/rsa-$build_type.stderr"
            status=0
            "$ms" test tests/e2e/testdata/stdlib/crypto-rsa.ms --build-type "$build_type" --json > "$report" 2> "$stderr" || status=$?
            cat "$report"
            cat "$stderr" >&2
            if [ "$status" -ne 0 ]; then exit "$status"; fi
            json="$report"
            if [ "$RUNNER_OS" = Windows ]; then json="$(cygpath -w "$report")"; fi
            node -e '
              const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              if (!r.completed || r.exit_code !== 0 || r.summary.available !== 4 ||
                  r.summary.selected !== 4 || r.summary.passed !== 4 ||
                  r.summary.failed !== 0 || r.summary.skipped !== 0 ||
                  r.summary.not_run !== 0 || r.tests.length !== 4 ||
                  r.tests.some(t => t.status !== "passed")) process.exit(1);
            ' "$json"
          done
      - name: Conformance corpus (LLVM)
        if: env.SKIP != 'true' && (contains(matrix.part, 'b') && matrix.corpus)
        run: target/debug/ms run tools/conform.ms
      - name: End-to-end fixtures (LLVM)
        if: env.SKIP != 'true' && (contains(matrix.part, 'b') && matrix.corpus)
        run: target/debug/ms run tools/e2e.ms
      - name: Conformance corpus (Cranelift)
        if: env.SKIP != 'true' && (contains(matrix.part, 'a') && matrix.cranelift)
        env:
          MS_BACKEND: cranelift
        run: target/debug/ms run tools/conform.ms
      - name: End-to-end fixtures (Cranelift)
        if: env.SKIP != 'true' && (contains(matrix.part, 'a') && matrix.cranelift)
        env:
          MS_BACKEND: cranelift
        run: target/debug/ms run tools/e2e.ms
      - name: Cancelled tasks release what they own
        if: env.SKIP != 'true' && (contains(matrix.part, matrix.misc_part) && matrix.corpus)
        run: |
          MS=target/debug/ms target/debug/ms run tools/leak-check.ms -- tests/conformance/fixtures/e2e/stdlib/tasks-cancel-release.ms \
            tests/conformance/fixtures/e2e/stdlib/tasks-cancel-release-shapes.ms \
            tests/conformance/fixtures/e2e/stdlib/tasks-cancel-release-vars.ms \
            tests/conformance/fixtures/e2e/stdlib/tasks-cancel-channel-wait-memory.ms
      - name: Ownership counts and cleanup order hold
        if: env.SKIP != 'true' && (contains(matrix.part, matrix.misc_part) && matrix.corpus)
        run: MS=target/debug/ms target/debug/ms run tools/count-check.ms
      - name: Package and run the distribution on a hello project
        if: env.SKIP != 'true' && (contains(matrix.part, matrix.misc_part))
        run: |
          target/debug/ms run tools/package.ms -- "${{ matrix.os }}" "${{ matrix.arch }}"
          name="manuscript-rust-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "extracted distribution"
          if [ '${{ matrix.os }}' = windows ]; then
            7z x -bso0 -o"extracted distribution" "dist/$name.zip"
            ms="extracted distribution/$name/ms.exe"
          else
            tar -xzf "dist/$name.tar.gz" -C "extracted distribution"
            ms="extracted distribution/$name/ms"
          fi
          "$ms" --version
          cd "extracted distribution/$name/examples/hello"
          if [ "$RUNNER_OS" != Windows ]; then
            # Linux and macOS link with the bundled lld: nothing on PATH, no C toolchain.
            env -i HOME="$HOME" PATH=/nonexistent "../../$(basename "$ms")" run ms.toml
          else
            "../../$(basename "$ms")" run ms.toml
          fi
      - name: Programs run on glibc 2.28
        if: env.SKIP != 'true' && (contains(matrix.part, matrix.misc_part) && matrix.os == 'linux')
        run: |
          target/debug/ms build tests/glibc-floor/floor.ms -o floor
          # The link-time stubs bind nothing newer than glibc 2.28 (weak references aside).
          if objdump -T floor | grep -v '^[0-9a-f]* *w ' | grep -E 'GLIBC_2\.(29|3[0-9])'; then
            echo "floor binds a glibc symbol newer than 2.28" >&2
            exit 1
          fi
          # AlmaLinux 8 ships glibc 2.28, the oldest that Linux programs support.
          got=$(docker run --rm -v "$PWD:/w" -w /w almalinux:8 ./floor)
          test "$got" = "144 true true true true 1030"
      - name: sccache statistics
        if: always() && env.SKIP != 'true'
        run: sccache --show-stats
      - uses: ./.github/actions/sccache-save
        if: ${{ !cancelled() && (env.SKIP != 'true' || matrix.docs) }}
        with:
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          primary-key: ${{ steps.sccache.outputs.primary-key }}
      - name: Preserve test artifacts
        if: always() && env.SKIP != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rust-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.part }}
          path: |
            .artifacts/conform.md
            ${{ runner.temp }}/ms-clif-tests-*
            ${{ runner.temp }}/ms-native-conformance/
            ${{ runner.temp }}/ms-dwarf-*
            ${{ runner.temp }}/ms-build-debug-*
          if-no-files-found: ignore


  # Keep one stable required check; every Rust job must pass before merging.
  rust-ok:
    name: Rust checks
    needs: [changes, rust]
    if: github.event_name != 'pull_request' && always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Rust checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          RELEVANT: ${{ needs.changes.outputs.rust }}
        run: |
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*) exit 1 ;;
          esac
          # Skipped is acceptable only when the change detector found nothing Rust-relevant.
          if [ "$RELEVANT" = true ]; then
            case ",$RESULTS," in *,skipped,*) exit 1 ;; esac
          fi

  build:
    name: Build design book
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 1G
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-docs-
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # book-check below runs docs-check and the highlighting test.
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.146.7'
          extended: true
      - name: Validate project URL prefixes and production output
        run: |
          make book-check
          make book
          node --test tests/docs/publication.test.cjs
      - uses: ./.github/actions/sccache-save
        if: ${{ !cancelled() }}
        with:
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          primary-key: ${{ steps.sccache.outputs.primary-key }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/book

  pages:
    name: Publish Pages docs
    needs: [build, language]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deploy
