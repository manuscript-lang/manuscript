name: CI/CD

# One workflow, four triggers:
#   pull request  the Linux legs, each split into `tests` and `conformance` (four jobs); the language checks
#                 and the book run inside linux-arm64 conformance. A green pull request auto-merges; there
#                 is no merge queue, which built every stacked ref with the full matrix and restarted on
#                 every outside merge.
#   merge queue   the same as a pull request, in case a queue is configured again.
#   push to main  all six platforms, one job each running both parts (see .github/actions/rust-checks),
#                 so main holds six runners; linux-arm64 also builds the book for Pages and the jobs save
#                 the sccache caches. The running main run finishes; only the newest push waits. A failure is fixed or reverted.
#   manual run    the same as a push; its `os` input runs one platform.
# Require `Platform checks`.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      os:
        description: Platforms for the Rust jobs
        type: choice
        options: [all, linux, darwin, windows]
        default: all

permissions:
  contents: read

env:
  # sccache stores each compiler output, so the saved cache stays small and bounded
  # (`target/` grew to several GB) and a changed crate rebuilds only itself.
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 2G
  # Debug info makes the dev and test builds slower to link and the saved caches several times
  # larger; nothing in CI reads the compiler's own debug info. Release keeps the profile setting.
  CARGO_PROFILE_DEV_DEBUG: '0'
  # Incremental artifacts are large and never reused on a fresh runner.
  CARGO_INCREMENTAL: '0'

concurrency:
  # A new commit cancels the earlier run of the same pull request. Main runs are not cancelled: with pull
  # requests merging every few minutes, cancelling meant no main run finished. The running one completes and
  # only the newest push waits (GitHub replaces a pending run with a newer one), so middle commits are skipped.
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # One job per platform leg and part. Pull requests run the Linux legs; a manual run's `os` input picks
  # one platform; a push runs all six. The matrix is picked in an expression because a job `if`
  # cannot read it, and a separate job to pick it would cost one more job per run.
  # `lint`: also format and clippy. `cranelift`: the part (`a` or `b`) that also runs the corpus and
  # fixtures with `MS_BACKEND=cranelift`, the backend Debug builds use; the gates run in the other part.
  # `gates: false` skips the gates. On pull requests linux-amd64 runs Cranelift in `conformance` and
  # leaves the gates to linux-arm64, so each of the four jobs stays under ten minutes.
  # `docs`: also the language checks and the book (in the conformance part on pull requests); on main
  # the book is uploaded for Pages.
  # Failures shared with Linux are in tests/conformance/expect-fail.txt; platform-only ones go
  # in tests/conformance/expect-fail.<os>.txt with a reason.
  rust:
    name: ${{ matrix.leg.os }}-${{ matrix.leg.arch }}${{ matrix.part == 'a' && ' · tests' || matrix.part == 'b' && ' · conformance' || '' }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Pull requests split each leg into `tests` (a) and `conformance` (b) on two runners for wall time;
        # main is not waited on, so each leg runs both parts in one job: six jobs, not twelve.
        part: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["a", "b"]' || '["ab"]') }}
        leg: >-
          ${{ fromJSON(
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '[{"os": "linux", "arch": "amd64", "runner": "ubuntu-24.04", "lint": true, "cranelift": "b", "gates": false}, {"os": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm", "docs": true}]' ||
          inputs.os == 'linux' && '[{"os": "linux", "arch": "amd64", "runner": "ubuntu-24.04", "lint": true, "cranelift": "a"}, {"os": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm", "docs": true}]' ||
          inputs.os == 'darwin' && '[{"os": "darwin", "arch": "amd64", "runner": "macos-15-intel"}, {"os": "darwin", "arch": "arm64", "runner": "macos-15", "cranelift": "a"}]' ||
          inputs.os == 'windows' && '[{"os": "windows", "arch": "amd64", "runner": "windows-2025", "cranelift": "a"}, {"os": "windows", "arch": "arm64", "runner": "windows-11-arm"}]' ||
          '[{"os": "linux", "arch": "amd64", "runner": "ubuntu-24.04", "lint": true, "cranelift": "a"}, {"os": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm", "docs": true}, {"os": "darwin", "arch": "amd64", "runner": "macos-15-intel"}, {"os": "darwin", "arch": "arm64", "runner": "macos-15", "cranelift": "a"}, {"os": "windows", "arch": "amd64", "runner": "windows-2025", "cranelift": "a"}, {"os": "windows", "arch": "arm64", "runner": "windows-11-arm"}]'
          ) }}
    env:
      PR: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # Documentation-only pull requests skip the Rust steps.
      - id: scope
        uses: ./.github/actions/rust-scope
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          # One cache per leg, saved by main's single job and restored by both pull request parts.
          prefix: cargo-sccache-${{ matrix.leg.os }}-${{ matrix.leg.arch }}-
      - uses: ./.github/actions/rust-env
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
          llvm-consumers: ${{ matrix.part != 'b' && 'true' || 'false' }}
      - uses: ./.github/actions/language-checks
        if: matrix.leg.docs && matrix.part != 'a'
      - uses: ./.github/actions/book-checks
        if: matrix.leg.docs && matrix.part != 'a'
      - uses: actions/upload-pages-artifact@v5
        if: matrix.leg.docs && env.PR != 'true'
        with:
          path: .artifacts/book
      - uses: ./.github/actions/rust-checks
        if: steps.scope.outputs.rust == 'true'
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
          part: ${{ matrix.part }}
          lint: ${{ matrix.leg.lint || false }}
          cranelift: ${{ matrix.leg.cranelift || '' }}
          gates: ${{ matrix.leg.gates != false }}
      - uses: ./.github/actions/sccache-save
        if: ${{ !cancelled() }}
        with:
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          primary-key: ${{ steps.sccache.outputs.primary-key }}

  # The sum of the jobs above, one name for a ruleset to require.
  platforms:
    name: Platform checks
    if: always()
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform leg
        env:
          RESULT: ${{ needs.rust.result }}
        run: test "$RESULT" = success

  pages:
    name: Publish Pages docs
    needs: rust
    # Deploys whenever the book built, even if another platform failed.
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deploy
