name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  language:
    name: Language checks
    uses: ./.github/workflows/test-language.yml

  # Docs-only changes skip the Rust jobs.
  changes:
    name: Detect Rust-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      packages: ${{ steps.diff.outputs.packages }}
      excluded: ${{ steps.diff.outputs.excluded }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          rust=true
          packages=all
          excluded=
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
            if ! printf '%s\n' "$files" | grep -qvE '^(documentation/|website/|blog/|proposals/|skills/|extensions/|.*\.md$)'; then
              rust=false
            fi
            # Pull requests test only the crates they touch and their dependents; pushes to
            # main, merge groups and tags test everything.
            packages=$(printf '%s\n' "$files" | python3 scripts/rust-affected.py)
            excluded=$(printf '%s\n' "$files" | python3 scripts/rust-affected.py --complement)
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "excluded=$excluded" >> "$GITHUB_OUTPUT"

  # One job per platform runs everything for that platform in sequence, so a pull request
  # starts six Rust runners instead of dozens (the account runs 20 jobs at once). Tests
  # parallelize inside the job: nextest and the corpus runner both use every core.
  rust:
    name: Rust ${{ matrix.os }}-${{ matrix.arch }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: windows, arch: amd64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Keep native test artifacts in runner storage
        run: |
          printf '%s\n' "TMPDIR=$RUNNER_TEMP" "TMP=$RUNNER_TEMP" "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ matrix.os }}-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Select native Windows Rust host and MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rustTarget = if ('${{ matrix.arch }}' -eq 'arm64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          rustup set default-host $rustTarget
          $msvcLinker = Join-Path $env:VCToolsInstallDir ('bin/Host{0}/{1}/link.exe' -f $env:VSCMD_ARG_HOST_ARCH, $env:VSCMD_ARG_TGT_ARCH)
          if (!(Test-Path $msvcLinker)) { throw "MSVC linker missing: $msvcLinker" }
          $linkerKey = 'CARGO_TARGET_' + $rustTarget.ToUpper().Replace('-', '_') + '_LINKER'
          "$linkerKey=$msvcLinker" >> $env:GITHUB_ENV
          Write-Output "Rust linker: $msvcLinker"
      - name: Record native host and compiler
        run: |
          rustc -Vv
          cargo -V
          host=$(rustc -vV | sed -n 's/^host: //p')
          expected=x86_64
          if [ '${{ matrix.arch }}' = arm64 ]; then expected=aarch64; fi
          case "$host" in "$expected"-*) ;; *) echo "Wrong native Rust host: $host"; exit 1 ;; esac
          if [ "$RUNNER_OS" = Windows ]; then
            clang --version
            echo 'CC=clang' >> "$GITHUB_ENV"
            echo 'MS_LINKER=clang' >> "$GITHUB_ENV"
          else
            cc --version
          fi
      - name: Format and clippy
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
      # nextest runs each test in its own process, so tests that share process-global
      # state (the runtime allocator, the environment) cannot interfere.
      # Pull requests test the touched crates and their dependents (scripts/rust-affected.py).
      - name: Tests
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
          EXCLUDED: ${{ needs.changes.outputs.excluded }}
        run: |
          scope=--workspace
          doc_scope=--workspace
          if [ "$PACKAGES" != all ]; then
            scope=$(printf -- '-p %s ' $PACKAGES)
            doc_scope="--workspace $(printf -- '--exclude %s ' $EXCLUDED)"
          fi
          # shellcheck disable=SC2086
          cargo nextest run --locked $scope
          # shellcheck disable=SC2086
          cargo test --locked --doc $doc_scope
      - name: Frozen corpus against the Rust ms
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: make conform-rust
      - name: Install LLVM native debug consumers
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y llvm
          elif [ "$RUNNER_OS" = macOS ]; then
            brew install llvm
            echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          elif [ "$RUNNER_OS" = Windows ] && [ '${{ matrix.arch }}' = arm64 ]; then
            echo 'C:/Program Files/LLVM/bin' >> "$GITHUB_PATH"
          fi
      - name: Cache Windows x64 LLVM consumers
        if: runner.os == 'Windows' && matrix.arch == 'amd64'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/llvm-debug-19.1.7
          key: llvm-debug-windows-x64-19.1.7-b4557b4f
      - name: Install Windows x64 LLVM consumers
        if: runner.os == 'Windows' && matrix.arch == 'amd64'
        run: |
          temp_root=$(cygpath -u "$RUNNER_TEMP")
          tools="$temp_root/llvm-debug-19.1.7"
          if [ ! -x "$tools/llvm-dwarfdump.exe" ] || [ ! -x "$tools/llvm-symbolizer.exe" ]; then
            archive="$temp_root/llvm-debug-19.1.7.tar.xz"
            curl --fail --location --retry 3 'https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/clang%2Bllvm-19.1.7-x86_64-pc-windows-msvc.tar.xz' -o "$archive"
            echo "b4557b4f012161f56a2f5d9e877ab9635cafd7a08f7affe14829bd60c9d357f0  $archive" | sha256sum --check
            mkdir -p "$tools"
            tar -xJf - -C "$tools" --strip-components=2 \
              clang+llvm-19.1.7-x86_64-pc-windows-msvc/bin/llvm-dwarfdump.exe \
              clang+llvm-19.1.7-x86_64-pc-windows-msvc/bin/llvm-symbolizer.exe < "$archive"
          fi
          cygpath -w "$tools" >> "$GITHUB_PATH"
      - name: Native codegen, fault positions and debug attribution
        run: |
          cargo test --locked -p ms-mir --test opt_overflow -- --nocapture
          cargo test --locked -p ms-clif --test native predicated_overflow -- --nocapture
          cargo test --locked -p ms-clif --test native fault_trace_on_real_runtime -- --nocapture
          llvm-dwarfdump --version
          llvm-symbolizer --version
          cargo test --locked -p ms-clif --test dwarf -- --nocapture
          cargo test --locked -p ms-driver --test debug_artifacts -- --nocapture
          cargo test --locked -p ms-driver --lib -- --nocapture
      - name: Package and run the distribution on a hello project
        run: |
          sh scripts/package-rust.sh "${{ matrix.os }}" "${{ matrix.arch }}"
          name="manuscript-rust-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "extracted distribution"
          if [ '${{ matrix.os }}' = windows ]; then
            7z x -bso0 -o"extracted distribution" "dist/$name.zip"
            ms="extracted distribution/$name/ms.exe"
          else
            tar -xzf "dist/$name.tar.gz" -C "extracted distribution"
            ms="extracted distribution/$name/ms"
          fi
          "$ms" --version
          cd "extracted distribution/$name/examples/hello"
          "../../$(basename "$ms")" run ms.toml
      - name: Preserve test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            .artifacts/conform-rust.md
            ${{ runner.temp }}/ms-clif-tests-*
            ${{ runner.temp }}/ms-dwarf-*
            ${{ runner.temp }}/ms-driver-debug-*
          if-no-files-found: ignore

  # Keep one stable required check; every Rust job must pass before merging.
  rust-ok:
    name: Rust checks
    needs: [changes, rust]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Rust checks
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          RELEVANT: ${{ needs.changes.outputs.rust }}
        run: |
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*) exit 1 ;;
          esac
          # Skipped is acceptable only when the change detector found nothing Rust-relevant.
          if [ "$RELEVANT" = true ]; then
            case ",$RESULTS," in *,skipped,*) exit 1 ;; esac
          fi

  build:
    name: Build design book
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/cache@v6
        with:
          path: toolchain/
          key: sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version', 'scripts/toolchains.sha256') }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Prepare pinned SDK
        run: make toolchain
      # book-check below runs docs-check and the highlighting test.
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.146.7'
          extended: true
      - name: Validate project URL prefixes and production output
        run: |
          make book-check
          make book
          node --test tests/docs/publication.test.cjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/book

  pages:
    name: Publish Pages docs
    needs: [build, language]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deploy
