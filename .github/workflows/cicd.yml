name: CI/CD

# One workflow, three triggers:
#   pull request  `Build checks`: format, clippy, a build of every target, the language checks and the
#                 book, in one job on linux-amd64. No tests.
#   merge queue   the heavy checks, once per group of PRs on the group's combined commit: all six
#                 platforms in two parts each (see .github/actions/rust-checks), the language checks
#                 and the book. `Platform checks` sums the platforms up.
#   manual run    the same as the queue, plus Pages. cache-maintenance.yml starts one on main every
#                 hour; only a manual run on main saves the sccache caches.
# Require `Build checks` and `Platform checks`: each is skipped (and so passes) where it does not apply.
# The account runs 20 jobs at once and every extra job waits in the queue, so a pull request is one job.

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

env:
  # sccache stores each compiler output, so the saved cache stays small and bounded
  # (`target/` grew to several GB) and a changed crate rebuilds only itself.
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 2G
  # Debug info makes the dev and test builds slower to link and the saved caches several times
  # larger; nothing in CI reads the compiler's own debug info. Release keeps the profile setting.
  CARGO_PROFILE_DEV_DEBUG: '0'
  # Incremental artifacts are large and never reused on a fresh runner.
  CARGO_INCREMENTAL: '0'

concurrency:
  # A new commit cancels the earlier run of the same pull request; queue and manual runs are never cancelled.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # A pull request: the cheap checks, in one job.
  build:
    name: Build checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # A commit pushed within a minute cancels this run before any build starts.
      - name: Wait for a newer push
        run: sleep 60
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-linux-amd64-a-
      - uses: ./.github/actions/rust-env
        with:
          os: linux
          arch: amd64
      # Language and book checks run for every change, documentation included.
      - uses: ./.github/actions/language-checks
      - uses: ./.github/actions/book-checks
      # Documentation-only changes skip the Rust checks.
      - id: scope
        uses: ./.github/actions/rust-scope
      - uses: ./.github/actions/build-checks
        if: steps.scope.outputs.rust == 'true'
      - uses: ./.github/actions/sccache-save
        if: ${{ !cancelled() }}
        with:
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          primary-key: ${{ steps.sccache.outputs.primary-key }}

  # The merge queue and manual runs: the heavy checks.
  rust:
    name: ${{ matrix.leg.os }}-${{ matrix.leg.arch }} · ${{ matrix.part == 'a' && 'tests' || 'conformance' }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        part: [a, b]
        # `lint`: also format and clippy. `cranelift`: also the corpus and fixtures with
        # `MS_BACKEND=cranelift`, so release builds use the Cranelift backend that Debug builds use.
        # Failures shared with Linux are in tests/conformance/expect-fail.txt; platform-only ones go
        # in tests/conformance/expect-fail.<os>.txt with a reason.
        leg:
          - {os: linux, arch: amd64, runner: ubuntu-24.04, lint: true, cranelift: true}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15, cranelift: true}
          - {os: windows, arch: amd64, runner: windows-2025, cranelift: true}
          - {os: windows, arch: arm64, runner: windows-11-arm}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-${{ matrix.leg.os }}-${{ matrix.leg.arch }}-${{ matrix.part }}-
      - uses: ./.github/actions/rust-env
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
          llvm-consumers: ${{ matrix.part == 'a' && 'true' || 'false' }}
      - uses: ./.github/actions/rust-checks
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
          part: ${{ matrix.part }}
          lint: ${{ matrix.leg.lint || false }}
          cranelift: ${{ matrix.leg.cranelift || false }}
      - uses: ./.github/actions/sccache-save
        if: ${{ !cancelled() }}
        with:
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          primary-key: ${{ steps.sccache.outputs.primary-key }}

  # The sum of the Rust jobs above, one name for the queue to require.
  platforms:
    name: Platform checks
    if: github.event_name == 'merge_group' && always()
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform
        env:
          RESULT: ${{ needs.rust.result }}
        run: test "$RESULT" = success

  language:
    name: Language checks
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/test-language.yml

  book:
    name: Build design book
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 1G
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-docs-
      - uses: ./.github/actions/book-checks
      - uses: ./.github/actions/sccache-save
        if: ${{ !cancelled() }}
        with:
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          primary-key: ${{ steps.sccache.outputs.primary-key }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/book

  pages:
    name: Publish Pages docs
    needs: [book, language]
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deploy
