name: CI/CD

# One workflow, four triggers:
#   pull request  the Linux legs (amd64 and arm64, `tests` and `conformance` each, four jobs), with the
#                 language checks and the book inside linux-arm64 conformance. A green pull request auto-merges on them; there is no merge queue, which
#                 built every stacked ref with the full matrix and restarted on every outside merge.
#   merge queue   the same as a pull request, in case a queue is configured again.
#   push to main  all six platforms in two parts each (see .github/actions/rust-checks), the language
#                 checks and the book, plus Pages and the sccache caches. A newer push cancels the running
#                 one, so the latest main is the one being tested. A platform failure is fixed or reverted.
#   manual run    the same as a push; its `os` input runs one platform's legs.
# Require `Platform checks`; language and book run inside it on pull requests.
# The account runs 20 jobs at once and every extra job waits in the queue.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      os:
        description: Platforms for the Rust jobs
        type: choice
        options: [all, linux, darwin, windows]
        default: all

permissions:
  contents: read

env:
  # sccache stores each compiler output, so the saved cache stays small and bounded
  # (`target/` grew to several GB) and a changed crate rebuilds only itself.
  RUSTC_WRAPPER: sccache
  SCCACHE_CACHE_SIZE: 2G
  # Debug info makes the dev and test builds slower to link and the saved caches several times
  # larger; nothing in CI reads the compiler's own debug info. Release keeps the profile setting.
  CARGO_PROFILE_DEV_DEBUG: '0'
  # Incremental artifacts are large and never reused on a fresh runner.
  CARGO_INCREMENTAL: '0'

concurrency:
  # A new commit cancels the earlier run of the same pull request, and a new push to main the earlier main
  # run; queue and manual runs are never cancelled.
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

defaults:
  run:
    shell: bash

jobs:
  # One job per platform leg and part. Pull requests run the Linux legs; a manual run's `os` input picks
  # one platform; a push runs all six. The matrix is picked in an expression because a job `if`
  # cannot read it, and a separate job to pick it would cost one more job per run.
  # `lint`: also format and clippy. `cranelift`: also the corpus and fixtures with
  # `MS_BACKEND=cranelift`, so release builds use the Cranelift backend that Debug builds use.
  # `docs`: on pull requests, also the language checks and the book in the conformance part (on
  # pushes they are their own jobs, since Pages needs the book).
  # Failures shared with Linux are in tests/conformance/expect-fail.txt; platform-only ones go
  # in tests/conformance/expect-fail.<os>.txt with a reason.
  rust:
    name: ${{ matrix.leg.os }}-${{ matrix.leg.arch }} · ${{ matrix.part == 'a' && 'tests' || 'conformance' }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        part: [a, b]
        leg: >-
          ${{ fromJSON(
          (github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.os == 'linux') && '[{"os": "linux", "arch": "amd64", "runner": "ubuntu-24.04", "lint": true, "cranelift": true}, {"os": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm", "docs": true}]' ||
          inputs.os == 'darwin' && '[{"os": "darwin", "arch": "amd64", "runner": "macos-15-intel"}, {"os": "darwin", "arch": "arm64", "runner": "macos-15", "cranelift": true}]' ||
          inputs.os == 'windows' && '[{"os": "windows", "arch": "amd64", "runner": "windows-2025", "cranelift": true}, {"os": "windows", "arch": "arm64", "runner": "windows-11-arm"}]' ||
          '[{"os": "linux", "arch": "amd64", "runner": "ubuntu-24.04", "lint": true, "cranelift": true}, {"os": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm", "docs": true}, {"os": "darwin", "arch": "amd64", "runner": "macos-15-intel"}, {"os": "darwin", "arch": "arm64", "runner": "macos-15", "cranelift": true}, {"os": "windows", "arch": "amd64", "runner": "windows-2025", "cranelift": true}, {"os": "windows", "arch": "arm64", "runner": "windows-11-arm"}]'
          ) }}
    env:
      PR: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    steps:
      # A commit pushed within a minute cancels this run before any build starts.
      - name: Wait for a newer push
        if: github.event_name == 'pull_request'
        run: sleep 60
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # Documentation-only pull requests skip the Rust steps.
      - id: scope
        uses: ./.github/actions/rust-scope
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-${{ matrix.leg.os }}-${{ matrix.leg.arch }}-${{ matrix.part }}-
      - uses: ./.github/actions/rust-env
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
          llvm-consumers: ${{ matrix.part == 'a' && 'true' || 'false' }}
      - uses: ./.github/actions/language-checks
        if: env.PR == 'true' && matrix.leg.docs && matrix.part == 'b'
      - uses: ./.github/actions/book-checks
        if: env.PR == 'true' && matrix.leg.docs && matrix.part == 'b'
      - uses: ./.github/actions/rust-checks
        if: steps.scope.outputs.rust == 'true'
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
          part: ${{ matrix.part }}
          lint: ${{ matrix.leg.lint || false }}
          cranelift: ${{ matrix.leg.cranelift || false }}
      - uses: ./.github/actions/sccache-save
        if: ${{ !cancelled() }}
        with:
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          primary-key: ${{ steps.sccache.outputs.primary-key }}

  # The sum of the jobs above, one name for a ruleset to require.
  platforms:
    name: Platform checks
    if: always()
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform leg
        env:
          RESULT: ${{ needs.rust.result }}
        run: test "$RESULT" = success

  language:
    name: Language checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/test-language.yml

  book:
    name: Build design book
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 1G
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-docs-
      - uses: ./.github/actions/book-checks
      - uses: ./.github/actions/sccache-save
        if: ${{ !cancelled() }}
        with:
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          primary-key: ${{ steps.sccache.outputs.primary-key }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/book

  pages:
    name: Publish Pages docs
    needs: [book, language]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deploy
