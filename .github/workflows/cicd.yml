name: CI/CD
on:
  workflow_dispatch:
    inputs:
      os:
        description: Platforms for the Rust jobs
        type: choice
        options: [all, linux, darwin, windows]
        default: all
permissions:
  contents: read
jobs:
  dbg:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          echo 'RUSTFLAGS=-C link-arg=/FORCE:UNRESOLVED' >> "$GITHUB_ENV"
          rustc -vV
      - shell: bash
        run: cargo test -p ms-rt --lib dbg_five -- --nocapture 2>&1 | grep -E "DBG|error|test result"
