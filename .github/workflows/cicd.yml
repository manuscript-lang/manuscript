name: CI/CD

# One workflow, four triggers:
#   pull request  the Linux legs with programs built by Cranelift (the Debug backend); a pull request that touches
#                 LLVM-related code (see .github/actions/rust-scope) also runs the LLVM corpus and release gates. The Linux legs, each one job (`ab`: the tests and the conformance corpus together); the language checks
#                 and the book run inside linux-arm64. A green pull request auto-merges; there
#                 is no merge queue, which built every stacked ref with the full matrix and restarted on
#                 every outside merge.
#   merge queue   the same as a pull request, in case a queue is configured again.
#   main          every 30 minutes (cron at :07 and :37), when main has a commit that no earlier scheduled run
#                 checked: all six platforms, each split into `tests` and `conformance` (twelve jobs, see
#                 .github/actions/rust-checks); linux-arm64 also builds the book for Pages and the tests
#                 jobs save the sccache caches. A failure is fixed or reverted.
#   manual run    the same as a main run; its `os` input runs one platform.
# Require `Platform checks`.

on:
  pull_request:
  schedule:
    # Pushes to main no longer start a run: twelve runners per push took too many slots. Minutes 7 and 37,
    # not 0 and 30: GitHub delays and drops scheduled runs at the start of the hour and half hour.
    - cron: '7,37 * * * *'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      os:
        description: Platforms for the Rust jobs
        type: choice
        options: [all, linux, darwin, windows]
        default: all

permissions:
  contents: read

env:
  # sccache stores each compiler output, so the saved cache stays small and bounded
  # (`target/` grew to several GB) and a changed crate rebuilds only itself.
  RUSTC_WRAPPER: sccache
  # Six legs share the repository's 10 GB Actions cache. At 2G each, Linux and Windows filled the cap
  # (macOS used about 1 GB), the total passed 10 GB, and GitHub evicted the least recently used
  # entries: the macOS and Windows caches, which only main reads. 1.5G keeps all six with room
  # for the LLVM tool caches; sccache drops its least recently used outputs past the cap.
  SCCACHE_CACHE_SIZE: 1500M
  # Debug info makes the dev and test builds slower to link and the saved caches several times
  # larger; nothing in CI reads the compiler's own debug info. Release keeps the profile setting.
  CARGO_PROFILE_DEV_DEBUG: '0'
  # Incremental artifacts are large and never reused on a fresh runner.
  CARGO_INCREMENTAL: '0'

concurrency:
  # A new commit cancels the earlier run of the same pull request. Main runs are not cancelled: with pull
  # requests merging every few minutes, cancelling meant no main run finished. The running one completes and
  # only the newest push waits (GitHub replaces a pending run with a newer one), so middle commits are skipped.
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'schedule' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # A scheduled run does nothing when the last scheduled run of main already checked this commit
  # (whatever its result: a red main waits for a fix). Manual runs may cover only one OS, so they
  # never replace the scheduled six-platform run. Every other trigger always runs.
  due:
    name: Main changed
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - id: due
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = schedule ]; then
            seen=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cicd.yml --branch main --event schedule --limit 40 \
              --json databaseId,headSha,event,status,conclusion \
              --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .event == \"schedule\" and .conclusion != \"cancelled\" and .conclusion != \"skipped\")][0].headSha")
            if [ "$seen" = "$GITHUB_SHA" ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # One job per platform leg and part. Pull requests run the Linux legs; a manual run's `os` input picks
  # one platform; a scheduled run covers all six. The matrix is picked in an expression because a job `if`
  # cannot read it, and a separate job to pick it would cost one more job per run.
  # `lint`: also format and clippy. `cranelift`: the part (`a` or `b`) that also runs the corpus and
  # fixtures with `MS_BACKEND=cranelift`, the backend Debug builds use; the gates run in the other part.
  # `gates: false` skips the gates. On pull requests linux-amd64 runs Cranelift in `conformance` and
  # leaves the gates to linux-arm64, so each job stays under ten minutes.
  # `docs`: also the language checks and the book (in the conformance part on pull requests); on main
  # the book is uploaded for Pages.
  # Failures shared with Linux are in tests/conformance/expect-fail.txt; platform-only ones go
  # in tests/conformance/expect-fail.<os>.txt with a reason.
  rust:
    needs: due
    if: needs.due.outputs.run == 'true'
    name: ${{ matrix.leg.os }}-${{ matrix.leg.arch }}${{ matrix.part == 'a' && ' · tests' || matrix.part == 'b' && ' · conformance' || '' }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Main and manual runs split every leg into `tests` (a) and `conformance` (b) on two runners for wall
        # time. Pull requests run each Linux leg as one job (`ab`): the two halves repeat the setup and the
        # build, so one runner does the same work in less total time and uses half the runners.
        part: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group') && '["ab"]' || '["a", "b"]') }}
        leg: >-
          ${{ fromJSON(
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '[{"os": "linux", "arch": "amd64", "runner": "ubuntu-24.04", "lint": true, "cranelift": "b", "gates": "false"}, {"os": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm", "docs": true, "gates_part": "a"}]' ||
          inputs.os == 'linux' && '[{"os": "linux", "arch": "amd64", "runner": "ubuntu-24.04", "lint": true, "cranelift": "b"}, {"os": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm", "docs": true, "gates_part": "a"}]' ||
          inputs.os == 'darwin' && '[{"os": "darwin", "arch": "amd64", "runner": "macos-15-intel"}, {"os": "darwin", "arch": "arm64", "runner": "macos-15", "cranelift": "a"}]' ||
          inputs.os == 'windows' && '[{"os": "windows", "arch": "amd64", "runner": "windows-2025", "cranelift": "b"}, {"os": "windows", "arch": "arm64", "runner": "windows-11-arm"}]' ||
          '[{"os": "linux", "arch": "amd64", "runner": "ubuntu-24.04", "lint": true, "cranelift": "b"}, {"os": "linux", "arch": "arm64", "runner": "ubuntu-24.04-arm", "docs": true, "gates_part": "a"}, {"os": "darwin", "arch": "amd64", "runner": "macos-15-intel"}, {"os": "darwin", "arch": "arm64", "runner": "macos-15", "cranelift": "a"}, {"os": "windows", "arch": "amd64", "runner": "windows-2025", "cranelift": "b"}, {"os": "windows", "arch": "arm64", "runner": "windows-11-arm"}]'
          ) }}
    env:
      PR: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # Documentation-only pull requests skip the Rust steps.
      - id: scope
        uses: ./.github/actions/rust-scope
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          # One cache per leg, saved by main's single job and restored by both pull request parts.
          prefix: cargo-sccache-${{ matrix.leg.os }}-${{ matrix.leg.arch }}-
      - uses: ./.github/actions/rust-env
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
          llvm-consumers: ${{ matrix.part != 'b' && 'true' || 'false' }}
      - uses: ./.github/actions/language-checks
        if: matrix.leg.docs && matrix.part != 'a'
      - uses: ./.github/actions/book-checks
        if: matrix.leg.docs && matrix.part != 'a'
      - uses: actions/upload-pages-artifact@v5
        if: matrix.leg.docs && matrix.part == 'b' && env.PR != 'true'
        with:
          path: .artifacts/book
      - uses: ./.github/actions/rust-checks
        if: steps.scope.outputs.rust == 'true'
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
          part: ${{ matrix.part }}
          lint: ${{ matrix.leg.lint || false }}
          cranelift: ${{ matrix.leg.cranelift || '' }}
          gates: ${{ matrix.leg.gates || 'true' }}
          gates-part: ${{ matrix.leg.gates_part || '' }}
          llvm: ${{ steps.scope.outputs.llvm }}
      - uses: ./.github/actions/sccache-save
        # Part a builds the whole workspace, a superset of part b, so one save per leg keeps the cache count at six.
        if: ${{ !cancelled() && matrix.part == 'a' }}
        with:
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          primary-key: ${{ steps.sccache.outputs.primary-key }}

  # The sum of the jobs above, one name for a ruleset to require.
  platforms:
    name: Platform checks
    if: always()
    needs: [due, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform leg
        env:
          RESULT: ${{ needs.rust.result }}
          DUE: ${{ needs.due.outputs.run }}
        run: test "$RESULT" = success || test "$DUE" = false

  pages:
    name: Publish Pages docs
    needs: [due, rust]
    # Only all-platform and Linux runs build the book; deploy it even if another platform failed.
    if: ${{ !cancelled() && needs.due.outputs.run == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.os == 'all' || inputs.os == 'linux'))) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deploy
