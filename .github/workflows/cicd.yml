name: CI/CD

# The merge queue's group runs and manual runs. Pull requests run pr.yml (two Linux jobs).
#   merge queue   one run per group of PRs, on the group's combined commit: the darwin and windows
#                 legs here, next to the two Linux jobs from pr.yml. `Platform checks` sums them up.
#   manual run    all six platforms. cache-maintenance.yml starts one on main every hour, and only a
#                 manual run on main saves the sccache caches. Run it by hand on a branch to test a
#                 platform-specific change. It also deploys Pages.
# Each platform runs as two parts on separate runners (`tests` and `conformance`; see
# .github/actions/rust-checks).

on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Debug info makes the dev and test builds slower to link and the saved caches several times
  # larger; nothing in CI reads the compiler's own debug info. Release keeps the profile setting.
  CARGO_PROFILE_DEV_DEBUG: '0'
  # Incremental artifacts are large and never reused on a fresh runner.
  CARGO_INCREMENTAL: '0'

concurrency:
  # Queue and manual runs never cancel or replace each other.
  group: ci-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  rust:
    name: ${{ matrix.leg.os }}-${{ matrix.leg.arch }} · ${{ matrix.part == 'a' && 'tests' || 'conformance' }}
    runs-on: ${{ matrix.leg.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        part: [a, b]
        # `lint`: also format and clippy. `cranelift`: also the corpus and fixtures with
        # `MS_BACKEND=cranelift`, so release builds use the Cranelift backend that Debug builds use.
        # Failures shared with Linux are in tests/conformance/expect-fail.txt; platform-only ones go
        # in tests/conformance/expect-fail.<os>.txt with a reason.
        leg: ${{ fromJSON(github.event_name == 'merge_group' && '[
          {"os":"darwin","arch":"amd64","runner":"macos-15-intel"},
          {"os":"darwin","arch":"arm64","runner":"macos-15","cranelift":true},
          {"os":"windows","arch":"amd64","runner":"windows-2025","cranelift":true},
          {"os":"windows","arch":"arm64","runner":"windows-11-arm"}]' || '[
          {"os":"linux","arch":"amd64","runner":"ubuntu-24.04","lint":true,"cranelift":true},
          {"os":"linux","arch":"arm64","runner":"ubuntu-24.04-arm"},
          {"os":"darwin","arch":"amd64","runner":"macos-15-intel"},
          {"os":"darwin","arch":"arm64","runner":"macos-15","cranelift":true},
          {"os":"windows","arch":"amd64","runner":"windows-2025","cranelift":true},
          {"os":"windows","arch":"arm64","runner":"windows-11-arm"}]') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-${{ matrix.leg.os }}-${{ matrix.leg.arch }}-${{ matrix.part }}-
      - uses: ./.github/actions/rust-env
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
          llvm-consumers: ${{ matrix.part == 'a' && 'true' || 'false' }}
      - uses: ./.github/actions/rust-checks
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
          part: ${{ matrix.part }}
          lint: ${{ matrix.leg.lint || false }}
          cranelift: ${{ matrix.leg.cranelift || false }}
      - uses: ./.github/actions/sccache-save
        if: ${{ !cancelled() }}
        with:
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          primary-key: ${{ steps.sccache.outputs.primary-key }}

  # The sum of the Rust jobs above, one name for the queue to require.
  platforms:
    name: Platform checks
    if: github.event_name == 'merge_group' && always()
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform
        env:
          RESULT: ${{ needs.rust.result }}
        run: test "$RESULT" = success

  # The queue runs these in pr.yml's amd64 job.
  language:
    name: Language checks
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/test-language.yml

  build:
    name: Build design book
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 1G
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: sccache
        uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-docs-
      - uses: ./.github/actions/book-checks
      - uses: ./.github/actions/sccache-save
        if: ${{ !cancelled() }}
        with:
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          primary-key: ${{ steps.sccache.outputs.primary-key }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/book

  pages:
    name: Publish Pages docs
    needs: [build, language]
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deploy
