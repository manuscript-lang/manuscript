name: diag
on:
  push:
    branches: [claude/project-thread-dtfx0d]
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, os: windows, arch: amd64}
          - {runner: macos-15, os: macos, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Select Windows host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup set default-host x86_64-pc-windows-msvc
          $l = Join-Path $env:VCToolsInstallDir ('bin/Host{0}/{1}/link.exe' -f $env:VSCMD_ARG_HOST_ARCH, $env:VSCMD_ARG_TGT_ARCH)
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$l" >> $env:GITHUB_ENV
          "CC=clang" >> $env:GITHUB_ENV
      - uses: ./.github/actions/native-toolchain
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
      - run: cargo xtask runtime && cargo build --locked -p ms-cli
      - name: yaml debug build
        continue-on-error: true
        run: |
          ms=target/debug/ms; [ "$RUNNER_OS" = Windows ] && ms=$ms.exe
          $ms test tests/conformance/fixtures/e2e/stdlib/yaml.ms --build-type Debug > yaml-debug.txt 2>&1 || true
          grep -E "FAIL|tests," yaml-debug.txt || true
      - name: yaml release failing tests
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          target/debug/ms test tests/conformance/fixtures/e2e/stdlib/yaml.ms --list | sed -n 1,40p
          target/debug/ms test tests/conformance/fixtures/e2e/stdlib/yaml.ms --test "yaml.ms::YAML quoted folding trims physical whitespace and preserves escapes" > y1.txt 2>&1 || true
          cat y1.txt | tail -8
          sleep 5
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do echo "== $f"; head -c 6000 "$f"; done 2>/dev/null | head -150
      - name: workers per test
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          ms=target/debug/ms.exe
          $ms test tests/conformance/fixtures/e2e/stdlib/workers.ms --list > wl.txt 2>&1
          wc -l wl.txt
          while IFS= read -r name; do
            case "$name" in *::*) ;; *) continue;; esac
            timeout 90 $ms test tests/conformance/fixtures/e2e/stdlib/workers.ms --test "$name" --timeout 20s > w.txt 2>&1
            echo "[$?] $name :: $(grep -E 'PASS|FAIL|timed' w.txt | tr '\n' ' ' | cut -c1-200)"
          done < wl.txt
      - name: http deadline fixture
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          ms=target/debug/ms.exe
          timeout 40 $ms run tests/conformance/fixtures/e2e/stdlib/http-request-deadline.ms > h.txt 2>&1
          echo "exit $?"; cat h.txt | head -20
