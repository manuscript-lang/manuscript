name: diag
on:
  push:
    branches: [claude/project-thread-dtfx0d]
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, os: windows, arch: amd64}
          - {runner: macos-15, os: macos, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Select Windows host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup set default-host x86_64-pc-windows-msvc
          $l = Join-Path $env:VCToolsInstallDir ('bin/Host{0}/{1}/link.exe' -f $env:VSCMD_ARG_HOST_ARCH, $env:VSCMD_ARG_TGT_ARCH)
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$l" >> $env:GITHUB_ENV
          "CC=clang" >> $env:GITHUB_ENV
      - uses: ./.github/actions/native-toolchain
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
      - run: cargo xtask runtime && cargo build --locked -p ms-cli
      - name: teardown fixture
        continue-on-error: true
        run: |
          set +e
          ms=$PWD/target/debug/ms; [ "$RUNNER_OS" = Windows ] && ms=$ms.exe
          mkdir -p tdir && cd tdir
          MS_KEEP_LL=1 MS_DEBUG_TABLES=1 MS_DIAG_FRAMES=1 $ms test ../tests/conformance/fixtures/snippets/testing-fixture-teardown-on-skip.ms > out.txt 2>&1
          grep -E "^fn |diag|  at " out.txt | cut -c1-200 | head -60
          echo ---- defines
          grep -n "^define" ms-keep.ll | cut -c1-160 | head -60
          true
      - name: yaml release failing tests
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          mkdir -p ydir && cd ydir
          MS_DIAG_COPY_EXE=$PWD/ytest MS_KEEP_LL=1 MS_DEBUG_TABLES=1 MS_DIAG_FRAMES=1 ../target/debug/ms test ../tests/conformance/fixtures/e2e/stdlib/yaml.ms --test "yaml.ms::YAML quoted folding trims physical whitespace and preserves escapes" > out.txt 2>&1
          grep -E "SEGV|diag" out.txt | cut -c1-220 | head -20
          lldb -b -s ../.github/diag/lldb.cmd -- ./ytest 5 > lldb.txt 2>&1; tail -260 lldb.txt | cut -c1-160
          true
      - name: mac repros under lldb
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          set +e
          for f in ym; do
            target/debug/ms build .github/diag/$f.ms -o $f-bin
            ./$f-bin 2>&1 | tail -3
            echo "exit $?"
            lldb -b -o run -o "bt 15" -o "image lookup -a \$lr" -o "disassemble -p -c 12" -o "register read pc lr" -o "image lookup -a \$pc" -- ./$f-bin 2>&1 | tail -30
          done
          true
      - name: workers remaining tests
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          set +e
          ms=target/debug/ms.exe
          for name in "workers.ms::workers fetch from the starter's server at the same time" "workers.ms::bytes cross a worker pipe without JSON" "workers.ms::workers serve one port with a shared listener" "workers.ms::tasks joining clones of one worker all see its outcome"; do
            timeout 90 $ms test tests/conformance/fixtures/e2e/stdlib/workers.ms --test "$name" --timeout 20s > w.txt 2>&1
            echo "[$?] $name :: $(grep -E 'PASS|FAIL|timed' w.txt | tr '\n' ' ' | cut -c1-300)"
          done
          true
      - name: http variants
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          set +e
          for v in s0 s1 s2 s3; do
            echo "== $v"
            timeout 40 target/debug/ms.exe run .github/diag/$v.ms > h.txt 2>&1
            echo "exit $?"; head -20 h.txt
          done
          true
