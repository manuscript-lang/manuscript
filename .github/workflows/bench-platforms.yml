name: Platform benchmarks

# Manual runs only: builds `ms` with the C build natively on each platform, prints the bench/perf/strappend
# table (String append and List growth against Rust) and three rounds of bench/perf/json (against Node and
# serde_json), and the file, spawn and pipe timings of bench/tools/platform_io.ms, so that a runtime change
# can be checked on Linux, macOS and Windows before and after merging.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.artifacts/ccache

jobs:
  strappend:
    name: strappend ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, runner: ubuntu-24.04, shell: bash }
          - { name: darwin-arm64, runner: macos-15, shell: bash }
          - { name: darwin-amd64, runner: macos-15-intel, shell: bash }
          - { name: windows-amd64, runner: windows-2025, shell: 'msys2 {0}' }
    # Windows runs inside the MSYS2 shell that the toolchain step installs.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - run: cmake --preset ci
      - run: cmake --build --preset ci
      - run: cmake --build --preset ci --target llvm-lib
      - name: Record the CPU
        run: |
          case "$RUNNER_OS" in
            Linux) lscpu | grep -E 'Model name|Flags' | cut -c1-200 ;;
            macOS) sysctl -n machdep.cpu.brand_string ;;
            Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" ;;
          esac
      - name: Run bench/perf/strappend
        run: |
          ms=.artifacts/build/ci/src/cli/ms
          if [ "$RUNNER_OS" = Windows ]; then ms="$ms.exe"; fi
          MS="$PWD/$ms" "$PWD/$ms" run bench/tools/strappend.ms -- 5 | tee strappend-${{ matrix.name }}.txt
      - name: Run bench/perf/json
        run: |
          ms=.artifacts/build/ci/src/cli/ms
          if [ "$RUNNER_OS" = Windows ]; then ms="$ms.exe"; fi
          for _ in 1 2 3; do
            MS="$PWD/$ms" "$PWD/$ms" run bench/tools/json_bench.ms
          done | tee json-${{ matrix.name }}.txt
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: amd64
      - name: Run the Rust control for platform_io
        shell: bash
        run: |
          # Git's `link.exe` shadows MSVC's on the Windows runner, so rustc gets the linker explicitly.
          if [ "$RUNNER_OS" = Windows ]; then
            CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER="$(cygpath -u "$VCToolsInstallDir")/bin/Host${VSCMD_ARG_HOST_ARCH}/${VSCMD_ARG_TGT_ARCH}/link.exe"
          fi
          ms=.artifacts/build/ci/src/cli/ms
          if [ "$RUNNER_OS" = Windows ]; then ms="$ms.exe"; fi
          linker=()
          if [ -n "${CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER:-}" ]; then
            linker=(-C "linker=$CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER")
          fi
          rustc -O "${linker[@]}" -o platform_io_rust bench/perf/platform_io/main.rs
          ./platform_io_rust 2000 "$PWD/$ms" | tee platform-io-rust-${{ matrix.name }}.txt
      - name: Run bench/tools/platform_io
        timeout-minutes: 5
        run: |
          ms=.artifacts/build/ci/src/cli/ms
          if [ "$RUNNER_OS" = Windows ]; then ms="$ms.exe"; fi
          MS="$PWD/$ms" "$PWD/$ms" run bench/tools/platform_io.ms | tee platform-io-${{ matrix.name }}.txt
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bench-${{ matrix.name }}
          path: |
            strappend-${{ matrix.name }}.txt
            json-${{ matrix.name }}.txt
            platform-io-${{ matrix.name }}.txt
            platform-io-rust-${{ matrix.name }}.txt
