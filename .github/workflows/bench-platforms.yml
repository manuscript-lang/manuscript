name: Platform benchmarks

# Manual runs only: builds the release `ms` natively on each platform, runs the runtime allocator and
# memory tests, prints the bench/perf/strappend table (StringBuilder and List growth against Rust) and
# three rounds of bench/perf/json (against Node and serde_json), so that a runtime change can be
# checked on Linux, macOS and Windows before and after merging.
on:
  workflow_dispatch:
    inputs:
      asm_only:
        description: Only print the disassembly of the append loop (Linux and macOS arm64), skip the benchmarks
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  strappend:
    if: ${{ !inputs.asm_only }}
    name: strappend ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { name: darwin-arm64, os: darwin, arch: arm64, runner: macos-15 }
          - { name: darwin-amd64, os: darwin, arch: amd64, runner: macos-15-intel }
          - { name: windows-amd64, os: windows, arch: amd64, runner: windows-2025 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: amd64
      - name: Select native Windows Rust host and MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rustTarget = 'x86_64-pc-windows-msvc'
          rustup set default-host $rustTarget
          $msvcLinker = Join-Path $env:VCToolsInstallDir ('bin/Host{0}/{1}/link.exe' -f $env:VSCMD_ARG_HOST_ARCH, $env:VSCMD_ARG_TGT_ARCH)
          if (!(Test-Path $msvcLinker)) { throw "MSVC linker missing: $msvcLinker" }
          $linkerKey = 'CARGO_TARGET_' + $rustTarget.ToUpper().Replace('-', '_') + '_LINKER'
          "$linkerKey=$msvcLinker" >> $env:GITHUB_ENV
      - name: Use clang as the C compiler on Windows
        if: runner.os == 'Windows'
        run: echo 'CC=clang' >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-toolchain
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
      - name: Record the CPU
        run: |
          case "$RUNNER_OS" in
            Linux) lscpu | grep -E 'Model name|Flags' | cut -c1-200 ;;
            macOS) sysctl -n machdep.cpu.brand_string ;;
            Windows) powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" ;;
          esac
      - name: Build the native runtime
        run: cargo xtask runtime
      - name: Runtime allocator and memory tests
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export RUSTFLAGS='-C link-arg=/FORCE:UNRESOLVED'
          fi
          cargo test --locked -p ms-rt --lib -- alloc:: mem::
      - name: Build the release ms
        run: cargo build --release --locked -p ms-cli
      - name: Run bench/perf/strappend
        run: |
          ms=target/release/ms
          if [ "$RUNNER_OS" = Windows ]; then ms="$ms.exe"; fi
          # Git's `link.exe` shadows MSVC's on the Windows runner, so rustc gets the linker explicitly.
          export RUSTC_LINKER="${CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER:-}"
          MS="$PWD/$ms" sh bench/perf/strappend/run.sh 5 | tee strappend-${{ matrix.name }}.txt
      - name: Run bench/perf/json
        run: |
          ms=target/release/ms
          if [ "$RUNNER_OS" = Windows ]; then ms="$ms.exe"; fi
          for _ in 1 2 3; do
            MS="$PWD/$ms" sh bench/perf/json/run.sh
          done | tee json-${{ matrix.name }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.name }}
          path: |
            strappend-${{ matrix.name }}.txt
            json-${{ matrix.name }}.txt

  asm:
    if: ${{ inputs.asm_only }}
    name: asm ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { name: darwin-arm64, os: darwin, arch: arm64, runner: macos-15 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/native-toolchain
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
      - run: cargo xtask runtime
      - run: cargo build --release --locked -p ms-cli
      - name: Disassemble the 64 B append loop of Manuscript and Rust
        run: |
          mkdir -p asm/ms/src
          cp bench/perf/strappend/ms/ms.toml asm/ms/
          cat > asm/ms/src/main.ms <<'EOF'
          from "@std/collections.ms" import range
          from "@std/string.ms" import StringBuilder

          def run(piece: String, count: Int) -> Int:
              var sb = StringBuilder()
              for i in range(0, count):
                  sb.append(piece)
              return sb.build().byte_length()

          export def main() -> Int:
              let piece = "x".repeat(64).get()
              var total = 0
              for rep in range(0, 20):
                  total += run(piece, 15625)
              return total - total
          EOF
          cat > asm/r.rs <<'EOF'
          fn run(p: &str, c: usize) -> usize {
              let mut s = String::new();
              for _ in 0..c {
                  s.push_str(p);
              }
              std::hint::black_box(s).len()
          }
          fn main() {
              let p = std::hint::black_box("x".repeat(64));
              let mut t = 0;
              for _ in 0..20 {
                  t += run(&p, 15625);
              }
              std::process::exit((t - t) as i32);
          }
          EOF
          (cd asm/ms && rm -f ms.lock && ../../target/release/ms build ms.toml -o ../msb)
          rustc --edition 2021 -C opt-level=3 -C codegen-units=1 -o asm/rb asm/r.rs
          for b in msb rb; do
            if [ "$RUNNER_OS" = macOS ]; then otool -tV "asm/$b" > "asm/$b.s"; else objdump -d --no-show-raw-insn -M intel "asm/$b" > "asm/$b.s"; fi
            echo "=== $b: code around each memcpy call"
            grep -n -E 'memcpy' "asm/$b.s" | grep -E 'bl|call' | head -20
          done
          for b in msb rb; do
            echo "=== $b: 70 lines before the first memcpy call"
            n=$(grep -n -E '(bl|call).*memcpy' "asm/$b.s" | head -1 | cut -d: -f1)
            if [ -n "$n" ]; then sed -n "$((n>70?n-70:1)),$((n+25))p" "asm/$b.s"; fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: asm-${{ matrix.name }}
          path: asm/*.s
