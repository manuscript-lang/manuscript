name: C port

# The C build (src/, CMake with Ninja). Pull requests that touch C files build the two Linux legs;
# scheduled and manual runs build all six platforms. Steps are one-line calls to cmake and ctest.
on:
  pull_request:
    paths: ['src/**', 'cmake/**', 'CMakeLists.txt', 'CMakePresets.json', '.github/workflows/c-port.yml']
  schedule:
    - cron: '21 */6 * * *'
  workflow_dispatch:
    inputs:
      os:
        description: Platforms
        type: choice
        options: [all, linux]
        default: all

permissions:
  contents: read

concurrency:
  group: c-port-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request' || inputs.os == 'linux') && '[{"os":"linux","arch":"amd64","runner":"ubuntu-24.04"},{"os":"linux","arch":"arm64","runner":"ubuntu-24.04-arm"}]' || '[{"os":"linux","arch":"amd64","runner":"ubuntu-24.04"},{"os":"linux","arch":"arm64","runner":"ubuntu-24.04-arm"},{"os":"darwin","arch":"amd64","runner":"macos-15-intel"},{"os":"darwin","arch":"arm64","runner":"macos-15"},{"os":"windows","arch":"amd64","runner":"windows-2025"},{"os":"windows","arch":"arm64","runner":"windows-11-arm"}]') }}
    # Windows builds the mingw-w64 ABI (what ms links programs with) inside MSYS2's CLANG64 or CLANGARM64 shell, which also
    # brings the perl and make pair OpenSSL's Configure needs.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.artifacts/ccache
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'macOS'
        run: brew install ninja ccache
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.arch == 'arm64' && 'CLANGARM64' || 'CLANG64' }}
          update: false
          install: >-
            ${{ matrix.arch == 'arm64' && 'mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-cmake mingw-w64-clang-aarch64-ninja mingw-w64-clang-aarch64-ccache perl make' || 'mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-ccache perl make' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build ccache
      - uses: actions/cache@v6
        with:
          path: ${{ matrix.os == 'windows' && format('{0}/.artifacts/ccache', github.workspace) || runner.os == 'macOS' && '~/Library/Caches/ccache' || '~/.cache/ccache' }}
          key: ccache-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-${{ matrix.arch }}-
      - shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}
        run: cmake --preset debug
      - shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}
        run: cmake --build --preset debug
      - shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}
        run: ctest --preset debug
      - shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}
        run: cmake --build --preset debug --target lint
