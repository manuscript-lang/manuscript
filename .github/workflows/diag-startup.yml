# Temporary: measures process startup per platform. Not for main.
name: diag-startup
on:
  push:
    branches: [claude/project-thread-3l38mz]
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        leg:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: windows, arch: amd64, runner: windows-2025}
    runs-on: ${{ matrix.leg.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-${{ matrix.leg.os }}-${{ matrix.leg.arch }}-
      - uses: ./.github/actions/rust-env
        with:
          os: ${{ matrix.leg.os }}
          arch: ${{ matrix.leg.arch }}
      - name: Build
        shell: bash
        env:
          RUSTC_WRAPPER: sccache
        run: |
          cargo xtask runtime
          cargo build --locked -p ms-cli
          ls -la target/debug/ | grep -i " ms" || true
      - name: Defender state (read only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled, BehaviorMonitorEnabled, IoavProtectionEnabled | Format-List
          (Get-MpPreference).ExclusionPath
      - name: Time startup
        shell: bash
        run: python .github/diag/startup.py "$PWD/target/debug/ms" "$RUNNER_TEMP/diag"
      - name: Time a release ms
        shell: bash
        env:
          RUSTC_WRAPPER: sccache
        run: |
          cargo build --release --locked -p ms-cli
          python .github/diag/startup.py "$PWD/target/release/ms" "$RUNNER_TEMP/diag-release"
      - name: Which test binaries fail to link without /FORCE:UNRESOLVED
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUSTC_WRAPPER: sccache
        run: |
          cargo build --workspace --all-targets --locked --keep-going 2>&1 | grep -E "^error|LNK2019|LNK2001|could not compile" | sort | uniq -c | sort -rn | head -60 || true
