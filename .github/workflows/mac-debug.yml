# Temporary: a crash report for the macOS HTTP fixture segfaults, from the debug branch only (never merged).
name: mac-debug
on: workflow_dispatch
jobs:
  mac-debug:
    if: github.ref_name == 'claude/project-thread-g8dkvt'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/rust-env
        with:
          os: darwin
          arch: arm64
      - name: Build ms
        run: make build
      - name: Crash report
        run: |
          export TMPDIR="$RUNNER_TEMP/kt"; mkdir -p "$TMPDIR" /tmp/prog
          ( while true; do for f in "$TMPDIR"/manuscript-test-*/program; do [ -f "$f" ] && cp -n "$f" "/tmp/prog/$(basename "$(dirname "$f")")" 2>/dev/null; done; sleep 0.02; done ) &
          cd tests/conformance/fixtures/e2e/stdlib
          for t in fetch http-client-engine; do
            echo "=== $t"
            "$GITHUB_WORKSPACE/target/release/ms" test "$t.ms" 2>&1 | tail -5 || true
          done
          kill %1 2>/dev/null || true
          ls -la /tmp/prog
          for p in /tmp/prog/*; do
            echo "=== lldb $p"
            chmod +x "$p"
            lldb -b -o 'process launch' -o 'bt all' -o 'register read' -o 'disassemble -p -c 6' -- "$p" 2>&1 | tail -80 || true
          done
