name: Test VSCode Extension

on:
  push:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - 'src/**'
  pull_request:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - 'src/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root dependencies
        run: bun install

      - name: Install extension dependencies
        run: bun install
        working-directory: vscode-extension

      - name: Build extension
        run: bun run build
        working-directory: vscode-extension

      - name: Run extension tests with coverage
        run: bun test tests/ --coverage --coverage-reporter=lcov --coverage-dir=coverage
        working-directory: vscode-extension

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-coverage-report
          path: vscode-extension/coverage/

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: bun install

      - name: Install extension dependencies
        run: bun install
        working-directory: vscode-extension

      - name: Build extension
        run: bun run build
        working-directory: vscode-extension

      - name: Package extension
        run: bun run package
        working-directory: vscode-extension

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-vscode-extension
          path: vscode-extension/*.vsix
