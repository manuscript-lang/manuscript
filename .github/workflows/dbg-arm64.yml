name: dbg-arm64
on:
  push:
    branches: [claude/project-thread-so2t7e]
jobs:
  dbg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: |
          dest="$RUNNER_TEMP/llvm-bundle/install"
          sh scripts/fetch-lld.sh darwin arm64 "$dest"
          echo "MS_LLD=$dest/bin/lld" >> "$GITHUB_ENV"
      - run: cargo build --locked -p ms-cli -p ms-conform 2>&1 | tail -30; ls target/debug | head -20
      - run: |
          for n in 5 7 6; do
            f=tests/conformance/fixtures/snippets/tests-e2e-testfaultsourcelocations-$n.ms
            echo "=== $n"; ./target/debug/ms run $f < /dev/null 2>&1 | head -40
          done
        continue-on-error: true
      - run: |
          ./target/debug/ms-conform run --ms $PWD/target/debug/ms --phase run --id snippets/tests-e2e-testfaultsourcelocations-5 --id snippets/tests-e2e-testfaultsourcelocations-7 2>&1 | head -80
        continue-on-error: true
