name: CI

# Build ms with CMake, run the unit tests, lint, and replay the conformance corpus with the ms just built.
#   pull request   the two Linux legs (amd64, arm64).
#   main           every six hours, all six platforms; this also warms the caches pull requests restore.
#   manual         all six platforms, or the Linux two.
on:
  pull_request:
    paths: ['src/**', 'cmake/**', 'stdlib/**', 'tests/**', 'tools/**', 'CMakeLists.txt', 'CMakePresets.json', '.github/**']
  schedule:
    - cron: '21 */6 * * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms
        type: choice
        options: [all, linux]
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.artifacts/ccache

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Windows runs inside the MSYS2 shell, which the toolchain step installs; every other step is one line.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request' || inputs.platforms == 'linux') && '[{"os":"linux","arch":"amd64","runner":"ubuntu-24.04","shell":"bash"},{"os":"linux","arch":"arm64","runner":"ubuntu-24.04-arm","shell":"bash"}]' || '[{"os":"linux","arch":"amd64","runner":"ubuntu-24.04","shell":"bash"},{"os":"linux","arch":"arm64","runner":"ubuntu-24.04-arm","shell":"bash"},{"os":"darwin","arch":"amd64","runner":"macos-15-intel","shell":"bash"},{"os":"darwin","arch":"arm64","runner":"macos-15","shell":"bash"},{"os":"windows","arch":"amd64","runner":"windows-2025","shell":"msys2 {0}"},{"os":"windows","arch":"arm64","runner":"windows-11-arm","shell":"msys2 {0}"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: ctest --preset debug
      - run: cmake --build --preset debug --target lint
      - run: cmake --build --preset debug --target conform
      - if: always()
        uses: ./.github/actions/save-caches
