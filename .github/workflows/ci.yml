name: CI

# Build ms with CMake, run the unit tests, lint, and replay the conformance corpus with the ms just built; build the
# book and check the repository rules. Require `Platform checks`.
#   pull request   the two Linux legs (amd64, arm64), the book and the repository checks, and the time budget.
#   main           every six hours: all six platforms; this also warms the caches pull requests restore, and
#                  publishes the book to Pages.
#   manual         on main: all six platforms, or the Linux two; on any other branch always the Linux two, so a branch run
#                  cannot queue macOS and Windows runners (the platform fixes land on main).
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '21 */6 * * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms
        type: choice
        options: [all, linux]
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.artifacts/ccache
  # The corpus runner prints expected and observed for each failure.
  CONFORM_DIFF: '1'
  PR: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Windows runs inside the MSYS2 shell, which the toolchain step installs; every other step is one line.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'merge_group' || inputs.platforms == 'linux' || github.ref != 'refs/heads/main') && '[{"os":"linux","arch":"amd64","runner":"ubuntu-24.04","shell":"bash"},{"os":"linux","arch":"arm64","runner":"ubuntu-24.04-arm","shell":"bash"}]' || '[{"os":"linux","arch":"amd64","runner":"ubuntu-24.04","shell":"bash"},{"os":"linux","arch":"arm64","runner":"ubuntu-24.04-arm","shell":"bash"},{"os":"darwin","arch":"amd64","runner":"macos-15-intel","shell":"bash"},{"os":"darwin","arch":"arm64","runner":"macos-15","shell":"bash"},{"os":"windows","arch":"amd64","runner":"windows-2025","shell":"msys2 {0}"},{"os":"windows","arch":"arm64","runner":"windows-11-arm","shell":"msys2 {0}"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - run: cmake --preset ci
      - run: cmake --build --preset ci
      - run: ctest --preset ci
      - run: cmake --build --preset ci --target lint
      - run: cmake --build --preset ci --target repo-check
      # Each check reports on its own: a lint violation does not hide the corpus counts.
      - if: ${{ !cancelled() }}
        run: cmake --build --preset ci --target conform
      - if: always()
        uses: ./.github/actions/save-caches

  # The design book: the generated reference and the site, checked, and on main the artifact Pages publishes.
  # The reference is still generated by the Rust ms-docgen, so this job runs on main and by hand only, not on
  # pull requests, until it is ported to Manuscript (#6380); Pages publishes only when it passes.
  docs:
    name: docs
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.146.7'
          extended: true
      - run: make book-check
      - run: make book
      - run: node --test tests/docs/publication.test.cjs
      # Older releases keep their own book: each version listed in website/data/docs_versions.toml has a
      # manuscript-docs archive on its release (built by release.yml), unpacked here.
      - if: env.PR != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for version in $(sed -n 's/^version = "\(.*\)"$/\1/p' website/data/docs_versions.toml); do
            mkdir -p ".artifacts/book/versions/v${version}"
            gh release download "v${version}" --repo "$GITHUB_REPOSITORY" --pattern "manuscript-docs-${version}.tar.gz" --output - | tar -xz -C ".artifacts/book/versions/v${version}"
          done
      - if: env.PR != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/book

  # The VS Code extension package.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - working-directory: extensions/vscode
        run: npm ci && npm run package -- --allow-missing-repository
      - uses: actions/upload-artifact@v7
        with:
          name: manuscript-vscode
          path: extensions/vscode/*.vsix

  # The pull request time budget (AGENTS.md, wiki/repository/pull-request-ci-has-a-ten-minute-budget.md): each
  # Linux build job of a pull request finishes in under 10 minutes. `Platform checks` requires it, so an
  # over-budget pull request cannot merge.
  budget:
    name: Time budget
    needs: [build]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    env:
      BUDGET_SECONDS: '600'
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          over=0
          while read -r name seconds; do
            echo "$name: ${seconds}s of ${BUDGET_SECONDS}s"
            if [ "$seconds" -gt "$BUDGET_SECONDS" ]; then over=1; fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name | startswith("linux-")) | "\(.name | gsub(" "; "_")) \((.completed_at | fromdate) - (.started_at | fromdate))"')
          if [ "$over" = 1 ]; then
            echo "::error::A pull request job is over the ${BUDGET_SECONDS}s budget: cut a test or a step (see AGENTS.md)."
            exit 1
          fi

  # The sum of the jobs above, one name for a ruleset to require.
  platforms:
    name: Platform checks
    needs: [build, checks, budget]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  pages:
    name: Publish Pages docs
    needs: [docs]
    # Only main (the scheduled run, or a manual run on it) publishes.
    if: ${{ !cancelled() && needs.docs.result == 'success' && github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deploy
        uses: actions/deploy-pages@v5
