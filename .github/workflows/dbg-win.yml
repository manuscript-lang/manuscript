name: dbg-win
on:
  workflow_dispatch:
  push:
    branches: [dbg-win-1557]
permissions:
  contents: read
jobs:
  dbg:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/sccache
        with:
          prefix: cargo-sccache-windows-amd64-
      - run: printf '%s\n' "TMPDIR=$RUNNER_TEMP" "TMP=$RUNNER_TEMP" "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - shell: pwsh
        run: |
          rustup set default-host x86_64-pc-windows-msvc
          $l = Join-Path $env:VCToolsInstallDir ('bin/Host{0}/{1}/link.exe' -f $env:VSCMD_ARG_HOST_ARCH, $env:VSCMD_ARG_TGT_ARCH)
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$l" >> $env:GITHUB_ENV
      - run: echo 'CC=clang' >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-toolchain
        with:
          os: windows
          arch: amd64
      - run: cargo xtask runtime
      - run: cargo build --locked -p ms-cli
      - name: Cases
        run: |
          set +e
          run() { # label build-type file
            rm -f trace.txt dbg.log
            target/debug/ms.exe build "$3" -o prog.exe --build-type "$2" > build.txt 2>&1
            start=$(date +%s)
            timeout 30 ./prog.exe > out.txt 2>&1
            code=$?
            echo "CASE $1 $2 code=$code secs=$(( $(date +%s) - start ))" >> summary.txt
            grep -n "\[wd\]" dbg.log | tail -60 | cut -c1-70 >> summary.txt
            tail -14 trace.txt 2>/dev/null | cut -c1-60 | sed "s/^/  t: /" >> summary.txt
            echo "END CASE $1 code=$code" >> summary.txt
          }
          run v6 Debug dbg/win/v6_two_servers_fast.ms
          nm=$(find "$XDG_CACHE_HOME/ms/llvm" -iname 'llvm-nm*' | head -1)
          echo "nm=$nm" >> summary.txt
          "$nm" --numeric-sort prog.exe > syms.txt 2>/dev/null
          echo "syms: $(wc -l < syms.txt)" >> summary.txt
          for off in $(grep -o 'pc=+[0-9a-f]*\|ret=+[0-9a-f]*' dbg.log | sed 's/.*+//' | sort -u | head -60); do
            addr=$(printf '%016x' $((0x140000000 + 0x$off)))
            awk -v a="$addr" '$1 <= a { last=$0 } $1 > a { print "  sym " last; exit }' syms.txt >> summary.txt
          done
          exit 0
      - name: Summary
        if: always()
        run: cat summary.txt
