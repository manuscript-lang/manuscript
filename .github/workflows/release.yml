name: Manuscript distributions

on:
  push:
    tags: ['v*']
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distributions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests package and verify linux/amd64 only; the merge queue, manual
  # runs, and tags cover all six targets.
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"linux","arch":"amd64"}]' || '[{"os":"linux","arch":"amd64"},{"os":"linux","arch":"arm64"},{"os":"darwin","arch":"amd64"},{"os":"darwin","arch":"arm64"},{"os":"windows","arch":"amd64"},{"os":"windows","arch":"arm64"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "${RELEASE_TAG#v}" = "$(cat .msversion)"
      - name: Build self-contained archive
        run: sh scripts/package.sh "${{ matrix.os }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: manuscript-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  verify:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"linux","arch":"amd64","runner":"ubuntu-24.04"}]' || '[{"os":"linux","arch":"amd64","runner":"ubuntu-24.04"},{"os":"linux","arch":"arm64","runner":"ubuntu-24.04-arm"},{"os":"darwin","arch":"amd64","runner":"macos-15-intel"},{"os":"darwin","arch":"arm64","runner":"macos-15"},{"os":"windows","arch":"amd64","runner":"windows-2025"},{"os":"windows","arch":"arm64","runner":"windows-11-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # Go runs the test harness only; the packaged CLI receives no host Go PATH.
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: manuscript-${{ matrix.os }}-${{ matrix.arch }}
          path: archives
      - name: Extract distribution into a path containing spaces
        shell: bash
        run: |
          mkdir -p 'extracted distribution'
          if [ '${{ matrix.os }}' = windows ]; then
            unzip -q archives/*.zip -d 'extracted distribution'
          else
            tar -xzf archives/*.tar.gz -C 'extracted distribution'
          fi
      - name: Verify standalone compilation and tooling without system Go
        shell: bash
        run: go run ./scripts/distcheck 'extracted distribution/manuscript-${{ matrix.os }}-${{ matrix.arch }}'

  test:
    name: Distribution checks
    needs: [package, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all packages and standalone verifications
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$PACKAGE_RESULT" = success && test "$VERIFY_RESULT" = success

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: manuscript-*
          path: dist
          merge-multiple: true
      - name: Publish verified release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
