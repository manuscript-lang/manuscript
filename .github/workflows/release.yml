name: Manuscript distributions

on:
  push:
    tags: ['v*']
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distributions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # All six targets are built in one job, in parallel after one shared SDK
  # download, so the check list stays short; verification below stays per native OS.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "${RELEASE_TAG#v}" = "$(cat .msversion)"
      - name: Build self-contained archives and cross-build verifiers
        run: |
          sh scripts/bootstrap-go.sh
          mkdir -p verifier
          pids=''
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            (
              sh scripts/package.sh "$os" "$arch"
              ext=''
              if [ "$os" = windows ]; then ext=.exe; fi
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 GOTOOLCHAIN=local GOENV=off GOROOT="$PWD/toolchain/go" \
                toolchain/go/bin/go build -mod=vendor -trimpath -o "verifier/distcheck-$os-$arch$ext" ./scripts/distcheck
            ) > "package-$os-$arch.log" 2>&1 &
            pids="$pids $!"
          done
          status=0
          for pid in $pids; do wait "$pid" || status=1; done
          for log in package-*.log; do echo "::group::$log"; cat "$log"; echo '::endgroup::'; done
          exit "$status"
      - uses: actions/upload-artifact@v7
        with:
          name: manuscript-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: distcheck
          path: verifier/
          if-no-files-found: error

  verify:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: windows
            arch: amd64
            runner: windows-2025
          - os: windows
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: manuscript-dist
          path: archives
      - uses: actions/download-artifact@v8
        with:
          name: distcheck
          path: verifier
      - name: Extract distribution into a path containing spaces
        run: |
          mkdir -p 'extracted distribution'
          if [ '${{ matrix.os }}' = windows ]; then
            unzip -q archives/manuscript-${{ matrix.os }}-${{ matrix.arch }}.zip -d 'extracted distribution'
          else
            tar -xzf archives/manuscript-${{ matrix.os }}-${{ matrix.arch }}.tar.gz -C 'extracted distribution'
          fi
      # Runs with no Go on PATH from the workflow; the packaged CLI is all it uses.
      - name: Verify standalone compilation and tooling without system Go
        run: |
          verifier=verifier/distcheck-${{ matrix.os }}-${{ matrix.arch }}
          if [ '${{ matrix.os }}' = windows ]; then verifier=$verifier.exe; fi
          chmod +x "$verifier"
          "./$verifier" 'extracted distribution/manuscript-${{ matrix.os }}-${{ matrix.arch }}'

  test:
    name: Distribution checks
    needs: [package, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all packages and standalone verifications
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$PACKAGE_RESULT" = success && test "$VERIFY_RESULT" = success

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: manuscript-*
          path: dist
          merge-multiple: true
      - name: Publish verified release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
