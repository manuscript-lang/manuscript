name: Manuscript distributions

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distributions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Distribution checks
    needs: dist
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every distribution on a release tag
        env:
          DIST_RESULT: ${{ needs.dist.result }}
        run: |
          case "$DIST_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac

  # The shipped binary is the C `ms`: dist.yml builds, packages and smoke-tests it
  # on a native runner of each of the six targets, and every target gates on a tag.
  dist:
    name: Distributions
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/dist.yml

  # Plain list loops must keep vectorizing: the release's own `ms` runs the benchmark and the
  # table is kept with the run, to compare against the committed result page.
  listloops:
    name: List loop benchmark
    needs: dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: manuscript-linux-amd64
          path: dist
      - name: Run bench/perf/listloops
        run: |
          set -eu
          tar -xzf dist/manuscript-linux-amd64.tar.gz -C dist
          ms="$PWD/dist/manuscript-linux-amd64/bin/ms"
          MS="$ms" "$ms" run bench/perf/tools/listloops.ms -- 5 | tee listloops.txt
      - uses: actions/upload-artifact@v7
        with:
          name: listloops-${{ github.ref_name }}
          path: listloops.txt

  publish:
    needs: dist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: manuscript-*
          path: dist
          merge-multiple: true
      - name: Publish release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes

  # The Pages site always shows the newest book. This job keeps the book of each release as an
  # archive on that release; cicd.yml unpacks the archives that website/data/docs_versions.toml
  # lists under versions/v<version>/ when it publishes Pages.
  docs:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.146.7'
          extended: true
      - name: Build the book for this release and attach it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          make book BOOK_BASEURL="https://manuscript-lang.github.io/manuscript/versions/${RELEASE_TAG}/"
          archive="manuscript-docs-${RELEASE_TAG#v}.tar.gz"
          tar -C .artifacts/book -czf "$archive" .
          gh release upload "$RELEASE_TAG" "$archive" --clobber

  # The agent skill ships on its own, apart from `ms`: the skill files from the tagged source, packed
  # under one stable name so releases/latest/download/manuscript-skill.tar.gz always works.
  skill:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Pack the skill and attach it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          sh cmake/toolchain/package-skill.sh skill-dist
          gh release upload "$RELEASE_TAG" skill-dist/manuscript-skill.tar.gz skill-dist/manuscript-skill.tar.gz.sha256 --clobber
