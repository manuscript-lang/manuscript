name: Manuscript distributions

on:
  push:
    tags: ['v*']
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distributions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Distribution checks
    needs: rust
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Rust distribution on a release tag
        env:
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          case "$RUST_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac

  # The shipped binary is the Rust `ms`: rust-dist.yml builds, packages and smoke-tests it
  # on a native runner of each of the six targets, and every target gates on a tag.
  rust:
    name: Rust distributions
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/rust-dist.yml

  publish:
    needs: rust
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: manuscript-rust-*
          path: dist
          merge-multiple: true
      - name: Publish Rust release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
