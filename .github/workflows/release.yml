name: Manuscript distributions

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.go-version'
      - 'scripts/**'
      - 'toolchain_*.go'
      - 'compiler/**'
      - 'project/**'
      - 'internal/cli/**'
      - 'checker/**'
      - 'lexer/**'
      - 'parser/**'
      - 'syntax/**'
      - 'runtime/**'
      - 'stdlib/**'
      - 'tooling/**'
      - 'cmd/ms/**'
      - 'native_bundle.go'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'examples/hello/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained archive
        run: sh scripts/package.sh "${{ matrix.os }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  verify:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: windows
            arch: amd64
            runner: windows-2025
          - os: windows
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Go runs the test harness only; the packaged CLI receives no host Go PATH.
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: manuscript-${{ matrix.os }}-${{ matrix.arch }}
          path: archives
      - name: Extract distribution into a path containing spaces
        shell: bash
        run: |
          mkdir -p 'extracted distribution'
          if [ '${{ matrix.os }}' = windows ]; then
            unzip -q archives/*.zip -d 'extracted distribution'
          else
            tar -xzf archives/*.tar.gz -C 'extracted distribution'
          fi
      - name: Verify standalone compilation and tooling without system Go
        shell: bash
        run: go run ./scripts/distcheck 'extracted distribution/manuscript-${{ matrix.os }}-${{ matrix.arch }}'

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: manuscript-*
          path: dist
          merge-multiple: true
      - name: Publish verified release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
