version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # cranelift-codegen is vendored with a local patch (vendor/cranelift-codegen/PATCH.md), so the
    # cranelift crates move together by hand.
    ignore:
      - dependency-name: 'cranelift-*'
    groups:
      rust-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /extensions/vscode
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      extension-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
