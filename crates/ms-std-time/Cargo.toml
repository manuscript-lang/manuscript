[package]
name = "ms-std-time"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Zone database seam for the C @std/time natives"

[lib]
crate-type = ["rlib"]

[dependencies]
ms-rt-abi = { path = "../ms-rt-abi" }
ms-rt = { path = "../ms-rt" }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }

[lints]
workspace = true

