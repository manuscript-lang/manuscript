[package]
name = "ms-std-time"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript standard-library natives for @std/time"
autotests = false

[lib]
crate-type = ["rlib"]

[dependencies]
ms-rt-abi = { path = "../ms-rt-abi" }
ms-rt = { path = "../ms-rt" }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }

[lints]
workspace = true


[[test]]
name = "it"
path = "tests/main.rs"
