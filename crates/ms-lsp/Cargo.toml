[package]
name = "ms-lsp"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript language server: JSON-RPC transport, document analysis, navigation, completion and refactoring over the Rust checker"

[lints]
workspace = true

[dependencies]
ms-json = { path = "../ms-json" }
ms-syntax = { path = "../ms-syntax" }
ms-check = { path = "../ms-check" }
ms-project = { path = "../ms-project" }
ms-driver = { path = "../ms-driver" }
ms-tooling = { path = "../ms-tooling" }

[dev-dependencies]
ms-rt = { path = "../ms-rt" }

# The workspace-unified `ffi` feature of ms-std-decimal references msrt_* symbols that MSVC
# resolves before discarding unused code.
[target.'cfg(windows)'.dependencies]
ms-rt = { path = "../ms-rt" }
