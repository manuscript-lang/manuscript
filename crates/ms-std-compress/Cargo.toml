[package]
name = "ms-std-compress"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Native implementation of @std/compress.ms (gzip, zlib, raw deflate)"

[dependencies]
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
ms-rt-abi = { path = "../ms-rt-abi" }
ms-std-core = { path = "../ms-std-core" }

[dev-dependencies]
ms-rt = { path = "../ms-rt", features = ["std"] }

[lints]
workspace = true
