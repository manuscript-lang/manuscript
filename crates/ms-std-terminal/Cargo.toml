[package]
name = "ms-std-terminal"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript standard-library natives for @std/terminal (capability and size queries over libc)"

[lib]
crate-type = ["rlib"]

[dependencies]
ms-rt-abi = { path = "../ms-rt-abi" }
ms-std-rt = { path = "../ms-std-rt" }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[dev-dependencies]
ms-rt = { path = "../ms-rt" }

[lints]
workspace = true
