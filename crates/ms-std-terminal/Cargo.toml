[package]
name = "ms-std-terminal"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript standard-library natives for @std/terminal (capability and size queries over rustix)"

[lib]
crate-type = ["rlib"]

[dependencies]
ms-rt-abi = { path = "../ms-rt-abi" }
ms-std-core = { path = "../ms-std-core" }
ms-std-rt = { path = "../ms-std-rt" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["termios", "stdio", "event", "time"] }

[dev-dependencies]
ms-rt = { path = "../ms-rt" }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "termios", "stdio", "event", "time", "pty", "pipe"] }

[lints]
workspace = true
