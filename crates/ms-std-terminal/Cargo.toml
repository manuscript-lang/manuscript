[package]
name = "ms-std-terminal"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript standard-library natives for @std/io (capability and size queries over rustix)"

[lib]
crate-type = ["rlib"]

[dependencies]
ms-rt-abi = { path = "../ms-rt-abi" }
ms-rt = { path = "../ms-rt" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["termios", "stdio", "event", "time"] }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "termios", "stdio", "event", "time", "pty", "pipe"] }

[lints]
workspace = true
