[package]
name = "ms-std-random"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Native implementation of @std/random.ms"

[dependencies]
getrandom = { version = "0.4", default-features = false, features = ["sys_rng"] }
ms-rt-abi = { path = "../ms-rt-abi" }
ms-std-core = { path = "../ms-std-core" }

[dev-dependencies]
ms-rt = { path = "../ms-rt", features = ["std"] }

[lints]
workspace = true
