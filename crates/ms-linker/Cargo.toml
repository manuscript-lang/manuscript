[package]
name = "ms-linker"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "The bytes `ms build` links with: the pinned lld, the LLVM tools and the platform startup files and libraries, embedded at build time"
build = "build.rs"

# The LLVM tools (opt, llc) are embedded gzipped and unpacked on first use.
[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
