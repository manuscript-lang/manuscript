[package]
name = "ms-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "The ms command line: dispatch, options, help and exit codes"

[lints]
workspace = true

[lib]
name = "ms_cli"

[[bin]]
name = "ms"
path = "src/main.rs"

[dependencies]
ms-json = { path = "../ms-json" }
ms-project = { path = "../ms-project" }
ms-driver = { path = "../ms-driver" }
ms-mir = { path = "../ms-mir" }
ms-syntax = { path = "../ms-syntax" }
ms-guide = { path = "../ms-guide" }
ms-lsp = { path = "../ms-lsp" }
ms-tooling = { path = "../ms-tooling" }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "unicode-gencat", "unicode-script", "unicode-bool", "unicode-age", "unicode-segment"] }

[dev-dependencies]
ms-rt = { path = "../ms-rt" }
ms-check = { path = "../ms-check" }

[target.'cfg(unix)'.dev-dependencies]
libc = { version = "0.2", default-features = false }

# The workspace-unified `ffi` feature of ms-std-decimal references msrt_* symbols that MSVC
# resolves before discarding unused code.
[target.'cfg(windows)'.dependencies]
ms-rt = { path = "../ms-rt" }
