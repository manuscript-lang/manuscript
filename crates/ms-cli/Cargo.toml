[package]
name = "ms-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "The ms command line: dispatch, options, help and exit codes"

[lints]
workspace = true

[lib]
name = "ms_cli"

[[bin]]
name = "ms"
path = "src/main.rs"

[dependencies]
ms-check = { path = "../ms-check" }
ms-json = { path = "../ms-json" }
ms-driver = { path = "../ms-driver" }
ms-build = { path = "../ms-build" }
ms-mir = { path = "../ms-mir" }
ms-syntax = { path = "../ms-syntax" }
ms-lsp = { path = "../ms-lsp" }
ms-tooling = { path = "../ms-tooling" }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "unicode-gencat", "unicode-script", "unicode-bool", "unicode-age", "unicode-segment"] }

flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[build-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
ms-clif = { path = "../ms-clif" }
ms-rt = { path = "../ms-rt" }
object = { version = "0.40", default-features = false, features = ["read_core", "archive", "elf", "macho", "coff"] }

[target.'cfg(unix)'.dev-dependencies]
libc = { version = "0.2", default-features = false }
