[package]
name = "ms-std-fs"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript standard-library natives for @std/fs (path-based operations over Rust std)"

[lib]
crate-type = ["rlib"]

[dependencies]
ms-rt-abi = { path = "../ms-rt-abi" }
ms-std-core = { path = "../ms-std-core" }
ms-std-rt = { path = "../ms-std-rt" }
ms-std-path = { path = "../ms-std-path" }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints]
workspace = true

[dev-dependencies]
ms-rt = { path = "../ms-rt" }
