[package]
name = "ms-clif"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript native backend: lowers MIR to Cranelift, emits an object file, links it (the bundled lld on Linux and macOS, the system toolchain on Windows)"

[dependencies]
ms-mir = { path = "../ms-mir" }
ms-rt-abi = { path = "../ms-rt-abi" }
cranelift-codegen = "=0.136.0"
cranelift-frontend = "=0.136.0"
cranelift-module = "=0.136.0"
cranelift-object = "=0.136.0"
cranelift-native = "=0.136.0"
target-lexicon = "0.13"
gimli = { version = "=0.34.0", default-features = false, features = ["write", "read", "std"] }

[dev-dependencies]
# Exercise both supported architectures on every host, including ELF, Mach-O and COFF emission.
cranelift-codegen = { version = "=0.136.0", features = ["x86", "arm64"] }
# Exercise SDK stub ownership with tiny Mach-O objects on every host.
object = { version = "0.40", default-features = false, features = ["std", "read_core", "archive", "macho", "write_core"] }

# Reads Mach-O objects and archives to generate the macOS SDK stubs.
[target.'cfg(target_os = "macos")'.dependencies]
object = { version = "0.40", default-features = false, features = ["read_core", "archive", "macho"] }

# Writes the ELF objects that become the glibc link-time stubs.
[target.'cfg(target_os = "linux")'.dependencies]
object = { version = "0.40", default-features = false, features = ["std", "write_core", "elf"] }

# lld and the LLVM tools are downloaded on first use rather than embedded.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
sha2 = { version = "0.11", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
httparse = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
