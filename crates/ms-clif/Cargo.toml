[package]
name = "ms-clif"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript Cranelift backend: lowers MIR to an object file (linking lives in ms-build)"
autotests = false

[dependencies]
ms-mir = { path = "../ms-mir" }
ms-rt-abi = { path = "../ms-rt-abi" }
cranelift-codegen = "=0.136.0"
cranelift-frontend = "=0.136.0"
cranelift-module = "=0.136.0"
cranelift-object = "=0.136.0"
cranelift-native = "=0.136.0"
target-lexicon = "0.13"
gimli = { version = "=0.34.0", default-features = false, features = ["write", "read", "std"] }

[dev-dependencies]
# Release-build tests compile through the LLVM driver in `ms-build`.
ms-build = { path = "../ms-build" }
# The reference interpreter is the oracle for native-code tests.
ms-mir = { path = "../ms-mir", features = ["test-support"] }
# Exercise both supported architectures on every host, including ELF, Mach-O and COFF emission.
cranelift-codegen = { version = "=0.136.0", features = ["x86", "arm64"] }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/main.rs"
