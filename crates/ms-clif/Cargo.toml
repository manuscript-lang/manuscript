[package]
name = "ms-clif"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript native backend: lowers MIR to Cranelift, emits an object file, links with the system toolchain"

[dependencies]
ms-mir = { path = "../ms-mir" }
ms-rt-abi = { path = "../ms-rt-abi" }
cranelift-codegen = "=0.136.3"
cranelift-frontend = "=0.136.3"
cranelift-module = "=0.136.3"
cranelift-object = "=0.136.3"
cranelift-native = "=0.136.3"
target-lexicon = "0.13"
gimli = { version = "=0.34.0", default-features = false, features = ["write", "std"] }

[lints]
workspace = true
