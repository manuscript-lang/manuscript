[package]
name = "ms-std-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Native implementation of @std/math, @std/os/random.ms and the Base64 part of @std/data/encoding.ms"

[lib]
crate-type = ["rlib"]

[dependencies]
getrandom = { version = "0.4", default-features = false, features = ["sys_rng"] }
ms-rt-abi = { path = "../ms-rt-abi" }
ms-rt = { path = "../ms-rt" }

[lints]
workspace = true
