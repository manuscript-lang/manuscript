[package]
name = "ms-std-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Small native math, random, encoding and checksum operations"

[lib]
crate-type = ["rlib"]

[dependencies]
getrandom = { version = "0.4", default-features = false, features = ["sys_rng"] }
libm = { version = "0.2", default-features = false }
ms-rt-abi = { path = "../ms-rt-abi" }
ms-rt = { path = "../ms-rt" }

[lints]
workspace = true
