[package]
name = "ms-std-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Native implementation of @std/math, @std/os/random.ms and byte encodings"

[lib]
crate-type = ["rlib"]

[dependencies]
crabmole = { version = "0.1.8", default-features = false, features = ["ascii85"] }
data-encoding = { version = "2.11.1", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4", default-features = false, features = ["sys_rng"] }
ms-rt-abi = { path = "../ms-rt-abi" }
ms-rt = { path = "../ms-rt" }

[lints]
workspace = true
