[package]
name = "ms-rt"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript native runtime: allocator, reference counting, strings, collections, faults, profiler"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# Allocation counters (always on in unit tests).
stats = []

[dependencies]
ms-rt-abi = { path = "../ms-rt-abi" }
ms-std-rt = { path = "../ms-std-rt" }
ms-std-math = { path = "../ms-std-math" }
ms-std-time = { path = "../ms-std-time" }
ms-std-fs = { path = "../ms-std-fs" }
ms-std-io = { path = "../ms-std-io" }
ms-std-process = { path = "../ms-std-process" }
unicode-normalization = { version = "0.1.24", default-features = false }

[lints]
workspace = true
