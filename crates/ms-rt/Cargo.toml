[package]
name = "ms-rt"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript native runtime: allocator, reference counting, strings, collections, faults, profiler"

[lib]
crate-type = ["rlib"]

[features]
# Allocation counters (always on in unit tests).
stats = []

[dependencies]
memchr = "2.8.3"
ms-rt-abi = { path = "../ms-rt-abi" }
ms-rt-hot = { path = "../ms-rt-hot" }
mio = { version = "1", default-features = false, features = ["os-poll", "os-ext", "net"] }
unicode-normalization = { version = "0.1.24", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[lints]
workspace = true
