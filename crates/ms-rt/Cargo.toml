[package]
name = "ms-rt"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript native runtime: allocator, reference counting, strings, collections, faults, profiler"

[lib]
crate-type = ["rlib"]

[features]
# Allocation counters (always on in unit tests).
stats = []
# Allocation sampling for `ms profile --allocs`: one countdown per allocation. Off in the default
# runtime, which pays nothing; release packaging builds a second archive with it.
alloc-profile = []
# The scheduler stress mode: with `MS_SCHED_STRESS` set, a promise never starts on its creator. Off in the
# shipped runtime, which does not read the variable; `make stress-sched` builds a runtime with it.
sched-stress = []

[dependencies]
memchr = "2.8.3"
ms-rt-abi = { path = "../ms-rt-abi" }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[lints]
workspace = true

