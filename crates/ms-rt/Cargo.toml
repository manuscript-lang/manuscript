[package]
name = "ms-rt"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript native runtime: allocator, reference counting, strings, collections, faults, profiler"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
# Default build is freestanding (`no_std` over libc) and defines the panic
# handler, which is what the staticlib needs. `std` links the standard library
# instead (no panic handler), for Rust crates that embed the runtime as an rlib.
std = []
# Allocation counters (always on in unit tests).
stats = []

[dependencies]
ms-rt-abi = { path = "../ms-rt-abi" }
unicode-normalization = { version = "0.1.24", default-features = false }

[lints]
workspace = true
