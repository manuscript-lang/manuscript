[package]
name = "ms-std-process"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript standard-library natives for @std/process (process control and child processes over libc)"

[lib]
crate-type = ["rlib"]

[dependencies]
ms-rt-abi = { path = "../ms-rt-abi" }
ms-std-rt = { path = "../ms-std-rt" }
ms-std-fs = { path = "../ms-std-fs" }
ms-std-io = { path = "../ms-std-io" }
libc = { version = "0.2", default-features = false }

[lints]
workspace = true
