[package]
name = "ms-std-net"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript native standard library: net, tls, http, websocket"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ms-rt-abi = { path = "../ms-rt-abi" }
ms-std-core = { path = "../ms-std-core" }
rustix = { version = "1", default-features = false, features = ["std", "event", "net", "fs", "time"] }
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
ms-rt = { path = "../ms-rt", features = ["std"] }

[lints]
workspace = true
