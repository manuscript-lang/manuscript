[package]
name = "ms-std-net"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript native standard library: net, tls, http, websocket"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ms-rt-abi = { path = "../ms-rt-abi" }
ms-std-core = { path = "../ms-std-core" }
socket2 = { version = "0.6", features = ["all"] }

rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-native-certs = "0.8"
x509-parser = { version = "0.18", features = ["verify"] }
base64 = "0.22"
httparse = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
psl = "2"
ring = "0.17"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "event", "net", "fs", "time", "pipe"] }
mio = { version = "1", default-features = false, features = ["os-poll", "os-ext"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }

[dev-dependencies]
ms-rt = { path = "../ms-rt" }

[lints]
workspace = true
