[package]
name = "ms-std-decimal"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Native implementation of @std/decimal.ms (exact decimals of at most 34 significant digits)"

[features]
default = ["ffi"]
# The C ABI shims. The compiler uses the crate without them, to fold literals.
ffi = ["dep:ms-std-core"]

[dependencies]
ms-std-core = { path = "../ms-std-core", optional = true }
num-bigint = { version = "0.4", default-features = false }
num-integer = { version = "0.1", default-features = false }
num-traits = { version = "0.2", default-features = false }

[dev-dependencies]
ms-rt = { path = "../ms-rt", features = ["std"] }

[lints]
workspace = true
