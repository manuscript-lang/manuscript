[package]
name = "ms-build"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript back end: lowering seam, optimization, native codegen and linking"
autotests = false

[lints]
workspace = true

[dependencies]
ms-check = { path = "../ms-check" }
ms-mir = { path = "../ms-mir" }
ms-clif = { path = "../ms-clif" }
object = { version = "0.40", default-features = false, features = ["std", "read_core", "elf", "macho", "coff"] }
ms-lower = { path = "../ms-lower" }

# Reads Mach-O objects and archives to generate the macOS SDK stubs.
[target.'cfg(target_os = "macos")'.dependencies]
object = { version = "0.40", default-features = false, features = ["read_core", "archive", "macho"] }

# Writes the ELF objects that become the glibc link-time stubs.
[target.'cfg(target_os = "linux")'.dependencies]
object = { version = "0.40", default-features = false, features = ["std", "write_core", "elf"] }

# lld and the LLVM tools are downloaded on first use rather than embedded.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
sha2 = { version = "0.11", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"
httparse = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# Exercise SDK stub ownership with tiny Mach-O objects on every host.
object = { version = "0.40", default-features = false, features = ["std", "read_core", "archive", "macho", "write_core"] }
ms-driver = { path = "../ms-driver" }
ms-syntax = { path = "../ms-syntax" }

[[test]]
name = "it"
path = "tests/main.rs"
