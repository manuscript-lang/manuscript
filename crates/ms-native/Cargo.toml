[package]
name = "ms-native"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "The static library compiled Manuscript programs link: ms-rt plus every ms-std-* native crate in one archive"

[lib]
crate-type = ["staticlib"]
# A test harness would define its own entry points.
test = false
doctest = false

[dependencies]
ms-rt = { path = "../ms-rt" }

[features]
# The runtime with allocation sampling, for `ms profile --allocs` (`cargo xtask runtime --alloc-profile`).
alloc-profile = ["ms-rt/alloc-profile"]
# The runtime with the scheduler stress mode, for `make stress-sched` (`cargo xtask runtime --sched-stress`).
sched-stress = ["ms-rt/sched-stress"]

[dev-dependencies]
ms-rt-abi = { path = "../ms-rt-abi" }

[lints]
workspace = true
