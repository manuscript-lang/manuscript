[package]
name = "ms-std-regex"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Native implementation of @std/string.ms (regex crate syntax)"

[dependencies]
regex = { version = "1", default-features = false, features = ["unicode-case", "unicode-gencat", "unicode-script", "unicode-perl", "unicode-bool", "unicode-age", "unicode-segment", "perf-inline", "perf-literal", "perf-onepass", "perf-backtrack", "perf-dfa"] }
ms-rt-abi = { path = "../ms-rt-abi" }
ms-rt = { path = "../ms-rt" }


[lints]
workspace = true
