[package]
name = "ms-tooling"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Manuscript developer tooling over checked programs: review, diagrams, inspection, agent guide, standard-library search and API documentation"
autotests = false

[lints]
workspace = true

[dependencies]
ms-json = { path = "../ms-json" }
ms-syntax = { path = "../ms-syntax" }
ms-check = { path = "../ms-check" }
ms-driver = { path = "../ms-driver" }

[[bin]]
name = "ms-tooling-dev"
path = "src/bin/ms-tooling-dev.rs"

[[bin]]
name = "ms-docgen"
path = "src/bin/ms-docgen.rs"

[[test]]
name = "it"
path = "tests/main.rs"

[dev-dependencies]
ms-build = { path = "../ms-build" }
