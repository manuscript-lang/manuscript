<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuscript program map</title>
<style>
:root{--bg:#fff;--fg:#1d2330;--mut:#6b7385;--line:#d9dde6;--pan:#f5f7fa;--acc:#2f6fdb;--pure:#dff5e1;--pures:#2a9d3a;--eff:#fff1cc;--effs:#b8860b;--ent:#d6e9ff;--var:#d33;--own:#2a9d3a;--brw:#37b}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--fg:#e6e9f0;--mut:#9aa3b5;--line:#2b3140;--pan:#1b1f2a;--acc:#6aa3ff;--pure:#173a20;--pures:#4cc460;--eff:#3d3213;--effs:#e0b43c;--ent:#17325a;--var:#ff6b6b;--own:#4cc460;--brw:#6aa3ff}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:grid;grid-template-columns:280px 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/3;display:flex;gap:16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0}
nav{display:flex;gap:4px}
nav button{border:1px solid var(--line);background:var(--pan);color:var(--fg);padding:5px 12px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
aside{border-right:1px solid var(--line);overflow:auto;padding:10px;background:var(--pan)}
aside input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.file{font-weight:600;margin:12px 0 2px;color:var(--mut);font-size:12px;cursor:pointer}
.item{padding:2px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item:hover{background:var(--line)} .item.sel{background:var(--acc);color:#fff}
.k{display:inline-block;width:16px;color:var(--mut);font-size:11px}
main{overflow:auto;padding:16px}
#info{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px;background:var(--pan)}
#info code{font:13px ui-monospace,monospace}
.var{color:var(--var);font-weight:700}.brw{color:var(--brw)}.own{color:var(--own);font-weight:600}
.badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;margin-left:4px;background:var(--eff);color:var(--fg);border:1px solid var(--effs)}
.badge.err{border-color:var(--var)}
svg text{fill:var(--fg);font:12px system-ui,sans-serif}
svg .node{cursor:pointer} svg .node rect{stroke-width:1.5}
svg .pure rect{fill:var(--pure);stroke:var(--pures)} svg .effect rect{fill:var(--eff);stroke:var(--effs)}
svg .entry rect{fill:var(--ent);stroke:var(--acc);stroke-width:3} svg .ext rect{fill:var(--bg);stroke:var(--mut);stroke-dasharray:4}
svg .cls rect{fill:var(--pan);stroke:var(--mut)} svg .sel rect{stroke:var(--acc);stroke-width:3}
svg path.edge{fill:none;stroke:var(--mut);stroke-width:1.4} svg .elabel{fill:var(--mut);font-size:11px}
.flow ul{list-style:none;margin:0;padding-left:18px;border-left:1px dashed var(--line)}
.flow>ul{border:0;padding:0}
.flow li{margin:2px 0}
.flow .kind{font-size:11px;padding:0 5px;border-radius:4px;margin-right:6px;background:var(--line);color:var(--fg)}
.kind.try{background:var(--var);color:#fff}.kind.spawn{background:#8a4fd6;color:#fff}.kind.scope{background:var(--effs);color:#fff}.kind.exit{background:var(--mut);color:#fff}.kind.native{background:var(--effs);color:#fff}
.flow code{font:12.5px ui-monospace,monospace}
.flow button{border:0;background:none;color:var(--acc);cursor:pointer;font-size:12px}
.hint{color:var(--mut)} label.chk{margin-left:12px;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header><h1>Manuscript program map</h1>
<nav id="tabs"></nav>
<label class="chk"><input type="checkbox" id="all"> show everything</label>
<label class="chk">depth <input type="range" id="depth" min="1" max="4" value="1"></label></header>
<aside><input id="q" placeholder="Search modules and functions"><div id="list"></div></aside>
<main><div id="info"></div><div id="view"></div></main>
<script id="data" type="application/json">__DATA__</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const E=Object.fromEntries(D.entities.map(e=>[e.key,e]));
const callers={};for(const e of D.entities)for(const c of e.calls)(callers[c]=callers[c]||[]).push(e.key);
const TABS=['Overview','Calls','Types','Behavior'];
const S={tab:'Overview',sel:null,mod:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isType=e=>['record','alternative','interface'].includes(e.kind);
const isFn=e=>['fn','method','test','bench'].includes(e.kind);
const KI={fn:'ƒ',method:'ƒ',record:'T',alternative:'T',interface:'I',constant:'c',test:'t',bench:'t',impl:'i'};
function sigOf(e){
  const ps=e.slots.map(s=>(s.var?'<span class="var">var </span>':'')+esc(s.name)+': <span class="'+(s.var?'var':'brw')+'">'+esc(s.ty)+'</span>').join(', ');
  return '<code>'+esc(e.name)+'('+ps+') '+(e.result?'<span class="own">'+esc(e.result.ty)+'</span>':'')+'</code>';
}
function moduleStats(f){
  const es=D.entities.filter(e=>e.file===f);const fx=new Set();es.forEach(e=>e.effects.forEach(x=>fx.add(x)));
  const to={};es.forEach(e=>e.calls.forEach(c=>{const t=E[c];if(t&&t.file!==f)to[t.file]=(to[t.file]||0)+1}));
  return {es,fx:[...fx].sort(),to,entry:es.some(e=>e.name==='main')};
}
function setTabs(){$('tabs').innerHTML=TABS.map(t=>'<button class="'+(t===S.tab?'on':'')+'" data-tab="'+t+'">'+t+'</button>').join('')}
function setList(){
  const q=$('q').value.toLowerCase();let h='';
  for(const m of D.modules){
    const es=D.entities.filter(e=>e.file===m.file&&(!q||e.name.toLowerCase().includes(q)||m.file.toLowerCase().includes(q)));
    if(!es.length&&q)continue;
    h+='<div class="file" data-mod="'+esc(m.file)+'">'+esc(m.file)+'</div>';
    for(const e of es)h+='<div class="item'+(S.sel===e.key?' sel':'')+'" data-key="'+esc(e.key)+'"><span class="k">'+(KI[e.kind]||'·')+'</span>'+esc(e.name)+'</div>';
  }
  $('list').innerHTML=h;
}
function setInfo(){
  const e=S.sel&&E[S.sel];
  if(e){
    let h='<b>'+esc(e.name)+'</b> <span class="hint">'+esc(e.kind)+' · '+esc(e.file)+':'+e.line+'</span><br>';
    if(isFn(e)||e.slots.length)h+=sigOf(e)+'<br>';
    h+='<span class="hint">var = callee may change it · plain = borrowed (scalars copy) · result is owned</span><br>';
    h+=e.effects.map(x=>'<span class="badge">'+esc(x)+'</span>').join('')+(e.error?'<span class="badge err">error '+esc(e.error)+'</span>':'')+(e.scopes?'<span class="badge">closes '+e.scopes+'</span>':'');
    const cs=callers[e.key]||[];
    if(cs.length)h+='<br><span class="hint">called by</span> '+cs.map(k=>'<a href="#" data-key="'+esc(k)+'">'+esc(E[k].name)+'</a>').join(', ');
    $('info').innerHTML=h;
  }else if(S.mod){
    const st=moduleStats(S.mod);
    $('info').innerHTML='<b>'+esc(S.mod)+'</b><br><span class="hint">'+st.es.length+' declarations · effects: '+(st.fx.join(', ')||'none')+' · calls '+(Object.keys(st.to).join(', ')||'no other module')+'</span>';
  }else $('info').innerHTML='<span class="hint">Pick a module or function on the left, or click a box.</span>';
}
/* graph layout: layers by longest path ignoring back edges */
function graph(nodes,edges){
  const ix=Object.fromEntries(nodes.map((n,i)=>[n.id,i]));
  const out=nodes.map(()=>[]);edges.forEach(e=>{if(ix[e.from]!==undefined&&ix[e.to]!==undefined&&e.from!==e.to)out[ix[e.from]].push(ix[e.to])});
  const st=nodes.map(()=>0),layer=nodes.map(()=>0);
  const visit=u=>{st[u]=1;for(const v of out[u]){if(st[v]===1)continue;if(st[v]===0)visit(v);layer[u]=Math.max(layer[u],layer[v]+1)}st[u]=2};
  nodes.forEach((_,u)=>{if(!st[u])visit(u)});
  const max=Math.max(0,...layer),cols=[];
  nodes.forEach((n,i)=>{const c=max-layer[i];(cols[c]=cols[c]||[]).push(i)});
  const W=210,GX=90,GY=24,pos=[];let H=0;
  cols.forEach((c,ci)=>{if(!c)return;let y=10;c.forEach(i=>{const h=Math.max(40,18+14*(nodes[i].lines||[]).length+14);pos[i]={x:10+ci*(W+GX),y,h};y+=h+GY});H=Math.max(H,y)});
  const width=10+cols.length*(W+GX);
  let svg='<svg width="'+width+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor" style="color:var(--mut)"/></marker></defs>';
  for(const e of edges){const a=pos[ix[e.from]],b=pos[ix[e.to]];if(!a||!b||e.from===e.to)continue;
    const x1=a.x+W,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2;let d;
    if(x2>x1)d='M'+x1+' '+y1+'C'+(x1+GX/2)+' '+y1+' '+(x2-GX/2)+' '+y2+' '+x2+' '+y2;
    else d='M'+a.x+' '+y1+'C'+(a.x-GX/2)+' '+y1+' '+(b.x+W+GX/2)+' '+y2+' '+(b.x+W)+' '+y2;
    svg+='<path class="edge" d="'+d+'" marker-end="url(#a)"/>';
    if(e.label)svg+='<text class="elabel" x="'+((x1+x2)/2)+'" y="'+((y1+y2)/2-4)+'" text-anchor="middle">'+esc(e.label)+'</text>'}
  nodes.forEach((n,i)=>{const p=pos[i];if(!p)return;
    svg+='<g class="node '+(n.cls||'')+(n.id===S.sel||n.id===S.mod?' sel':'')+'" data-id="'+esc(n.id)+'" data-kind="'+(n.kind||'')+'"><rect x="'+p.x+'" y="'+p.y+'" width="'+W+'" height="'+p.h+'" rx="7"/><text x="'+(p.x+W/2)+'" y="'+(p.y+18)+'" text-anchor="middle" font-weight="600">'+esc(n.title)+'</text>';
    (n.lines||[]).forEach((l,j)=>svg+='<text x="'+(p.x+10)+'" y="'+(p.y+36+14*j)+'">'+esc(l)+'</text>');
    if(n.sub)svg+='<text x="'+(p.x+W/2)+'" y="'+(p.y+p.h-8)+'" text-anchor="middle" class="elabel">'+esc(n.sub)+'</text>';
    svg+='</g>'});
  return svg+'</svg>';
}
function overview(){
  const all=$('all').checked;let nodes=[],edges=[];
  for(const m of D.modules){const st=moduleStats(m.file);const linked=Object.keys(st.to).length>0||D.entities.some(e=>e.calls.some(c=>E[c]&&E[c].file===m.file&&e.file!==m.file));
    if(!all&&!linked&&!st.entry)continue;
    nodes.push({id:m.file,title:m.file.split('/').pop(),sub:st.fx.length?st.fx.join(' · '):'pure',cls:st.entry?'entry':st.fx.length?'effect':'pure',kind:'mod'});
    for(const [t,n] of Object.entries(st.to))edges.push({from:m.file,to:t,label:n+(n>1?' calls':' call')})}
  if(!nodes.length)return '<p class="hint">No cross-module calls. Tick “show everything”.</p>';
  return '<p class="hint">Modules, who calls whom, and the effects each reaches. Green is pure, amber touches the outside world, blue holds main.</p>'+graph(nodes,edges);
}
function calls(){
  const e=S.sel&&E[S.sel];if(!e||!isFn(e))return '<p class="hint">Pick a function to see who calls it and what it calls.</p>';
  const depth=+$('depth').value,nodes={},edges=[];
  const add=(k)=>{if(nodes[k])return;const x=E[k];nodes[k]={id:k,title:x.name,sub:x.file.split('/').pop()+':'+x.line,cls:x.name==='main'?'entry':x.effects.length?'effect':'pure',kind:'fn'}};
  add(e.key);(callers[e.key]||[]).forEach(c=>{add(c);edges.push({from:c,to:e.key})});
  const seen=new Set();const down=(k,d)=>{if(d>=depth||seen.has(k))return;seen.add(k);for(const c of E[k].calls){add(c);edges.push({from:k,to:c});down(c,d+1)}
    if($('all').checked&&d<depth)for(const x of E[k].external.slice(0,6)){const id='x:'+x;nodes[id]=nodes[id]||{id,title:x.split('#').pop(),cls:'ext',kind:'ext'};edges.push({from:k,to:id})}};
  down(e.key,0);
  return '<p class="hint">Callers on the left, callees on the right (depth '+depth+'). Tick “show everything” to add standard-library and native calls (dashed).</p>'+graph(Object.values(nodes),edges);
}
function types(){
  const nodes={},edges=[];const roots=S.sel&&E[S.sel]?[E[S.sel]]:D.entities.filter(isType);
  const add=(x)=>{if(nodes[x.key])return;nodes[x.key]={id:x.key,title:(x.kind==='record'?'':'«'+x.kind+'» ')+x.name,cls:'cls',kind:'type',
    lines:x.slots.map(s=>x.kind==='record'?s.name+': '+s.ty:s.name+s.ty).slice(0,10)};
    x.slots.forEach(s=>s.refs.forEach(r=>{const t=E[r];if(t){add(t);edges.push({from:x.key,to:r,label:s.name})}}));
    if(x.result)x.result.refs.forEach(r=>{const t=E[r];if(t){add(t);edges.push({from:x.key,to:r,label:'returns'})}})};
  roots.forEach(r=>{if(isFn(r)){nodes[r.key]={id:r.key,title:r.name+'()',cls:'cls',lines:r.slots.map(s=>(s.var?'var ':'')+s.name+': '+s.ty)}}add(r)});
  const list=Object.values(nodes);if(!list.length)return '<p class="hint">No types.</p>';
  return '<p class="hint">Boxes are types; an arrow means “holds” (owns). Select a type or function to focus.</p>'+graph(list,edges);
}
function flowHTML(nodes,level){
  return '<ul>'+nodes.map(n=>{const ref=n.reference&&E[n.reference]&&E[n.reference].flow;
    return '<li><span class="kind '+esc(n.kind)+'">'+esc(n.kind||'step')+'</span><code>'+esc(n.label)+'</code>'+(ref&&ref.length&&level<6?' <button data-expand="'+esc(n.reference)+'">expand ▸</button>':'')+(n.children&&n.children.length?flowHTML(n.children,level):'')+'<span class="callee"></span></li>'}).join('')+'</ul>';
}
function behavior(){
  const e=S.sel&&E[S.sel];if(!e||!isFn(e))return '<p class="hint">Pick a function to read its behavior step by step.</p>';
  return '<p class="hint">Steps in order: calls, try (early error exit), branches, spawned work, cleanup scopes and exits. Click “expand” to step into a callee.</p><div class="flow">'+(e.flow.length?flowHTML(e.flow,0):'<span class="hint">no steps</span>')+'</div>';
}
function render(){setTabs();setList();setInfo();$('view').innerHTML={Overview:overview,Calls:calls,Types:types,Behavior:behavior}[S.tab]()}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-tab],[data-key],[data-mod],[data-id],[data-expand]');if(!t)return;ev.preventDefault();
  if(t.dataset.tab)S.tab=t.dataset.tab;
  else if(t.dataset.expand){const li=t.closest('li');const e=E[t.dataset.expand];const slot=li.querySelector('.callee');
    if(slot.innerHTML){slot.innerHTML='';t.textContent='expand ▸'}else{slot.innerHTML=flowHTML(e.flow,1);t.textContent='collapse ▾'}return}
  else if(t.dataset.key){S.sel=t.dataset.key;S.mod=null;if(S.tab==='Overview')S.tab='Calls'}
  else if(t.dataset.mod){S.mod=t.dataset.mod;S.sel=null;S.tab='Overview'}
  else if(t.dataset.id){const id=t.dataset.id,k=t.dataset.kind;if(k==='mod'){S.mod=id;S.sel=null}else if(E[id]){S.sel=id;S.mod=null}else return}
  render()});
$('q').addEventListener('input',setList);$('all').addEventListener('change',render);$('depth').addEventListener('input',render);
const main=D.entities.find(e=>e.name==='main'&&e.kind==='fn');if(main){S.sel=main.key;S.tab='Calls'}
render();
</script>
</body>
</html>
