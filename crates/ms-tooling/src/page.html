<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Program map</title>
<style>
/* Brand and syntax tokens mirror website/assets/_custom.scss; semantic colors stay distinct. */
:root{color-scheme:light;--kw:#925326;--ty:#a33d14;--st:#a33d14;--nu:#925326;--cm:#776252;--fnc:#a33d14;--bg:#fcf7f0;--fg:#38271f;--mut:#776252;--line:#e3d2c2;--pan:#f5eadf;--node:#fffbf6;--sel:#ffe1c7;--acc:#a33d14;--pure:#e6f6ea;--pures:#26743d;--eff:#fdf3d8;--effs:#856008;--ent:#ffe1c7;--var:#b72e38;--own:#26743d;--brw:#345bb2;--spawn:#7640ad;--badgefg:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--kw:#f2bc8d;--ty:#ffab72;--st:#ff873e;--nu:#f2bc8d;--cm:#c0aa99;--fnc:#ffab72;--bg:#1b120e;--fg:#ebdbce;--mut:#c0aa99;--line:#493326;--pan:#281b14;--node:#241810;--sel:#472719;--acc:#ffab72;--pure:#16301f;--pures:#4cc272;--eff:#33290f;--effs:#e2b341;--ent:#472719;--var:#ff7070;--own:#4cc272;--brw:#8aabff;--spawn:#cba2f2;--badgefg:#1b120e}}
:root[data-theme=dark]{color-scheme:dark;--kw:#f2bc8d;--ty:#ffab72;--st:#ff873e;--nu:#f2bc8d;--cm:#c0aa99;--fnc:#ffab72;--bg:#1b120e;--fg:#ebdbce;--mut:#c0aa99;--line:#493326;--pan:#281b14;--node:#241810;--sel:#472719;--acc:#ffab72;--pure:#16301f;--pures:#4cc272;--eff:#33290f;--effs:#e2b341;--ent:#472719;--var:#ff7070;--own:#4cc272;--brw:#8aabff;--spawn:#cba2f2;--badgefg:#1b120e}
*{box-sizing:border-box}
a{color:var(--acc)}
body{margin:0;font:13px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100vh;overflow:hidden;display:grid;
  grid-template-columns:var(--w1,250px) 4px minmax(0,1fr) auto auto;grid-template-rows:40px minmax(0,1fr) 24px}
button{font:inherit;color:inherit}
kbd{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;color:var(--mut);background:var(--pan)}
.ib{border:1px solid transparent;background:none;color:var(--mut);width:26px;height:26px;border-radius:6px;cursor:pointer;display:inline-grid;place-items:center;font-size:14px;padding:0}
.ib:hover:not(:disabled){background:var(--sel);color:var(--fg)}.ib:disabled{opacity:.35;cursor:default}.ib.on{color:var(--acc)}
header{grid-column:1/-1;display:flex;gap:12px;align-items:center;padding:0 10px 0 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{font-weight:700;letter-spacing:.02em;white-space:nowrap}.brand i{font-style:normal;color:var(--acc);margin-right:6px}
nav{display:flex;gap:2px;height:100%;align-items:stretch;min-width:0;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{flex:none}
.brand,header>div:nth-of-type(2){flex:none}#navbtn{display:none}
nav button{border:0;border-bottom:2px solid transparent;background:none;color:var(--mut);padding:0 10px;cursor:pointer}
nav button:hover{color:var(--fg)}nav button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.search{margin-left:auto;display:flex;gap:10px;align-items:center;flex:0 1 260px;min-width:36px;overflow:hidden;white-space:nowrap;padding:4px 10px;border:1px solid var(--line);border-radius:7px;background:var(--pan);color:var(--mut);cursor:pointer}
.search:hover{border-color:var(--acc)}.search span{flex:1;text-align:left}
.opts{display:flex;gap:2px;align-items:center;color:var(--mut);position:relative;flex:none}
.pop{position:absolute;top:34px;right:0;z-index:8;width:260px;padding:10px 12px;display:grid;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.25);color:var(--fg)}
.pop[hidden]{display:none}.pop label{display:flex;gap:8px;align-items:center}.pop input[type=range]{flex:1;accent-color:var(--acc)}
aside{grid-row:2;grid-column:1;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg)}
.tbar{display:flex;gap:2px;align-items:center;padding:6px 8px 2px}.tbar input{flex:1;min-width:0;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--pan);color:var(--fg);font:inherit}
.tbar input:focus{outline:2px solid var(--acc);outline-offset:-1px;background:var(--bg)}
.kinds{display:flex;flex-wrap:wrap;gap:4px;padding:2px 8px 6px;border-bottom:1px solid var(--line)}
.kinds button{white-space:nowrap;border:1px solid var(--line);background:none;color:var(--mut);padding:0 8px;border-radius:10px;cursor:pointer;font-size:11px;line-height:18px}
.kinds button.on{background:var(--sel);color:var(--acc);border-color:var(--acc)}
#list{flex:1;overflow:auto;padding:4px 6px 12px}
#list h4{margin:12px 6px 3px;font-size:10.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.07em}
.file{display:flex;gap:3px;align-items:center;padding:2px 6px;border-radius:5px;color:var(--fg);cursor:pointer;white-space:nowrap}
.file:hover,.item:hover{background:var(--pan)}.file .c{width:12px;color:var(--mut);font-size:10px;text-align:center}
.file.cur{background:var(--sel)}.file.sub{color:var(--mut);font-size:12px}
.item{padding:2px 6px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.item.sel{background:var(--sel);color:var(--acc);font-weight:600}.item:focus,.file:focus{outline:1px solid var(--acc)}
.k{display:inline-block;width:16px;color:var(--mut);font-size:11px;font-family:system-ui,sans-serif}
.item.sel .k{color:var(--acc)}.star{color:var(--effs)}
#sp1{grid-column:2}#sp2{grid-column:4}
.split{grid-row:2;width:4px;cursor:col-resize;background:transparent;border-left:1px solid var(--line);margin-left:-1px;z-index:2}.split:hover,.split.drag{background:var(--acc);opacity:.45}
main{grid-row:2;grid-column:3;overflow:auto;padding:0;min-width:0;display:flex;flex-direction:column}
#info{padding:8px 14px 6px;border-bottom:1px solid var(--line);background:var(--bg)}
#info .crumbs{color:var(--mut);font-size:12px;margin:0 0 2px}.crumbs a{color:var(--mut);cursor:pointer;text-decoration:none}.crumbs a:hover{color:var(--acc)}
#info .ttl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#info .ttl code{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace}
#info .ttl .sp{flex:1}#info .meta{margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:12px}
#info a{color:var(--acc);text-decoration:none}#info a:hover{text-decoration:underline}
#view{padding:8px 14px 10px;flex:1;min-height:0;overflow:auto}
.var{color:var(--var);font-weight:700}.brw{color:var(--brw)}.own{color:var(--own);font-weight:600}
.badge{display:inline-block;font-size:11px;padding:0 7px;border-radius:9px;background:var(--pan);color:var(--fg);border:1px solid var(--line)}
.badge.write{border-color:var(--effs);color:var(--effs)}.badge.read{border-color:var(--brw);color:var(--brw)}.badge.err{border-color:var(--var);color:var(--var)}
svg text{fill:var(--fg);font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
svg .node{cursor:pointer}svg .node rect{fill:var(--node);stroke:var(--line);stroke-width:1.2}svg .node:hover rect{stroke:var(--acc)}
svg .pure rect{stroke:var(--pures)}svg .effect rect{stroke:var(--effs)}
svg .entry rect{fill:var(--ent);stroke:var(--acc);stroke-width:2}svg .ext rect{stroke:var(--mut);stroke-dasharray:4}
svg .cls rect{stroke:var(--mut)}svg .sel rect{stroke:var(--acc);stroke-width:2.5}
svg path.edge{fill:none;stroke:var(--mut);stroke-width:1.2;opacity:.7}svg text.code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}svg .elabel{fill:var(--mut);font-size:11px}
svg .more rect{stroke:var(--mut);stroke-dasharray:4}svg .dir rect{fill:var(--pan);stroke:var(--acc)}
svg .chg rect{stroke:var(--var);stroke-width:3px}
svg .life{stroke:var(--line);stroke-dasharray:4}svg .note rect{fill:var(--eff);stroke:var(--effs)}svg .msg{stroke:var(--fg);stroke-width:1.2;fill:none}svg .msg.async{stroke-dasharray:5}svg .msg.ret{stroke:var(--mut);stroke-dasharray:2 3}
.tools{display:flex;gap:4px;margin:0 0 6px;align-items:center;flex-wrap:wrap}.tools .hint{margin-left:8px}
.tools button,.tools select{border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:2px 9px;border-radius:6px;cursor:pointer}
.tools button:hover{border-color:var(--acc);color:var(--acc)}
.stage{border:1px solid var(--line);border-radius:10px;overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px}
.stage svg{touch-action:none;display:block;width:100%;height:calc(100vh - 215px);min-height:300px;cursor:grab}
.flow ul{list-style:none;margin:0;padding-left:18px;border-left:1px solid var(--line)}.flow>ul{border:0;padding:0}
.flow li{margin:3px 0}.flow summary{cursor:pointer;list-style:none}.flow summary::-webkit-details-marker{display:none}
.flow summary::before{content:'▾';display:inline-block;width:14px;color:var(--mut)}.flow details:not([open])>summary::before{content:'▸'}
.flow .kind{font-size:10.5px;padding:0 6px;border-radius:4px;margin-right:6px;background:var(--pan);border:1px solid var(--line);color:var(--mut)}
.kind.try{background:var(--var);color:var(--badgefg);border-color:var(--var)}.kind.spawn{background:var(--spawn);color:var(--badgefg)}.kind.scope{background:var(--effs);color:var(--badgefg)}.kind.exit{background:var(--mut);color:var(--badgefg)}.kind.native{background:var(--effs);color:var(--badgefg)}
.flow code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace}.flow button{border:0;background:none;color:var(--acc);cursor:pointer;font-size:12px}
.hint{color:var(--mut)}.empty{display:grid;place-items:center;height:60%;color:var(--mut);text-align:center;gap:6px}.empty b{color:var(--fg);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 6px}.chip{padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:12px;line-height:20px}
.chip:hover{border-color:var(--acc)}.chip.chg{border-color:var(--var);color:var(--var)}.gone{text-decoration:line-through;color:var(--mut)}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}.route .step{padding:6px 12px;border-radius:8px;border:1px solid var(--effs);background:var(--eff);cursor:pointer}.route .arrow{color:var(--mut)}
.tk-kw{color:var(--kw);font-weight:600}.tk-ty{color:var(--ty)}.tk-st{color:var(--st)}.tk-nu{color:var(--nu)}.tk-cm{color:var(--cm);font-style:italic}.tk-fn{color:var(--fnc)}
.id{cursor:pointer;border-radius:3px}.id:hover,.id.on{background:var(--sel);box-shadow:0 0 0 1px var(--acc) inset}
#tip{position:fixed;z-index:9;max-width:min(440px,92vw);padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:12.5px}
#tip{pointer-events:none}#tip .go{pointer-events:auto}#tip[hidden]{display:none}#tip .nm{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace}#tip .ty{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:3px;overflow-wrap:anywhere}#tip .no{color:var(--mut)}#tip .go{display:block;margin-top:6px;color:var(--acc);text-decoration:none;font-size:12px}
#src{grid-row:2;grid-column:5;width:var(--w2,430px);border-left:1px solid var(--line);overflow:auto;background:var(--bg)}#src[hidden],.split[hidden]{display:none}
#src .hd{position:sticky;top:0;display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--bg);border-bottom:1px solid var(--line);z-index:1}
#src .hd .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut);font-size:12px}#src .hd b{color:var(--fg);font-size:13px;margin-right:6px}
.code{padding:6px 0 24px;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:4;min-width:0}
.code .r{display:flex}.code .r:hover{background:var(--pan)}
.code .ln{flex:none;position:sticky;left:0;width:46px;padding-right:12px;text-align:right;color:var(--mut);user-select:none;background:inherit;opacity:.8}
.code .r:not(:hover) .ln{background:var(--bg)}
.code .tx{flex:1 1 auto;white-space:pre;padding-right:16px}
.code.wrap .tx{white-space:pre-wrap;overflow-wrap:break-word;min-width:0;padding-left:calc(var(--i,0)*1ch + 2ch);text-indent:calc(-1*(var(--i,0)*1ch + 2ch))}
.code:not(.wrap) .r{min-width:max-content}
footer{grid-column:1/-1;display:flex;gap:16px;align-items:center;padding:0 12px;border-top:1px solid var(--line);color:var(--mut);font-size:11.5px;background:var(--pan)}footer .sp{flex:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:10}
.ov.on{display:flex}.ov .box{width:min(620px,92vw);background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
#palq{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font:15px inherit;background:var(--bg);color:var(--fg);outline:none}
#palres{max-height:50vh;overflow:auto;padding:6px}#palres .row{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:7px;cursor:pointer}
#palres .row.on{background:var(--sel)}#palres .row .k{width:18px}#palres .row .f{margin-left:auto;color:var(--mut);font-size:11.5px}#palres .row code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace}
.ov .foot{padding:6px 12px;border-top:1px solid var(--line);color:var(--mut);font-size:11.5px;display:flex;gap:12px}
#help .box{padding:18px 22px;max-height:80vh;overflow:auto}#help h3{margin:0 0 8px}#help table{border-collapse:collapse;margin-bottom:12px}#help td{padding:3px 14px 3px 0;vertical-align:top}
#help .sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid;margin-right:8px;vertical-align:-2px}
@media (max-width:1100px){.search span,.search kbd{display:none}.search{flex:none;min-width:0;margin-left:auto}.search::before{content:'⌕'}}
@media (max-width:900px){.brand{font-size:0}.brand i{font-size:15px;margin:0}body{--w1:200px}
  #sp2{display:none!important}#src{position:fixed;right:0;top:var(--hh,40px);bottom:24px;width:min(94vw,520px);z-index:6;box-shadow:-12px 0 36px rgba(0,0,0,.25)}}
@media (max-width:640px){#navbtn{display:inline-grid}
  body{grid-template-columns:0 0 minmax(0,1fr) 0 0;grid-template-rows:auto minmax(0,1fr) 24px;--hh:78px}
  header{flex-wrap:wrap;gap:0 4px;padding:0 6px}header nav{order:9;flex:1 0 100%;height:38px;border-top:1px solid var(--line)}
  nav button{padding:0 14px}.ib{width:36px;height:36px}.search{margin-left:auto}
  aside{position:fixed;left:0;top:var(--hh);bottom:24px;width:min(86vw,320px);z-index:6;box-shadow:12px 0 36px rgba(0,0,0,.25);transform:translateX(-102%);transition:transform .15s}
  body.nav-open aside{transform:none}#sp1{display:none}.item,.file{padding-top:7px;padding-bottom:7px}
  #info{padding:6px 10px 4px}#view{padding:6px 10px 8px}.stage svg{height:calc(100vh - 290px)}.pop{right:-80px}
  #palq{font-size:16px}.ov{padding-top:8vh}}
#scrim{display:none;position:fixed;inset:0;top:var(--hh,40px);background:rgba(0,0,0,.4);z-index:5}body.nav-open #scrim{display:block}
body.focus{grid-template-columns:0 0 minmax(0,1fr) 0 0}body.focus aside,body.focus .split,body.focus #src{display:none}
</style>
</head>
<body>
<header>
<button class="ib" id="navbtn" title="Explorer">☰</button><div class="brand"><i>◈</i>Program map</div>
<div><button class="ib" id="back" title="Back (Alt+←)">‹</button><button class="ib" id="fwd" title="Forward (Alt+→)">›</button></div>
<nav id="tabs"></nav>
<button class="search" id="palbtn"><span>Go to symbol or file</span><kbd>Ctrl K</kbd></button>
<div class="opts"><button class="ib" id="optbtn" title="View options">⚙</button>
<div class="pop" id="optpop" hidden><label title="Show calls into the standard library"><input type="checkbox" id="all"> Include standard library calls</label><label id="onlywrap" hidden><input type="checkbox" id="only"> Show changed items only</label>
<label title="How many call levels to show">Call depth <input type="range" id="depth" min="1" max="4" value="1"></label></div>
<button class="ib" id="focusbtn" title="Focus the map (F)">⛶</button><button class="ib" id="theme" title="Theme: auto, dark, light">◐</button><button class="ib" id="helpbtn" title="Shortcuts and legend (?)">?</button></div>
</header>
<aside id="side"><div class="tbar"><input id="q" placeholder="Filter files and symbols"><button class="ib" id="collapse" title="Collapse all">⊟</button><button class="ib" id="expand" title="Expand all">⊞</button><button class="ib" id="locate" title="Reveal current item">◎</button></div>
<div class="kinds" id="kinds"></div><div id="list" tabindex="0"></div></aside>
<div class="split" id="sp1"></div>
<main><div id="info"></div><div id="view"></div></main>
<div class="split" id="sp2" hidden></div><section id="src" hidden></section>
<footer id="status"></footer>
<div id="tip" hidden></div><div id="scrim"></div><div id="pal" class="ov"><div class="box"><input id="palq" placeholder="Go to function, type, test or file" autocomplete="off"><div class="res" id="palres"></div><div class="foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div></div></div>
<div id="help" class="pal-like" style="display:none"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
/* compact data: files, modules, entities as arrays with index references */
const R=JSON.parse(document.getElementById('data').textContent);
const D={modules:R.m.map(m=>({file:R.f[m[0]],imports:m[1]})),entities:[]};
const keyOf=a=>R.f[a[0]]+'#'+a[1]+'#'+a[2];
const KEYS=R.e.map(keyOf);
const fl=ns=>ns.map(n=>({kind:n[0],label:n[1],reference:n[2]<0?'':KEYS[n[2]],children:fl(n[3])}));
D.entities=R.e.map((a,i)=>({key:KEYS[i],file:R.f[a[0]],kind:a[1],name:a[15],line:a[3],exported:!!a[4],effects:a[5],error:a[6],scopes:a[7],
  calls:a[8].map(j=>KEYS[j]),external:a[9],slots:a[10].map(s=>({name:s[0],ty:s[1],var:!!s[2],refs:s[3].map(j=>KEYS[j]),ownership:s[4]})),
  result:a[11]?{ty:a[11][0],refs:a[11][1].map(j=>KEYS[j]),ownership:a[11][2]}:null,_flow:a[12],fi:a[0],first:a[13],last:a[14]}));
const E=Object.fromEntries(D.entities.map(e=>[e.key,e]));
const CH={},GONE=[],chFiles=new Set(),chDirs=new Set();
for(const x of (R.x||[])){if(x[0]>=0){CH[KEYS[x[0]]]={tier:x[2],changes:x[3],name:x[1]};const f=R.f[R.e[x[0]][0]];chFiles.add(f);for(let i=f.indexOf('/');i>=0;i=f.indexOf('/',i+1))chDirs.add(f.slice(0,i+1))}else GONE.push({name:x[1],tier:x[2],changes:x[3]})}
const HAS=!!R.x;
const chgOf=n=>n.kind==='mod'?chFiles.has(n.id):n.kind==='dir'?chDirs.has(n.id):!!CH[n.id];
/* flows decode on first use, so a large program loads fast */
for(const e of D.entities)Object.defineProperty(e,'flow',{get(){const v=fl(e._flow);Object.defineProperty(e,'flow',{value:v});return v},configurable:true});
const callers={};for(const e of D.entities)for(const c of e.calls)(callers[c]=callers[c]||[]).push(e.key);
const TABS=['Overview','Calls','Sequence','Types','Behavior','Route'];
const S={tab:'Overview',sel:null,mod:null,scope:'',cap:40,from:null,to:null,dir:'both'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isType=e=>['type','alternative','interface'].includes(e.kind);
const isFn=e=>['fn','method','test','bench'].includes(e.kind);
const KI={fn:'ƒ',method:'ƒ',type:'T',alternative:'T',interface:'I',constant:'c',test:'✓',bench:'»',impl:'i'};
const isCheck=e=>e.kind==='test'||e.kind==='bench';
const KW=new Set('and break continue else enum export extern false fixture fn for if impl import in interface let match not or ref return self test true try type unit var while'.split(' '));

  const saved=store.get(key,0);if(saved)document.body.style.setProperty(cssVar,saved+'px');
  el.addEventListener('pointerdown',ev=>{ev.preventDefault();el.setPointerCapture(ev.pointerId);el.classList.add('drag');const x0=ev.clientX,w0=$(target).offsetWidth;let w=w0;
    const mv=e=>{w=Math.max(min,Math.min(max,w0+sign*(e.clientX-x0)));document.body.style.setProperty(cssVar,w+'px')};
    const up=()=>{el.classList.remove('drag');el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);store.set(key,w)};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)})}
splitter('sp1','--w1',1,180,520,'w1','side');splitter('sp2','--w2',-1,300,900,'w2','src');
/* a clicked identifier shows its checked type; the card never blocks clicks on the code under it */
function hideTip(){const t=$('tip');if(t)t.hidden=true;document.querySelectorAll('#src .id.on').forEach(x=>x.classList.remove('on'))}
function showTip(el){
  const e=S.sel&&E[S.sel],row=el.closest('.r');if(!e||!row)return;
  hideTip();el.classList.add('on');
  const line=+row.dataset.ln,col=+el.dataset.c,name=el.textContent,hs=(HF[e.fi]||{})[line]||[];
  const h=hs.find(x=>x[0]===col&&x[1]===name.length);
  const key=curCm[name]&&el.classList.contains('tk-fn')?curCm[name]:'';
  const tip=$('tip');
  tip.innerHTML='<div class="nm">'+esc(name)+'</div>'+(h?'<div class="ty">'+hl(HT[h[2]])+'</div>':'<div class="no">No type information for this name.</div>')+(key?'<a class="go" href="#" data-key="'+esc(key)+'">Go to definition</a>':'');
  tip.hidden=false;
  const r=el.getBoundingClientRect(),w=tip.offsetWidth,hgt=tip.offsetHeight;
  tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left))+'px';
  tip.style.top=(r.bottom+hgt+10<innerHeight?r.bottom+6:Math.max(8,r.top-hgt-6))+'px'}
/* clicks */
let timer=null;
document.addEventListener('click',ev=>{
  const idEl=ev.target.closest('#src .id');if(idEl){ev.preventDefault();showTip(idEl);return}
  if(!ev.target.closest('#tip'))hideTip();
  const t=ev.target.closest('[data-tg],[data-copy],[data-close],[data-src],[data-tab],[data-key],[data-mod],[data-scope],[data-id],[data-expand],[data-routefrom],[data-star],[data-link],[data-wrap],[data-export],[data-flow],[data-kf]');if(!t)return;ev.preventDefault();
  if(t.dataset.tg!==undefined){const k=t.dataset.tg;if(OPEN.has(k))OPEN.delete(k);else OPEN.add(k);setList();return}
  if(t.dataset.kf){KF[t.dataset.kf]=!KF[t.dataset.kf];setKinds();setList();return}
  if(t.dataset.close||t.dataset.src){srcOpen=t.dataset.src?!srcOpen:false;store.set('srcOpen',srcOpen);srcPanel();return}
  if(t.dataset.star){const e=S.sel&&E[S.sel];if(!e)return;if(STAR.has(e.key))STAR.delete(e.key);else STAR.add(e.key);store.set('stars',[...STAR]);setInfo();setList();return}
  if(t.dataset.link){try{navigator.clipboard.writeText(location.href)}catch(_){}t.textContent='✓';setTimeout(()=>{t.textContent='⧉'},900);return}
  if(t.dataset.wrap){wrap=!wrap;store.set('wrap',wrap);srcPanel();return}
  if(t.dataset.export){exportSvg();return}
  if(t.dataset.flow){document.querySelectorAll('.flow details').forEach(d=>{d.open=t.dataset.flow==='expand'});return}
  if(t.dataset.copy){try{navigator.clipboard.writeText(curSrc)}catch(_){}t.classList.add('on');setTimeout(()=>t.classList.remove('on'),700);return}
  if(t.closest('#list'))document.body.classList.remove('nav-open');
  if(t.dataset.tab)S.tab=t.dataset.tab;
  else if(t.dataset.expand){const li=t.closest('li');const e=E[t.dataset.expand];const slot=li.querySelector(':scope > .callee');
    if(slot.innerHTML){slot.innerHTML='';t.textContent='expand ▸'}else{slot.innerHTML=flowHTML(e.flow,1);t.textContent='collapse ▾'}return}
  else if(t.dataset.routefrom){S.from=S.sel;S.to=null;S.tab='Route'}
  else if(t.dataset.scope!==undefined){S.scope=t.dataset.scope;S.mod=null;S.sel=null;S.cap=40;S.tab='Overview'}
  else if(t.dataset.key){S.sel=t.dataset.key;S.mod=null;if(S.tab==='Overview')S.tab='Sequence';if(S.tab==='Route'){if(!S.from)S.from=S.sel;else S.to=S.sel}}
  else if(t.dataset.mod){S.mod=t.dataset.mod;S.scope=dirOf(S.mod);S.sel=null;S.tab='Overview'}
  else if(t.dataset.id){const id=t.dataset.id,k=t.dataset.kind;
    if(k==='more'){S.cap+=40;render();return}
    if(k==='mod'){S.mod=id;S.sel=null}else if(E[id]){S.sel=id;S.mod=null;if(fitTab()){render();return}}
    document.querySelectorAll('.node.sel').forEach(n=>n.classList.remove('sel'));t.closest('.node').classList.add('sel');setList();setInfo();srcPanel();setStatus();save();return}
  render()});
document.addEventListener('dblclick',ev=>{const n=ev.target.closest('.node');if(!n)return;const id=n.dataset.id,k=n.dataset.kind;
  if(k==='dir'){S.scope=id;S.mod=null;S.sel=null;S.cap=40;S.tab='Overview'}
  else if(k==='mod'){S.mod=id;S.scope=dirOf(id);S.sel=null;S.tab='Overview'}
  else if(E[id]){S.sel=id;S.mod=null;S.tab='Sequence'}else return;render()});
$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(setList,120)});
$('q').addEventListener('keydown',ev=>{if(ev.key==='Escape'){$('q').value='';setList();$('q').blur()}else if(ev.key==='ArrowDown'){ev.preventDefault();const r=$('list').querySelector('[tabindex]');if(r)r.focus()}});
$('all').addEventListener('change',render);$('only').addEventListener('change',render);$('depth').addEventListener('input',render);
$('back').addEventListener('click',()=>go(-1));$('fwd').addEventListener('click',()=>go(1));
$('collapse').addEventListener('click',collapseAll);$('expand').addEventListener('click',expandAll);$('locate').addEventListener('click',locate);
$('palbtn').addEventListener('click',openPal);$('navbtn').addEventListener('click',()=>document.body.classList.toggle('nav-open'));$('scrim').addEventListener('click',()=>document.body.classList.remove('nav-open'));
$('optbtn').addEventListener('click',ev=>{ev.stopPropagation();$('optpop').hidden=!$('optpop').hidden});
document.addEventListener('click',ev=>{if(!ev.target.closest('#optpop,#optbtn'))$('optpop').hidden=true});
$('helpbtn').addEventListener('click',()=>help.classList.toggle('on'));
const toggleFocus=()=>{document.body.classList.toggle('focus');$('focusbtn').classList.toggle('on')};$('focusbtn').addEventListener('click',toggleFocus);
/* keyboard */
$('src').addEventListener('scroll',()=>hideTip());
$('list').addEventListener('keydown',ev=>{
  const rows=[...$('list').querySelectorAll('[tabindex]')],el=document.activeElement,i=rows.indexOf(el);
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();const n=rows[Math.max(0,Math.min(rows.length-1,(i<0?0:i+(ev.key==='ArrowDown'?1:-1))))];if(n)n.focus()}
  else if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();if(el&&el.click)el.click()}
  else if(ev.key==='ArrowRight'||ev.key==='ArrowLeft'){const c=el&&(el.dataset.tg!==undefined?el:el.querySelector('[data-tg]'));if(!c)return;const k=c.dataset.tg,o=OPEN.has(k);
    if((ev.key==='ArrowRight')!==o){ev.preventDefault();if(o)OPEN.delete(k);else OPEN.add(k);setList()}}});
addEventListener('keydown',ev=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName||'');
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();openPal();return}
  if(ev.key==='Escape'){closePal();help.classList.remove('on');hideTip();return}
  if(ev.altKey&&ev.key==='ArrowLeft'){ev.preventDefault();go(-1);return}
  if(ev.altKey&&ev.key==='ArrowRight'){ev.preventDefault();go(1);return}
  if(typing||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  if(ev.key==='/'){ev.preventDefault();$('q').focus();$('q').select()}
  else if(ev.key==='?'){help.classList.toggle('on')}
  else if(ev.key==='f'||ev.key==='F')toggleFocus();
  else if(ev.key==='s'||ev.key==='S'){const b=document.querySelector('[data-star]');if(b)b.click()}});
try{const h=JSON.parse(decodeURIComponent(location.hash.slice(1)));if(h&&TABS.includes(h.t)){S.tab=h.t;S.sel=E[h.s]?h.s:null;S.mod=h.m||null;S.scope=h.c||'';S.from=E[h.f]?h.f:null;S.to=E[h.o]?h.o:null}else throw 0}catch(_){const main=D.entities.find(e=>e.name==='main'&&e.kind==='fn');if(main){S.sel=main.key;S.scope=dirOf(main.file);S.tab='Sequence'}}
setKinds();render();
</script>
