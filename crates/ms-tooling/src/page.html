<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Program map</title>
<style>
:root{--kw:#8250df;--ty:#0a7e8c;--st:#1a7f37;--nu:#b35900;--cm:#8a919e;--fnc:#0550ae;--bg:#fff;--fg:#1d2330;--mut:#6b7385;--line:#d9dde6;--pan:#f5f7fa;--acc:#2f6fdb;--pure:#dff5e1;--pures:#2a9d3a;--eff:#fff1cc;--effs:#b8860b;--ent:#d6e9ff;--var:#d33;--own:#2a9d3a;--brw:#37b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--kw:#c297ff;--ty:#5fd3e0;--st:#7ee787;--nu:#ffb86b;--cm:#7d8590;--fnc:#79c0ff;--bg:#14171f;--fg:#e6e9f0;--mut:#9aa3b5;--line:#2b3140;--pan:#1b1f2a;--acc:#6aa3ff;--pure:#173a20;--pures:#4cc460;--eff:#3d3213;--effs:#e0b43c;--ent:#17325a;--var:#ff6b6b;--own:#4cc460;--brw:#6aa3ff}}
:root[data-theme=dark]{--kw:#c297ff;--ty:#5fd3e0;--st:#7ee787;--nu:#ffb86b;--cm:#7d8590;--fnc:#79c0ff;--bg:#14171f;--fg:#e6e9f0;--mut:#9aa3b5;--line:#2b3140;--pan:#1b1f2a;--acc:#6aa3ff;--pure:#173a20;--pures:#4cc460;--eff:#3d3213;--effs:#e0b43c;--ent:#17325a;--var:#ff6b6b;--own:#4cc460;--brw:#6aa3ff}
*{box-sizing:border-box}
a{color:var(--acc)}
body{margin:0;font:13px/1.35 system-ui,sans-serif;background:var(--bg);color:var(--fg);display:grid;grid-template-columns:210px 1fr auto;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:3px 10px;border-bottom:1px solid var(--line)}
header h1{font-size:14px;margin:0}
nav{display:flex;gap:4px}
nav button{border:1px solid var(--line);background:var(--pan);color:var(--fg);padding:1px 8px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
aside{border-right:1px solid var(--line);overflow:auto;padding:6px;background:var(--pan)}
aside input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.file{font-weight:600;margin:8px 0 1px;color:var(--mut);font-size:12px;cursor:pointer}
.item{padding:1px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item:hover{background:var(--line)} .item.sel{background:var(--acc);color:#fff}
.k{display:inline-block;width:16px;color:var(--mut);font-size:11px}
main{overflow:auto;padding:5px 8px}
#info{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin-bottom:4px;background:var(--pan)}#info .crumbs{margin:0}
#info code{font:13px ui-monospace,monospace}
.var{color:var(--var);font-weight:700}.brw{color:var(--brw)}.own{color:var(--own);font-weight:600}
.badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;margin-left:4px;background:var(--eff);color:var(--fg);border:1px solid var(--effs)}
.badge.err{border-color:var(--var)}
svg text{fill:var(--fg);font:12px system-ui,sans-serif}
svg .node{cursor:pointer} svg .node rect{stroke-width:1.5}
svg .pure rect{fill:var(--pure);stroke:var(--pures)} svg .effect rect{fill:var(--eff);stroke:var(--effs)}
svg .entry rect{fill:var(--ent);stroke:var(--acc);stroke-width:3} svg .ext rect{fill:var(--bg);stroke:var(--mut);stroke-dasharray:4}
svg .cls rect{fill:var(--pan);stroke:var(--mut)} svg .sel rect{stroke:var(--acc);stroke-width:3}
svg path.edge{fill:none;stroke:var(--mut);stroke-width:1.4} svg .elabel{fill:var(--mut);font-size:11px}
.flow ul{list-style:none;margin:0;padding-left:18px;border-left:1px dashed var(--line)}
.flow>ul{border:0;padding:0}
.flow li{margin:2px 0}
.flow .kind{font-size:11px;padding:0 5px;border-radius:4px;margin-right:6px;background:var(--line);color:var(--fg)}
.kind.try{background:var(--var);color:#fff}.kind.spawn{background:#8a4fd6;color:#fff}.kind.scope{background:var(--effs);color:#fff}.kind.exit{background:var(--mut);color:#fff}.kind.native{background:var(--effs);color:#fff}
.flow code{font:12.5px ui-monospace,monospace}
.flow button{border:0;background:none;color:var(--acc);cursor:pointer;font-size:12px}
.hint{color:var(--mut)} label.chk{margin-left:12px;color:var(--mut);font-size:13px}

.crumbs{margin-bottom:2px;color:var(--mut)}.crumbs a{color:var(--acc);cursor:pointer;text-decoration:none}
.tools{display:flex;gap:6px;margin:2px 0;align-items:center;flex-wrap:wrap}.tools button,.tools select{border:1px solid var(--line);background:var(--pan);color:var(--fg);padding:0 8px;border-radius:6px;cursor:pointer}
.stage{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.stage svg{display:block;width:100%;height:calc(100vh - 110px);min-height:320px;cursor:grab}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.chip{padding:1px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:12px}
.chip:hover{border-color:var(--acc)} h4{margin:12px 0 2px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}.route .step{padding:6px 12px;border-radius:8px;border:1.5px solid var(--effs);background:var(--eff);cursor:pointer}.route .arrow{color:var(--mut)}
.more{color:var(--mut)}
svg .more rect{fill:var(--bg);stroke:var(--mut);stroke-dasharray:4}svg .dir rect{fill:var(--pan);stroke:var(--acc)}
svg .chg rect{stroke:var(--var);stroke-width:4px}.chip.chg{border-color:var(--var);color:var(--var)}.gone{text-decoration:line-through;color:var(--mut)}
.tk-kw{color:var(--kw);font-weight:600}.tk-ty{color:var(--ty)}.tk-st{color:var(--st)}.tk-nu{color:var(--nu)}.tk-cm{color:var(--cm);font-style:italic}.tk-fn{color:var(--fnc)}
#theme{margin-left:auto;border:1px solid var(--line);background:var(--pan);color:var(--fg);padding:4px 10px;border-radius:6px;cursor:pointer}
#src{width:min(36vw,440px);border-left:1px solid var(--line);overflow:auto;padding:6px;background:var(--pan)}#src[hidden]{display:none}#src .hd{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px;color:var(--mut);font-size:12px}#src .hd b{color:var(--fg);font-size:13px}.tk-fn.link{cursor:pointer;text-decoration:underline dotted}.tk-fn.link:hover{color:var(--acc)}
pre.code{margin:4px 0;padding:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--pan);overflow:auto;font:12.5px/1.5 ui-monospace,monospace}pre.code .ln{display:inline-block;width:48px;padding-right:12px;text-align:right;color:var(--mut);user-select:none}
svg .life{stroke:var(--line);stroke-dasharray:4}svg .note rect{fill:var(--eff);stroke:var(--effs)}svg .msg{stroke:var(--fg);stroke-width:1.3;fill:none}svg .msg.async{stroke-dasharray:5}svg .msg.ret{stroke:var(--mut);stroke-dasharray:2 3}
</style>
</head>
<body>
<header><h1>Program map</h1>
<nav id="tabs"></nav>
<label class="chk"><input type="checkbox" id="all"> stdlib calls</label><label class="chk" id="onlywrap" hidden><input type="checkbox" id="only"> changed only</label>
<label class="chk">depth <input type="range" id="depth" min="1" max="4" value="1"></label><button id="theme" title="theme">auto</button></header>
<aside><input id="q" placeholder="Search"><div id="list"></div></aside>
<main><div id="info"></div><div id="view"></div></main><section id="src" hidden></section>
<script id="data" type="application/json">__DATA__</script>
<script>
/* compact data: files, modules, entities as arrays with index references */
const R=JSON.parse(document.getElementById('data').textContent);
const D={modules:R.m.map(m=>({file:R.f[m[0]],imports:m[1]})),entities:[]};
const keyOf=a=>R.f[a[0]]+'#'+a[1]+'#'+a[2];
const KEYS=R.e.map(keyOf);
const fl=ns=>ns.map(n=>({kind:n[0],label:n[1],reference:n[2]<0?'':KEYS[n[2]],children:fl(n[3])}));
D.entities=R.e.map((a,i)=>({key:KEYS[i],file:R.f[a[0]],kind:a[1],name:a[2],line:a[3],exported:!!a[4],effects:a[5],error:a[6],scopes:a[7],
  calls:a[8].map(j=>KEYS[j]),external:a[9],slots:a[10].map(s=>({name:s[0],ty:s[1],var:!!s[2],refs:s[3].map(j=>KEYS[j])})),
  result:a[11]?{ty:a[11][0],refs:a[11][1].map(j=>KEYS[j])}:null,_flow:a[12],fi:a[0],first:a[13],last:a[14]}));
const E=Object.fromEntries(D.entities.map(e=>[e.key,e]));
const CH={},GONE=[],chFiles=new Set(),chDirs=new Set();
for(const x of (R.x||[])){if(x[0]>=0){CH[KEYS[x[0]]]={tier:x[2],changes:x[3],name:x[1]};const f=R.f[R.e[x[0]][0]];chFiles.add(f);for(let i=f.indexOf('/');i>=0;i=f.indexOf('/',i+1))chDirs.add(f.slice(0,i+1))}else GONE.push({name:x[1],tier:x[2],changes:x[3]})}
const HAS=!!R.x;
const chgOf=n=>n.kind==='mod'?chFiles.has(n.id):n.kind==='dir'?chDirs.has(n.id):!!CH[n.id];
/* flows decode on first use, so a large program loads fast */
for(const e of D.entities)Object.defineProperty(e,'flow',{get(){const v=fl(e._flow);Object.defineProperty(e,'flow',{value:v});return v},configurable:true});
const callers={};for(const e of D.entities)for(const c of e.calls)(callers[c]=callers[c]||[]).push(e.key);
const TABS=['Overview','Calls','Sequence','Types','Behavior','Route'];
const S={tab:'Overview',sel:null,mod:null,scope:'',cap:40,from:null,to:null,dir:'both'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isType=e=>['record','alternative','interface'].includes(e.kind);
const isFn=e=>['fn','method','test','bench'].includes(e.kind);
const KI={fn:'ƒ',method:'ƒ',record:'T',alternative:'T',interface:'I',constant:'c',test:'t',bench:'t',impl:'i'};
const KW=new Set('and break case continue else export extern false fixture fn for if impl import in interface let match not or ref return self test true try type unit var while'.split(' '));
const TK=/(\/\/.*)|("(?:\\.|[^"\\])*")|(\b\d[\d_.]*[a-zA-Z]*)|([A-Za-z_]\w*)|(\s+|.)/g;
function hl(line,cm){let o='',m;TK.lastIndex=0;
  while((m=TK.exec(line))){const t=m[0];
    if(m[1])o+='<span class="tk-cm">'+esc(t)+'</span>';
    else if(m[2])o+='<span class="tk-st">'+esc(t)+'</span>';
    else if(m[3])o+='<span class="tk-nu">'+esc(t)+'</span>';
    else if(m[4]){const nx=line[TK.lastIndex];
      o+=KW.has(t)?'<span class="tk-kw">'+t+'</span>':/^[A-Z]/.test(t)?'<span class="tk-ty">'+t+'</span>':nx==='('?(cm&&cm[t]?'<span class="tk-fn link" data-key="'+esc(cm[t])+'">'+t+'</span>':'<span class="tk-fn">'+t+'</span>'):t}
    else o+=esc(t)}
  return o}
const base=f=>f.split('/').pop();
const dirOf=f=>f.slice(0,f.lastIndexOf('/')+1);
const fx=e=>e.effects.filter(x=>x!=='unknown');
const byFile={};for(const e of D.entities)(byFile[e.file]=byFile[e.file]||[]).push(e);
function sigOf(e){
  if(!isFn(e)){const kw=e.kind==='interface'?'interface':e.kind==='record'||e.kind==='alternative'?'type':e.kind;return '<code><span class="tk-kw">'+esc(kw)+'</span> '+esc(e.name)+'</code>'}
  const ps=e.slots.map(s=>(s.var?'<span class="var">var </span>':'')+esc(s.name)+': <span class="'+(s.var?'var':'brw')+'">'+esc(s.ty)+'</span>').join(', ');
  return '<code>'+esc(e.name)+'('+ps+') '+(e.result?'<span class="own">'+esc(e.result.ty)+'</span>':'')+'</code>';
}
const fns=D.entities.filter(e=>e.kind==='fn'||e.kind==='method');
const firstN=(l,n)=>l.slice(0,n);
const LAND={
  'Entry':firstN(fns.filter(e=>e.name==="main"),5).concat(firstN(fns.filter(e=>e.exported&&e.name!=='main'),3)),
  'Hubs':firstN(fns.filter(e=>(callers[e.key]||[]).length>1).sort((a,b)=>callers[b.key].length-callers[a.key].length),6),
  'Effects':firstN(fns.filter(e=>fx(e).length&&!e.calls.length),6)
};
function setTabs(){$('onlywrap').hidden=!HAS;$('tabs').innerHTML=TABS.map(t=>'<button class="'+(t===S.tab?'on':'')+'" data-tab="'+t+'">'+t+'</button>').join('')}
function scopeKids(scope){
  const dirs=new Set(),mods=[];
  for(const m of D.modules)if(m.file.startsWith(scope)){const rest=m.file.slice(scope.length),i=rest.indexOf('/');if(i<0)mods.push(m.file);else dirs.add(scope+rest.slice(0,i+1))}
  return {dirs:[...dirs],mods};
}
function normScope(){let k=scopeKids(S.scope);while(!k.mods.length&&k.dirs.length===1){S.scope=k.dirs[0];k=scopeKids(S.scope)}return k}
function setList(){
  const q=$('q').value.toLowerCase();let h='';
  if(q){
    const ms=D.modules.filter(m=>m.file.toLowerCase().includes(q)).slice(0,20);
    const es=D.entities.filter(e=>isFn(e)||isType(e)).filter(e=>e.name.toLowerCase().includes(q)).slice(0,60);
    h+=ms.map(m=>'<div class="file" data-mod="'+esc(m.file)+'">'+esc(m.file)+'</div>').join('');
    h+=es.map(e=>'<div class="item" data-key="'+esc(e.key)+'" title="'+esc(e.file)+'"><span class="k">'+(KI[e.kind]||'·')+'</span>'+esc(e.name)+'</div>').join('');
    if(!ms.length&&!es.length)h='<div class="hint">no match</div>';
    $('list').innerHTML=h;return;
  }
  if(HAS){const ks=Object.keys(CH);h+='<h4>Changed ('+(ks.length+GONE.length)+')</h4><div class="chips">'+ks.slice(0,40).map(k=>'<span class="chip chg" data-key="'+esc(k)+'" title="'+esc(CH[k].tier)+'">'+esc(CH[k].name)+'</span>').join('')+GONE.slice(0,10).map(g=>'<span class="chip gone" title="removed">'+esc(g.name)+'</span>').join('')+(ks.length>40?'<span class="hint">+'+(ks.length-40)+'</span>':'')+'</div>'}
  for(const [t,l] of Object.entries(LAND))if(l.length)h+='<h4>'+t+'</h4><div class="chips">'+l.map(e=>'<span class="chip" data-key="'+esc(e.key)+'" title="'+esc(e.file)+'">'+esc(e.name)+'</span>').join('')+'</div>';
  const k=normScope();
  h+='<h4>'+esc(S.scope||'/')+'</h4>';
  h+=k.dirs.slice(0,60).map(d=>'<div class="file" data-scope="'+esc(d)+'">▸ '+esc(d.slice(S.scope.length))+'</div>').join('');
  const openMod=S.mod||(S.sel&&E[S.sel]&&E[S.sel].file);
  for(const f of k.mods.slice(0,80)){
    h+='<div class="file" data-mod="'+esc(f)+'">'+(f===openMod?'▾ ':'▸ ')+esc(base(f))+'</div>';
    if(f===openMod)for(const e of (byFile[f]||[]).filter(e=>isFn(e)||isType(e)).slice(0,100))h+='<div class="item'+(S.sel===e.key?' sel':'')+'" data-key="'+esc(e.key)+'"><span class="k">'+(KI[e.kind]||'·')+'</span>'+esc(e.name)+'</div>';
  }
  const more=k.mods.length-80;if(more>0)h+='<div class="hint">+'+more+' more — search</div>';
  $('list').innerHTML=h;
}
function crumbs(){
  const e=S.sel&&E[S.sel],file=(e&&e.file)||S.mod;
  let c='<a data-scope="">System</a>',p='';
  const path=file?dirOf(file):S.scope;
  for(const seg of path.split('/').filter(Boolean)){p+=seg+'/';c+=' › <a data-scope="'+esc(p)+'">'+esc(seg)+'</a>'}
  if(file)c+=' › <a data-mod="'+esc(file)+'">'+esc(base(file))+'</a>';
  if(e)c+=' › <b>'+esc(e.name)+'</b>';
  return '<div class="crumbs">'+c+'</div>';
}
function setInfo(){
  const e=S.sel&&E[S.sel];let h=crumbs();
  if(e){
    h+=sigOf(e)+' <span class="hint">'+esc(e.kind)+' '+e.line+'</span> ';
    h+=fx(e).map(x=>'<span class="badge">'+esc(x)+'</span>').join('')+(e.error?'<span class="badge err">err '+esc(e.error)+'</span>':'')+(e.scopes?'<span class="badge">closes '+e.scopes+'</span>':'');
    if(CH[e.key])h+=' <span class="badge err">'+esc(CH[e.key].tier)+'</span> '+CH[e.key].changes.map(esc).join('; ');
    const cs=callers[e.key]||[];
    if(cs.length)h+=' <span class="hint">callers</span> '+cs.slice(0,8).map(k=>'<a href="#" data-key="'+esc(k)+'">'+esc(E[k].name)+'</a>').join(', ')+(cs.length>8?' +'+(cs.length-8):'');
    if(isFn(e))h+=' <a href="#" data-routefrom="1">route from here</a>';
  }
  $('info').innerHTML=h;
}
/* pan and zoom through the viewBox */
function panzoom(box){
  const svg=box.querySelector('svg');if(!svg)return;
  const w=+svg.dataset.w,h=+svg.dataset.h;let vb={x:0,y:0,w:Math.max(w,300),h:Math.max(h,200)};
  const apply=()=>svg.setAttribute('viewBox',vb.x+' '+vb.y+' '+vb.w+' '+vb.h);
  const fit=()=>{const r=svg.getBoundingClientRect();const k=Math.max(w/r.width,h/r.height,1);vb={x:0,y:0,w:r.width*k,h:r.height*k};apply()};
  const zoom=(f,cx,cy)=>{cx=cx??vb.x+vb.w/2;cy=cy??vb.y+vb.h/2;vb={x:cx-(cx-vb.x)*f,y:cy-(cy-vb.y)*f,w:vb.w*f,h:vb.h*f};apply()};
  svg.addEventListener('wheel',ev=>{ev.preventDefault();const r=svg.getBoundingClientRect();zoom(ev.deltaY>0?1.15:1/1.15,vb.x+(ev.clientX-r.left)/r.width*vb.w,vb.y+(ev.clientY-r.top)/r.height*vb.h)},{passive:false});
  let drag=null;
  svg.addEventListener('pointerdown',ev=>{if(ev.target.closest('.node'))return;drag={x:ev.clientX,y:ev.clientY,vx:vb.x,vy:vb.y};svg.style.cursor='grabbing'});
  addEventListener('pointerup',()=>{drag=null;svg.style.cursor=''});
  addEventListener('pointermove',ev=>{if(!drag)return;const r=svg.getBoundingClientRect();vb.x=drag.vx-(ev.clientX-drag.x)/r.width*vb.w;vb.y=drag.vy-(ev.clientY-drag.y)/r.height*vb.h;apply()});
  box.querySelector('[data-zoom="in"]').onclick=()=>zoom(1/1.3);box.querySelector('[data-zoom="out"]').onclick=()=>zoom(1.3);box.querySelector('[data-zoom="fit"]').onclick=fit;
  const r=svg.getBoundingClientRect();if(w<=r.width*1.5&&h<=r.height*1.5)fit();else{vb={x:0,y:0,w:r.width,h:r.height};apply()}
}
function stage(svg,note){return '<div class="tools"><button data-zoom="in">＋</button><button data-zoom="out">－</button><button data-zoom="fit">fit</button>'+(note?'<span class="hint">'+note+'</span>':'')+'</div><div class="stage">'+svg+'</div>'}
/* layered layout; iterative so depth never overflows the stack */
function graph(nodes,edges){
  const ix=Object.fromEntries(nodes.map((n,i)=>[n.id,i]));
  const out=nodes.map(()=>[]);edges.forEach(e=>{if(ix[e.from]!==undefined&&ix[e.to]!==undefined&&e.from!==e.to)out[ix[e.from]].push(ix[e.to])});
  const st=nodes.map(()=>0),layer=nodes.map(()=>0);
  for(let s=0;s<nodes.length;s++){if(st[s])continue;const stack=[[s,0]];st[s]=1;
    while(stack.length){const f=stack[stack.length-1],u=f[0];
      if(f[1]<out[u].length){const v=out[u][f[1]++];if(st[v]===0){st[v]=1;stack.push([v,0])}}
      else{for(const v of out[u])if(st[v]===2)layer[u]=Math.max(layer[u],layer[v]+1);st[u]=2;stack.pop()}}}
  const max=Math.max(0,...layer),cols=[];
  nodes.forEach((n,i)=>{const c=max-layer[i];(cols[c]=cols[c]||[]).push(i)});
  const W=210,GX=90,GY=24,pos=[];let H=0;
  if(max>5&&nodes.length>12){cols.length=0;nodes.forEach((_,i)=>{const c=Math.floor(i/8);(cols[c]=cols[c]||[]).push(i)})}
  const wrapped=[];cols.forEach(c=>{if(!c)return;for(let i=0;i<c.length;i+=10)wrapped.push(c.slice(i,i+10))});cols.length=0;wrapped.forEach(c=>cols.push(c));
  cols.forEach((c,ci)=>{if(!c)return;let y=10;c.forEach(i=>{const h=Math.max(40,18+14*(nodes[i].lines||[]).length+14);pos[i]={x:10+ci*(W+GX),y,h};y+=h+GY});H=Math.max(H,y)});
  const width=10+cols.length*(W+GX);
  const parts=['<svg data-w="'+width+'" data-h="'+H+'" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor" style="color:var(--mut)"/></marker></defs>'];
  for(const e of edges){const a=pos[ix[e.from]],b=pos[ix[e.to]];if(!a||!b||e.from===e.to)continue;
    const x1=a.x+W,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2;let d;
    if(x2>x1)d='M'+x1+' '+y1+'C'+(x1+GX/2)+' '+y1+' '+(x2-GX/2)+' '+y2+' '+x2+' '+y2;
    else d='M'+a.x+' '+y1+'C'+(a.x-GX/2)+' '+y1+' '+(b.x+W+GX/2)+' '+y2+' '+(b.x+W)+' '+y2;
    parts.push('<path class="edge" d="'+d+'" marker-end="url(#a)"/>');
    if(e.label)parts.push('<text class="elabel" x="'+((x1+x2)/2)+'" y="'+((y1+y2)/2-4)+'" text-anchor="middle">'+esc(e.label)+'</text>')}
  nodes.forEach((n,i)=>{const p=pos[i];if(!p)return;
    parts.push('<g class="node '+(n.cls||'')+(chgOf(n)?' chg':'')+(n.id===S.sel||n.id===S.mod?' sel':'')+'" data-id="'+esc(n.id)+'" data-kind="'+(n.kind||'')+'"><title>'+esc(n.tip||n.title)+'</title><rect x="'+p.x+'" y="'+p.y+'" width="'+W+'" height="'+p.h+'" rx="7"/><text x="'+(p.x+W/2)+'" y="'+(p.y+18)+'" text-anchor="middle" font-weight="600">'+esc(n.title.slice(0,26))+'</text>');
    (n.lines||[]).forEach((l,j)=>parts.push('<text x="'+(p.x+10)+'" y="'+(p.y+36+14*j)+'">'+esc(l)+'</text>'));
    if(n.sub)parts.push('<text x="'+(p.x+W/2)+'" y="'+(p.y+p.h-8)+'" text-anchor="middle" class="elabel">'+esc(n.sub.slice(0,30))+'</text>');
    parts.push('</g>')});
  return stage(parts.join('')+'</svg>');
}
const fcls=x=>x.name==='main'?'entry':fx(x).length?'effect':'pure';
/* overview: the current folder's modules and subfolders, or one module's functions; capped and ranked */
function overview(){
  normScope();
  const open=S.mod,scope=S.scope,agg={},cnt={},weight={};
  const endpoint=e=>{
    if(open&&e.file===open)return {id:e.key,kind:'fn'};
    if(!e.file.startsWith(scope))return null;
    const rest=e.file.slice(scope.length),i=rest.indexOf('/');
    return i<0?{id:e.file,kind:'mod'}:{id:scope+rest.slice(0,i+1),kind:'dir'};
  };
  for(const e of D.entities)for(const c of e.calls){const t=E[c];if(!t)continue;const a=endpoint(e),b=endpoint(t);if(!a||!b||a.id===b.id)continue;
    agg[a.id]=a.kind;agg[b.id]=b.kind;const k=a.id+'\u0000'+b.id;cnt[k]=(cnt[k]||0)+1;weight[a.id]=(weight[a.id]||0)+1;weight[b.id]=(weight[b.id]||0)+1}
  const kids=scopeKids(scope);
  for(const m of kids.mods)if(!(m in agg)&&!open){agg[m]='mod';weight[m]=0}
  for(const d of kids.dirs)if(!(d in agg)&&!open){agg[d]='dir';weight[d]=0}
  if(open)for(const e of byFile[open]||[])if(isFn(e)&&!(e.key in agg)){agg[e.key]='fn';weight[e.key]=0}
  const isc=id=>chgOf({id,kind:agg[id]});
  if(HAS)for(const id of Object.keys(agg))if(isc(id))weight[id]=(weight[id]||0)+1e6;
  let ids=Object.keys(agg).sort((a,b)=>(weight[b]-weight[a])||a.localeCompare(b));
  if(HAS&&$('only').checked){const near=new Set(ids.filter(isc));for(const k of Object.keys(cnt)){const [a,b]=k.split('\u0000');if(isc(a))near.add(b);if(isc(b))near.add(a)}ids=ids.filter(i=>near.has(i))}
  const keep=new Set(ids.slice(0,S.cap));if(S.sel&&agg[S.sel])keep.add(S.sel);
  const nodes=[...keep].map(id=>{const kind=agg[id];
    if(kind==='fn'){const x=E[id];return {id,title:x.name,sub:fx(x).join(' · ')||'pure',cls:fcls(x),kind}}
    if(kind==='dir'){const n=D.modules.filter(m=>m.file.startsWith(id)).length;return {id,title:id.slice(scope.length),sub:n+' modules',cls:'dir',kind,tip:id}}
    const es=byFile[id]||[],f=new Set();es.forEach(x=>fx(x).forEach(y=>f.add(y)));
    return {id,title:base(id),sub:[...f].join(' · ')||'pure',cls:es.some(x=>x.name==='main')?'entry':f.size?'effect':'pure',kind,tip:id}});
  const rest=ids.length-keep.size;
  if(rest>0)nodes.push({id:'+more',title:'+'+rest+' more',sub:'click to show '+Math.min(S.cap,rest)+' more',cls:'more',kind:'more'});
  const edges=Object.entries(cnt).map(([k,n])=>{const [a,b]=k.split('\u0000');return {from:a,to:b,label:n>1?String(n):'',n}}).filter(e=>keep.has(e.from)&&keep.has(e.to)).sort((a,b)=>b.n-a.n).slice(0,Math.max(30,nodes.length*2));
  if(!nodes.length)return '<p class="hint">nothing here</p>';
  return '<p class="hint">double-click to open</p>'+graph(nodes,edges);
}
function calls(){
  const e=S.sel&&E[S.sel];if(!e||!isFn(e))return '<p class="hint">pick a function</p>';
  const depth=+$('depth').value,nodes={},edges=[];let n=0;
  const add=k=>{if(nodes[k]||n>=60)return;n++;const x=E[k];nodes[k]={id:k,title:x.name,sub:base(x.file),cls:fcls(x),kind:'fn',tip:x.file+':'+x.line}};
  add(e.key);
  const edge=(a,b)=>{if(nodes[a]&&nodes[b])edges.push({from:a,to:b})};
  const up=(k,d,seen)=>{if(d>=depth||seen.has(k))return;seen.add(k);for(const c of (callers[k]||[]).slice(0,12)){add(c);edge(c,k);up(c,d+1,seen)}};
  const seen=new Set();
  const down=(k,d)=>{if(d>=depth||seen.has(k))return;seen.add(k);for(const c of E[k].calls.slice(0,16)){add(c);edge(k,c);down(c,d+1)}
    if($('all').checked)for(const x of E[k].external.slice(0,6)){const id='x:'+x;if(!nodes[id]&&n<60){n++;nodes[id]={id,title:x.split('#').pop(),cls:'ext',kind:'ext'}}edge(k,id)}};
  if(S.dir!=='down')up(e.key,0,new Set());if(S.dir!=='up')down(e.key,0);
  return '<div class="tools"><select id="dir"><option value="both">callers + callees</option><option value="up">callers</option><option value="down">callees</option></select></div>'+graph(Object.values(nodes),edges);
}
function types(){
  const nodes={},edges=[];let n=0;const roots=S.sel&&E[S.sel]?[E[S.sel]]:D.entities.filter(e=>isType(e)&&(!S.mod||e.file===S.mod)).slice(0,30);
  const add=x=>{if(nodes[x.key]||n>=40)return;n++;nodes[x.key]={id:x.key,title:(x.kind==='interface'?'interface ':x.kind==='record'||x.kind==='alternative'?'type ':'')+x.name,cls:'cls',kind:'type',
    lines:x.slots.map(s=>x.kind==='record'?s.name+': '+s.ty:x.kind==='alternative'?'case '+s.name+s.ty:s.name+s.ty).slice(0,8)};
    x.slots.forEach(s=>s.refs.forEach(r=>{const t=E[r];if(t){add(t);if(nodes[r])edges.push({from:x.key,to:r,label:s.name})}}));
    if(x.result)x.result.refs.forEach(r=>{const t=E[r];if(t){add(t);if(nodes[r])edges.push({from:x.key,to:r,label:'returns'})}})};
  roots.forEach(r=>{if(isFn(r)){nodes[r.key]={id:r.key,title:'fn '+r.name,cls:'cls',lines:r.slots.map(s=>(s.var?'var ':'')+s.name+': '+s.ty)}}add(r)});
  const list=Object.values(nodes);if(!list.length)return '<p class="hint">no types</p>';
  return graph(list,edges);
}
/* sequence: lifelines for functions, messages in execution order */
function sequence(){
  const e=S.sel&&E[S.sel];if(!e||!isFn(e))return '<p class="hint">pick a function</p>';
  const depth=+$('depth').value+1,all=$('all').checked,ev=[],parts=[];let cap=0;
  const part=k=>{if(!parts.includes(k)&&parts.length<14)parts.push(k)};
  const walk=(k,nodes,d,path)=>{for(const n of nodes){if(cap>160)return;
    const ref=n.reference&&E[n.reference];
    if(n.kind==='call'&&ref){cap++;part(n.reference);if(!parts.includes(n.reference))continue;ev.push({t:'msg',from:k,to:n.reference,label:n.label.replace(/^call\s+/,'')});
      if(d>0&&!path.includes(n.reference))walk(n.reference,ref.flow,d-1,path.concat(n.reference));
      if(ev[ev.length-1].t!=='msg')ev.push({t:'ret',from:n.reference,to:k})}
    else if(n.kind==='native'&&all){cap++;part('stdlib');if(parts.includes('stdlib'))ev.push({t:'msg',from:k,to:'stdlib',label:n.label.replace(/^call\s+/,'')})}
    else if(n.kind==='spawn'){cap++;ev.push({t:'note',at:k,label:'spawn'});walk(k,n.children||[],d,path);continue}
    else if(['try','scope','branch','match'].includes(n.kind)){cap++;ev.push({t:'note',at:k,label:(n.kind==='try'?'try ⚠ ':'')+n.label.slice(0,30)})}
    if(n.children&&n.children.length&&!(n.kind==='call'&&ref))walk(k,n.children,d,path)}};
  part(e.key);walk(e.key,e.flow,depth-1,[e.key]);
  const X=170,top=50,row=30,W=140;const px=k=>20+parts.indexOf(k)*X+W/2;const H=top+ev.length*row+40;
  const sv=['<svg data-w="'+(40+parts.length*X)+'" data-h="'+H+'" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor" style="color:var(--fg)"/></marker></defs>'];
  parts.forEach(k=>{const x=px(k),t=E[k]?E[k].name:'stdlib';
    sv.push('<line class="life" x1="'+x+'" y1="'+(top-6)+'" x2="'+x+'" y2="'+H+'"/><g class="node '+(E[k]?fcls(E[k]):'ext')+'" data-id="'+esc(k)+'" data-kind="'+(E[k]?'fn':'ext')+'"><title>'+esc(t)+'</title><rect x="'+(x-W/2)+'" y="8" width="'+W+'" height="32" rx="6"/><text x="'+x+'" y="29" text-anchor="middle" font-weight="600">'+esc(t.slice(0,20))+'</text></g>')});
  ev.forEach((v,i)=>{const y=top+i*row+14;
    if(v.t==='note'){const x=px(v.at),w=Math.min(190,v.label.length*6.4+14);sv.push('<g class="note"><rect x="'+(x+6)+'" y="'+(y-12)+'" width="'+w+'" height="20" rx="4"/><text x="'+(x+12)+'" y="'+(y+2)+'">'+esc(v.label)+'</text></g>');return}
    const a=px(v.from),b=px(v.to);if(v.from===v.to)return;
    sv.push('<path class="msg '+(v.t==='ret'?'ret':'')+'" d="M'+a+' '+y+'L'+b+' '+y+'" marker-end="url(#a)"/>');
    if(v.t==='msg')sv.push('<text x="'+((a+b)/2)+'" y="'+(y-4)+'" text-anchor="middle">'+esc(v.label.slice(0,32))+'</text>')});
  return stage(sv.join('')+'</svg>','time runs down · dotted = return');
}
function flowHTML(nodes,level){
  return '<ul>'+nodes.map(n=>{const ref=n.reference&&E[n.reference];
    return '<li><span class="kind '+esc(n.kind)+'">'+esc(n.kind||'step')+'</span><code>'+hl(n.label)+'</code>'+(ref&&ref._flow.length&&level<6?' <button data-expand="'+esc(n.reference)+'">expand ▸</button>':'')+(n.children&&n.children.length?flowHTML(n.children,level):'')+'<span class="callee"></span></li>'}).join('')+'</ul>';
}
function behavior(){
  const e=S.sel&&E[S.sel];if(!e||!isFn(e))return '<p class="hint">pick a function</p>';
  return '<div class="flow">'+(e.flow.length?flowHTML(e.flow,0):'<span class="hint">no steps</span>')+'</div>';
}
function srcPanel(){
  const box=$('src'),e=S.sel&&E[S.sel];
  const src=e?R.s[e.fi]||'':'';
  if(!e||!src||!e.first){box.hidden=true;return}
  let ls=src.split('\n').slice(e.first-1,e.last);while(ls.length&&!ls[ls.length-1].trim())ls.pop();
  const cm={};for(const k of e.calls){const c=E[k];if(c)cm[c.name]=k}
  box.hidden=false;
  box.innerHTML='<div class="hd"><span><b>'+esc(e.name)+'</b> '+esc(e.file)+':'+e.first+'</span><span><button data-copy="1">copy</button> <button data-close="1">x</button></span></div><pre class="code">'+ls.map((l,i)=>'<span class="ln">'+(e.first+i)+'</span>'+hl(l,cm)).join('\n')+'</pre>'}
function route(){
  const opt=(sel)=>sel&&E[sel]?'<option value="'+esc(sel)+'" selected>'+esc(E[sel].name)+'</option>':'';
  let h='<div class="tools"><input id="rf" list="fl" placeholder="from" value="'+(S.from?esc(E[S.from].name):'')+'"> → <input id="rt" list="fl" placeholder="to" value="'+(S.to?esc(E[S.to].name):'')+'"><datalist id="fl"></datalist></div>';
  if(S.from&&S.to){
    const prev={[S.from]:null},q=[S.from];while(q.length){const u=q.shift();if(u===S.to)break;for(const v of E[u].calls)if(!(v in prev)){prev[v]=u;q.push(v)}}
    if(!(S.to in prev))h+='<p class="hint">no call path</p>';
    else{const p=[];for(let k=S.to;k!==null;k=prev[k])p.unshift(k);
      h+='<div class="route">'+p.map((k,i)=>(i?'<span class="arrow">→</span>':'')+'<span class="step" data-key="'+esc(k)+'">'+esc(E[k].name)+'</span>').join('')+'</div>'}
  }else h+='<p class="hint">type a function name in each box</p>';
  return h;
}
const VIEWS={Overview:overview,Calls:calls,Sequence:sequence,Types:types,Behavior:behavior,Route:route};
function save(){try{history.replaceState(null,'','#'+encodeURIComponent(JSON.stringify({t:S.tab,s:S.sel,m:S.mod,c:S.scope,f:S.from,o:S.to})))}catch(_){}}
function pickFn(text){const t=text.trim().toLowerCase();const exact=fns.filter(f=>f.name.toLowerCase()===t);return (exact[0]||fns.find(f=>f.name.toLowerCase().includes(t))||{}).key||null}
const FNTABS=['Calls','Sequence','Behavior'];
function fitTab(){const e=S.sel&&E[S.sel];if(e&&!isFn(e)&&FNTABS.includes(S.tab)){S.tab='Types';return true}return false}
function render(){fitTab();setTabs();setList();setInfo();srcPanel();$('view').innerHTML=VIEWS[S.tab]();
  const d=$('dir');if(d){d.value=S.dir;d.onchange=()=>{S.dir=d.value;render()}}
  const rf=$('rf');if(rf){const dl=$('fl');dl.innerHTML=fns.slice(0,2000).map(f=>'<option value="'+esc(f.name)+'">').join('');
    rf.onchange=()=>{S.from=pickFn(rf.value);render()};$('rt').onchange=()=>{S.to=pickFn($('rt').value);render()}}
  const box=$('view');if(box.querySelector('svg'))panzoom(box);save()}
const THEMES=['auto','dark','light'];let theme='auto';
try{theme=localStorage.getItem('theme')||'auto'}catch(_){}
function applyTheme(){const r=document.documentElement;if(theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',theme);$('theme').textContent=theme}
$('theme').addEventListener('click',()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%3];try{localStorage.setItem('theme',theme)}catch(_){}applyTheme()});
applyTheme();
let timer=null;
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-copy],[data-close],[data-tab],[data-key],[data-mod],[data-scope],[data-id],[data-expand],[data-routefrom]');if(!t)return;ev.preventDefault();
  if(t.dataset.close){S.sel=null;render();return}
  if(t.dataset.copy){try{navigator.clipboard.writeText(document.querySelector('pre.code').innerText.replace(/^\d+/gm,''))}catch(_){}return}
  if(t.dataset.tab)S.tab=t.dataset.tab;
  else if(t.dataset.expand){const li=t.closest('li');const e=E[t.dataset.expand];const slot=li.querySelector('.callee');
    if(slot.innerHTML){slot.innerHTML='';t.textContent='expand ▸'}else{slot.innerHTML=flowHTML(e.flow,1);t.textContent='collapse ▾'}return}
  else if(t.dataset.routefrom){S.from=S.sel;S.to=null;S.tab='Route'}
  else if(t.dataset.scope!==undefined){S.scope=t.dataset.scope;S.mod=null;S.sel=null;S.cap=40;S.tab='Overview'}
  else if(t.dataset.key){S.sel=t.dataset.key;S.mod=null;if(S.tab==='Overview')S.tab='Calls';if(S.tab==='Route'){if(!S.from)S.from=S.sel;else S.to=S.sel}}
  else if(t.dataset.mod){S.mod=t.dataset.mod;S.scope=dirOf(S.mod);S.sel=null;S.tab='Overview'}
  else if(t.dataset.id){const id=t.dataset.id,k=t.dataset.kind;
    if(k==='more'){S.cap+=40;render();return}
    if(k==='mod'){S.mod=id;S.sel=null}else if(E[id]){S.sel=id;S.mod=null;if(fitTab()){render();return}}
    document.querySelectorAll('.node.sel').forEach(n=>n.classList.remove('sel'));t.closest('.node').classList.add('sel');setList();setInfo();srcPanel();save();return}
  render()});
document.addEventListener('dblclick',ev=>{const n=ev.target.closest('.node');if(!n)return;const id=n.dataset.id,k=n.dataset.kind;
  if(k==='dir'){S.scope=id;S.mod=null;S.sel=null;S.cap=40;S.tab='Overview'}
  else if(k==='mod'){S.mod=id;S.scope=dirOf(id);S.sel=null;S.tab='Overview'}
  else if(E[id]){S.sel=id;S.mod=null;S.tab='Sequence'}else return;render()});
$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(setList,120)});$('all').addEventListener('change',render);$('only').addEventListener('change',render);$('depth').addEventListener('input',render);
try{const h=JSON.parse(decodeURIComponent(location.hash.slice(1)));if(h&&TABS.includes(h.t)){S.tab=h.t;S.sel=E[h.s]?h.s:null;S.mod=h.m||null;S.scope=h.c||'';S.from=E[h.f]?h.f:null;S.to=E[h.o]?h.o:null}else throw 0}catch(_){const main=D.entities.find(e=>e.name==='main'&&e.kind==='fn');if(main){S.sel=main.key;S.scope=dirOf(main.file);S.tab='Sequence'}}
render();
